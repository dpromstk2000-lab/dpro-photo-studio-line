name: DPRO PHOTO Tutorial R3-R4

on:
  push:
    paths:
      - '.github/workflows/STEP-PHOTO-TUTORIAL-R3-R4.yml'

permissions:
  contents: write

jobs:
  tutorial-r3-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: R3 entry source gate
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED='09a21a8016fc06500d7ddfb74e6303764d687d3b'
          git fetch origin main --quiet
          git merge-base --is-ancestor "$ACCEPTED" HEAD
          echo "WORKFLOW_HEAD=$(git rev-parse HEAD)"
          echo "WORKFLOW_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD:index.html)" = '3b27c2712c64bb2a074ecf6dab55c8ed68305e3d'
          test "$(git rev-parse HEAD:member.html)" = '89b836e6b92043af0e1d8b847f06d34d7911980e'
          test "$(git rev-parse HEAD:owner-ipad.html)" = '15f15850ae1abd3f950bce1c2b0a4c2950b4a85f'
          test "$(git rev-parse HEAD:owner.html)" = '01074406be0b12ff7a8b9d26054ce6456965ce29'
          echo 'ENTRY_SOURCE_GATE=PASS'

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/photo-tutorial-qa
          cd /tmp/photo-tutorial-qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh pre-product-write LIVE baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo-tutorial-qa/pre.mjs
          cd /tmp/photo-tutorial-qa
          node pre.mjs
          cat /tmp/photo-r3-entry.json

      - name: Implement R3 First10
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch-r3.py
          python /tmp/patch-r3.py
          node --check tutorial-data.js
          node --check tutorial.js
          python - <<'PY2'
          from pathlib import Path
          d=Path('tutorial-data.js').read_text()
          j=Path('tutorial.js').read_text()
          assert d.count('step: ') == 10
          assert 'dpro_tutorial_photo_v1_1' in d
          for forbidden in ['fetch(', 'apiPost(', 'adminPost(', '.submit(', 'agreementCheck.checked', '.click()']:
              assert forbidden not in j, forbidden
          assert 'pointerdown' in j and 'ArrowLeft' in j and 'Escape' in j
          assert 'localStorage' in j and 'sessionStorage' not in j
          print('STATIC_R3=PASS')
          PY2

      - name: Commit R3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dpro-tutorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js index.html owner-ipad.html member.html owner.html tutorial-data.js tutorial.css tutorial.js
          git commit -m 'Implement PHOTO Tutorial R3 First10 V1.1'
          echo "R3_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Wait R3 Pages
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-photo-studio-line/tutorial-data.js?wait=1'
          for i in $(seq 1 48); do
            if curl -fsSL --max-time 15 "$URL&n=$i" | grep -q 'DPRO-TUTORIAL-PHOTO-V1.1-R4-20260828'; then echo 'R3_PAGES_READY=PASS'; exit 0; fi
            sleep 5
          done
          echo 'R3 Pages sentinel timeout' >&2; exit 1

      - name: R3 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo-tutorial-qa/r3.mjs
          cd /tmp/photo-tutorial-qa
          node r3.mjs
          cat /tmp/photo-r3-qa.json

      - name: Implement R4 Guide Center
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch-r4.py
          python /tmp/patch-r4.py
          grep -q 'id="tutorialFirst10"' demo-guide.html
          grep -q 'tutorial-data.js?v=DPRO-TUTORIAL-PHOTO-V1.1-R4-20260828' demo-guide.html
          git add demo-guide.html
          git commit -m 'Build PHOTO Tutorial R4 Guide Center'
          echo "R4_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Wait R4 Pages
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-photo-studio-line/demo-guide.html?wait=1'
          for i in $(seq 1 48); do
            if curl -fsSL --max-time 15 "$URL&n=$i" | grep -q 'tutorialFirst10'; then echo 'R4_PAGES_READY=PASS'; exit 0; fi
            sleep 5
          done
          echo 'R4 Pages sentinel timeout' >&2; exit 1

      - name: R4 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo-tutorial-qa/r4.mjs
          cd /tmp/photo-tutorial-qa
          node r4.mjs
          cat /tmp/photo-r4-qa.json

      - name: Commit evidence and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/photo-r4
          cp /tmp/photo-r3-entry.json tutorial-evidence/photo-r4/R3_ENTRY_BASELINE.json
          cp /tmp/photo-r3-qa.json tutorial-evidence/photo-r4/R3_QA.json
          cp /tmp/photo-r4-qa.json tutorial-evidence/photo-r4/R4_QA.json
          cat > tutorial-evidence/photo-r4/IMPLEMENTATION_SUMMARY.txt <<EOF2
          SYSTEM=PHOTO
          STANDARD=V1.1
          FIRST10=10_EXACT
          R3_QA=PASS
          R4_QA=PASS
          BUSINESS_MUTATION=0
          R3_COMMIT=$R3_COMMIT
          R4_COMMIT=$R4_COMMIT
          CHANGED_PRODUCT_FILES=config.js,index.html,owner-ipad.html,member.html,owner.html,tutorial-data.js,tutorial.css,tutorial.js,demo-guide.html
          DB_WORKER_API_AUTH_ROLE_PERMISSION_FEATURE_FLAG_CHANGE=0
          R5=NOT_STARTED
          R7=NOT_AUTHORIZED
          EOF2
          git add tutorial-evidence/photo-r4
          git rm .github/workflows/STEP-PHOTO-TUTORIAL-R3-R4.yml
          git commit -m 'Finalize PHOTO Tutorial R4 evidence and cleanup'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"

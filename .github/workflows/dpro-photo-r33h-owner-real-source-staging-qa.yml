name: DPRO PHOTO R33H Real Owner Source Staging QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-deploy-owner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read source only (no Git credentials persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify official owner HTML revision
        shell: bash
        run: |
          test "$(git hash-object owner.html)" = "44708c5524c15ecba5ba911c0bfea5ed23776f80"
      - name: Restore staged integration and source verified by SHA256
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          p=pathlib.Path("r33h-stage")
          p.mkdir(exist_ok=True)
          entries=[
            ('photo-region-r33f-staging.js','791e79ec00e88671dd803044aa10055e949f2f593a53d229904ec58bb7f26de7',''),
            ('photo-region-r33g-bridge.js','b79709f899ad5d57115808af37cd42430dbcb633fc848feed52e3ad3676239ca',''),
            ('photo-region-r33h-owner-staging.js','509a6e7a8210682191c9939a29641220e96fe2a709316e633560f07fb1dd8d5a',''),
            ('apply_r33h_owner_stage.py','97d205bff1142e8afeacdbea03670498cfb6348443fa3f112a5c27e5a95dffd0',''),
            ('test_patch_r33h.py','8425fc6c5c6a58acfe336c7b33d1e61eb1fd877f6e4cd2ba637bd525e424ca92',''),
            ('R33H_OWNER_INTEGRATION_STAGING.test.mjs','491946f2932760750cf8c46f9a46bc43c5722bf78151f7b36f126a94d3807446',''),
          ]
          for name,expected,encoded in entries:
              assert name and "/" not in name and chr(92) not in name
              data=gzip.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(data).hexdigest()==expected
              (p/name).write_bytes(data)
          print("R33H source restored:",len(entries))
          PY
      - name: Run R33H owner staging and regression checks
        shell: bash
        run: |
          node --check r33h-stage/photo-region-r33f-staging.js
          node --check r33h-stage/photo-region-r33g-bridge.js
          node --check r33h-stage/photo-region-r33h-owner-staging.js
          python3 r33h-stage/test_patch_r33h.py -q
          node --test r33h-stage/R33H_OWNER_INTEGRATION_STAGING.test.mjs
          mkdir -p r33h-stage/output
          python3 r33h-stage/apply_r33h_owner_stage.py owner.html r33h-stage/output/owner.html
          python3 - <<'PY'
          from pathlib import Path
          data=Path("r33h-stage/output/owner.html").read_text()
          assert data.count("id=\"r33hRegionPanel\"")==1
          assert data.count("photo-region-r33h-owner-staging.js")==1
          assert "id=\"lineSegmentMount\"" in data
          assert "window.DPRO_PHOTO_R33H?.logout()" in data
          print("R33H REAL OWNER staging overlay PASS; no deploy, no API dispatch")
          PY
          git diff --exit-code -- owner.html
      - name: Upload reviewed staging patch (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_PHOTO_R33H_OWNER_INTEGRATION_REVIEW_ONLY
          path: |
            r33h-stage/output/owner.html
            r33h-stage/photo-region-r33f-staging.js
            r33h-stage/photo-region-r33g-bridge.js
            r33h-stage/photo-region-r33h-owner-staging.js
          retention-days: 7
          if-no-files-found: error

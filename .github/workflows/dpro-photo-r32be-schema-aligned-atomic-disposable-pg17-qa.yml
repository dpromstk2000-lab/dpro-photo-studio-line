name: DPRO PHOTO R32BE Schema-Aligned Atomic Disposable PG17 QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-local-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: qa-local-only
      PGDATABASE: dpro_photo_r32be_disposable
      R32BE_DISPOSABLE_QA: "YES"
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Create fresh disposable database
        run: |
          psql -d postgres -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE dpro_photo_r32be_disposable"
      - name: Verify and unpack embedded review-only sources
        run: |
          python - <<'PY'
          import pathlib, gzip, base64, hashlib
          expected = {
              'R32BE_SCHEMA_ALIGNED_DISPOSABLE_PG17_REVIEW_ONLY.sql': ('8525d329c57a5376473fdabab524e2de4278304967666492bb41262d7c909673', ''),
              'R32BE_SCHEMA_ALIGNED_PG17_QA.py': ('bd1e62044f20a4fd4d06edf82e3ec3b4578fcfc1eaed4ac54a705239e0d2a1b9', ''),
              'R32X_VALIDATED_BOOKING_FIXTURE.json': ('1094588506463693b12797081a7505d9de7b6ee93313ad8747504cba78669d0f', ''),
          }
          for name, (digest, zipped) in expected.items():
              data = gzip.decompress(base64.b64decode(zipped))
              assert hashlib.sha256(data).hexdigest() == digest, name
              pathlib.Path(name).write_bytes(data)
              print("PASS embedded SHA256:", name, digest)
          PY
      - name: Apply schema only to disposable PostgreSQL 17
        run: |
          test "$PGDATABASE" = "dpro_photo_r32be_disposable"
          test "$R32BE_DISPOSABLE_QA" = "YES"
          psql -X -v ON_ERROR_STOP=1 -f R32BE_SCHEMA_ALIGNED_DISPOSABLE_PG17_REVIEW_ONLY.sql
      - name: Run transactional schema-aligned contract QA
        run: |
          test "$PGDATABASE" = "dpro_photo_r32be_disposable"
          python R32BE_SCHEMA_ALIGNED_PG17_QA.py

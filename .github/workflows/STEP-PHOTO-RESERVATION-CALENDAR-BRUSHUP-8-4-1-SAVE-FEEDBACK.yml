name: DPRO PHOTO BRUSHUP-8-4.1 Save Feedback

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="527936ed5eeda607be605d4b83ee224bccc674a2"
          WORKFLOW=".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-4-1-SAVE-FEEDBACK.yml"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi

          test -f owner.html
          test -f photo-booking-presentation.js
          grep -F 'DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-UI-HOTFIX2-20260919' owner.html
          grep -F 'const VERSION = "DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-UI-HOTFIX2-20260919";' photo-booking-presentation.js
          grep -F 'setStatus("保存しています…");' photo-booking-presentation.js
          grep -F '予約画面設定を保存しました。予約画面を再読み込みして確認してください。' photo-booking-presentation.js

      - name: Patch save feedback
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_presentation.py
          echo '' | base64 -d > /tmp/patch_owner.py
          python -m py_compile /tmp/patch_presentation.py /tmp/patch_owner.py
          python /tmp/patch_presentation.py
          python /tmp/patch_owner.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-booking-presentation.js
          grep -F 'DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-1-SAVE-FEEDBACK-20260919' owner.html
          grep -F 'const VERSION = "DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-1-SAVE-FEEDBACK-20260919";' photo-booking-presentation.js
          grep -F 'function setSaveButton(state = "idle")' photo-booking-presentation.js
          grep -F 'button.textContent = "保存しています…";' photo-booking-presentation.js
          grep -F 'button.textContent = "✓ 保存済み";' photo-booking-presentation.js
          grep -F '✓ 保存しました。公開予約画面にも反映されています。' photo-booking-presentation.js
          git diff --check

      - name: Scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).split())
          allowed = {"owner.html", "photo-booking-presentation.js"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY

      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-4-1-SAVE-FEEDBACK.yml"
          git diff --check

      - name: Commit BRUSHUP-8-4.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-booking-presentation.js .github/workflows
          git diff --cached --check
          git commit -m "Improve PHOTO booking presentation save feedback BRUSHUP-8-4.1"
          git push origin HEAD:main

name: DPRO PHOTO CRM BRUSHUP-6.1 UI Sync Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photo-crm-brushup-6-1-ui-sync-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f owner.html
          test -f photo-crm-import.js
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-6-UI-20260918' photo-crm-import.js
          grep -F './photo-crm-import.js?v=DPRO-PHOTO-CRM-BRUSHUP-6-20260918' owner.html
          grep -F 'bind();' photo-crm-import.js
          grep -F 'updateEnabledState();' photo-crm-import.js

      - name: Apply UI sync fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo_crm_b6_sync_fix.py
          python -m py_compile /tmp/photo_crm_b6_sync_fix.py
          python /tmp/photo_crm_b6_sync_fix.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check photo-crm-import.js
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-6-UI-HOTFIX1-20260918' photo-crm-import.js
          grep -F 'function syncEnabledStateSoon()' photo-crm-import.js
          grep -F '$("settingsReloadBtn")?.addEventListener("click", syncEnabledStateSoon);' photo-crm-import.js
          grep -F './photo-crm-import.js?v=DPRO-PHOTO-CRM-BRUSHUP-6-HOTFIX1-20260918' owner.html

      - name: Commit fix and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-crm-import.js
          git rm -f --ignore-unmatch .github/workflows/STEP-PHOTO-CRM-BRUSHUP-6-1-UI-SYNC-FIX.yml
          git commit -m "Fix PHOTO CRM CSV migration UI state sync"
          git push origin HEAD:main

      - name: Final
        shell: bash
        run: |
          echo "DPRO PHOTO CRM BRUSHUP-6.1 UI Sync Fix: PASS"

name: DPRO PHOTO R58 Owner Signed Gateway-Worker CSV Bridge and R57.2 PG17 Regression (NO PRODUCTION)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r58-signed-owner-csv-pg17:
    name: R58 signed Owner HTTP plus inherited R57.2 disposable PG17 (NO PRODUCTION)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photo_r56_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photo_r56_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: photo_r56_disposable
      R56_ISOLATED_ONLY: "YES"
      R57_FIXTURE_ONLY: "YES"
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unseal R57 reviewed source and verify 9 SHA256 sums (NO CHECKOUT OR SECRETS)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,hashlib,base64,gzip
          root=pathlib.Path('/tmp/dpro-photo-r57-disposable')
          root.mkdir(parents=True,exist_ok=True)
          sealed={
              'R53_CSV_IMPORT_PREFLIGHT_READ_ONLY.py': ('1b50d9ca95ae7488b790a359e2edc1de5dc9bacfd0865e099d138ef19c920599', ''),
              'R56_CSV_PG17_IMPORT_REHEARSAL.py': ('448dde12830c7a85d00746023048191e602a17ec0e48407935837e943952b86b', ''),
              'R56_DISPOSABLE_SCHEMA.sql': ('91e707c2823618e17e5e45aee0b436748eac29d59af95d9e0b52379e11ab84c1', ''),
              'R53_SYNTHETIC_CUSTOMERS.csv': ('c3c6f835e9abaac3176348c20d3d9c701141a890ccb6dbd44e6fad8ed31b0215', ''),
              'R53_SYNTHETIC_SUBJECTS.csv': ('42d9ac3c25651da94ea8dcc5c33f23a327b37fbf6baaad4e273bea9fdd4c9e91', 'H4sIAAAAAAAC/3s2ad3TvRufrt/3YuPCFw2tni46Lxcuf7puEZDxDFXq6YReHQjnac+upx1tOs+nzH+6c8uzOR3Ppi/Veb5t1rP5LVzBugYGBoY6zhDq2ZI5z+bvfrqh6fmUFQpP105w1EnOyMxJ0TEyMDLSNzTQNzDVAYpCNBnh0uSE0GSib2Cmb2iI0GQM0WSEpmndtmfT+3UKUouK8/N0dCBcLgBNDS+r6gAAAA=='),
              'R53_CSV_MAPPING_TEMPLATE.json': ('22e7a7b9c6496c232f71c6d38a7fc9db7e3fc2ed8ef4e88c4a81352ae2e1743e', ''),
              'R57_IMPORT_APPROVAL_GATE.py': ('8d54ef4ab64439207e13261a4a78fc871324c385ca6b404f3d3c0d1282fd6ef2', ''),
              'R57_APPROVAL_GATE_OFFLINE_QA.py': ('4fe82aa905e5da363ff02ba60ff01eaac19d8fb4b3f1f7bbef05e524220fb86a', ''),
              'R57_PG17_APPROVAL_QA.py': ('fa71b83cdac44e07e4413ba9a32671824127c990b065ded0b1ad347c33c69028', ''),
          }
          assert len(sealed)==9
          for name,(sha,blob) in sealed.items():
              assert "/" not in name and ".." not in name
              data=gzip.decompress(base64.b64decode(blob,validate=True))
              assert hashlib.sha256(data).hexdigest()==sha,name
              (root/name).write_bytes(data)
              print("PASS SHA256",name)
          PY
      - name: Install pinned psycopg for disposable PostgreSQL 17
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"
      - name: Verify pinned PostgreSQL client before any R57 imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYVALIDATE'
          import psycopg
          assert psycopg.__version__ == '3.2.9', psycopg.__version__
          print('PASS R57.1 psycopg dependency ready before offline QA')
          PYVALIDATE
      - name: R57 owner preview and approval offline QA (NO DB writes)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r57-disposable
          python -m py_compile *.py
          python -u R57_APPROVAL_GATE_OFFLINE_QA.py
      - name: Create R56-compatible schema and run R57 preview-approved PG17 migration
        env:
          R57_ENABLE_DISPOSABLE_COMMIT: "YES"
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r57-disposable
          python - <<'PY'
          import pathlib,psycopg,os
          assert os.environ["PGHOST"]=="127.0.0.1" and os.environ["PGDATABASE"]=="photo_r56_disposable"
          sql=pathlib.Path("R56_DISPOSABLE_SCHEMA.sql").read_text()
          with psycopg.connect(host=os.environ['PGHOST'],port=5432,dbname=os.environ['PGDATABASE'],user='postgres',password='postgres',autocommit=True) as c:
              c.execute(sql)
          PY
          python -u R57_PG17_APPROVAL_QA.py
      - name: Set up Node.js 22 for isolated real HTTP tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unseal R58 reviewed Gateway Worker and HTTP QA sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_R58'
          import pathlib,hashlib,base64,gzip
          root=pathlib.Path('/tmp/dpro-photo-r58-review')
          root.mkdir(parents=True,exist_ok=True)
          sealed={
              'R58_GATEWAY_CSV_REVIEW_ONLY.js': ('e85ae2de670a7fdc8f3e44bf3c2f044211b911179db4e5bf711e2c8db49d07b4', ''),
              'R58_WORKER_CSV_REVIEW_ONLY.mjs': ('2bc726302c837ee886f8b84c68061f583b1a7c58e5b72bca439b8ba90017e3d8', ''),
              'R58_GATEWAY_WORKER_FIXTURE.cjs': ('cda50bc38d94a77e07e83babb53af7774a92cd75b9485a6f320043d205e3a6fd', ''),
              'R58_SIGNED_OWNER_HTTP_QA.cjs': ('a30b4abddc56415cf52c0e8f3de2a63d87168291d94d2d21ac4d88f8d3d69946', ''),
              'R58_INHERITED_STAFF_HTTP_QA.cjs': ('caa027d463d85a9d0869c6a0150a2536713f60cf5fd9c75210e794786dcd0725', ''),
              'R54_OWNER_CRM_UI_REVIEW_ONLY.html': ('88311476379d4731af5f10cd2165131fcbe9cdc2a14e79325cf9ecc24e951c51', ''),
              'R53_SYNTHETIC_CUSTOMERS.csv': ('c3c6f835e9abaac3176348c20d3d9c701141a890ccb6dbd44e6fad8ed31b0215', ''),
              'R53_SYNTHETIC_SUBJECTS.csv': ('42d9ac3c25651da94ea8dcc5c33f23a327b37fbf6baaad4e273bea9fdd4c9e91', 'H4sIAAAAAAAC/3s2ad3TvRufrt/3YuPCFw2tni46Lxcuf7puEZDxDFXq6YReHQjnac+upx1tOs+nzH+6c8uzOR3Ppi/Veb5t1rP5LVzBugYGBoY6zhDq2ZI5z+bvfrqh6fmUFQpP105w1EnOyMxJ0TEyMDLSNzTQNzDVAYpCNBnh0uSE0GSib2Cmb2iI0GQM0WSEpmndtmfT+3UKUouK8/N0dCBcLgBNDS+r6gAAAA=='),
              'R53_CSV_MAPPING_TEMPLATE.json': ('22e7a7b9c6496c232f71c6d38a7fc9db7e3fc2ed8ef4e88c4a81352ae2e1743e', ''),
          }
          assert len(sealed)==9
          for name,(digest,blob) in sealed.items():
              assert '/' not in name and '..' not in name
              data=gzip.decompress(base64.b64decode(blob,validate=True))
              assert hashlib.sha256(data).hexdigest()==digest,name
              (root/name).write_bytes(data)
              print('PASS R58 SHA256',name)
          PY_R58
      - name: R58 real signed Owner Gateway-to-Worker localhost HTTP QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r58-review
          node --check R58_GATEWAY_CSV_REVIEW_ONLY.js
          node --check R58_WORKER_CSV_REVIEW_ONLY.mjs
          node --check R58_GATEWAY_WORKER_FIXTURE.cjs
          node --check R58_SIGNED_OWNER_HTTP_QA.cjs
          R54_LOCAL_ISOLATED=YES node R58_GATEWAY_WORKER_FIXTURE.cjs > r58-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if ! kill -0 "$PID" 2>/dev/null; then cat r58-server.log; exit 1; fi
            if grep -q R54_LOCAL_ISOLATED_HTTP_READY r58-server.log; then break; fi
            sleep 0.25
          done
          if ! grep -q R54_LOCAL_ISOLATED_HTTP_READY r58-server.log; then cat r58-server.log; exit 1; fi
          node R58_SIGNED_OWNER_HTTP_QA.cjs
          node R58_INHERITED_STAFF_HTTP_QA.cjs
          if grep -E '(NETWORK_DENY|R54_INTERNAL_ERRORS)' r58-server.log; then exit 1; fi

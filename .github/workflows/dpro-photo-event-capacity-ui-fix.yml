name: DPRO Photo Event Capacity UI FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply event capacity UI FIX
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_photo_capacity_ui_fix.py
          python /tmp/dpro_photo_capacity_ui_fix.py

      - name: Validate
        shell: bash
        run: |
          node --check photo-feature-switch-ui-v2.js

          python - <<'PY'
          from pathlib import Path
          import re

          owner = Path("owner.html").read_text(encoding="utf-8")
          feature = Path("photo-feature-switch-ui-v2.js").read_text(encoding="utf-8")

          checks = {
              "event_switch": 'id="featureReservationEventCapacity"' in owner,
              "event_render": '$("featureReservationEventCapacity").checked = flags.reservation_event_capacity === true;' in owner,
              "event_save": 'reservation_event_capacity: $("featureReservationEventCapacity").checked' in owner,
              "v9_availability": 'C.CALENDAR_API_BASE_URL' in owner and 'C.ENDPOINTS.PUBLIC_AVAILABILITY' in owner,
              "resource_query": 'url.searchParams.set("resource_id", resourceId)' in owner,
              "resource_listener": '$("manualResource").addEventListener("change"' in owner,
              "remaining_ui": 'slot-remaining' in owner and 'resource_remaining' in owner,
              "event_card": "featureReservationEventCapacity" in feature,
              "no_literal_backslash_n_bug": '管理します."\\n' not in feature,
          }
          print(checks)
          failed = [k for k, v in checks.items() if not v]
          if failed:
              raise SystemExit("ERROR: validation failed: " + ", ".join(failed))

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', owner, flags=re.S|re.I)
          for i, script in enumerate(scripts):
              Path(f"/tmp/owner-inline-{i}.js").write_text(script, encoding="utf-8")
          print("inline_scripts", len(scripts))
          PY

          for f in /tmp/owner-inline-*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html photo-feature-switch-ui-v2.js
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Fix DPRO Photo event capacity UI"
          git push

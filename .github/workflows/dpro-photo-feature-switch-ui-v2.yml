name: DPRO Photo Feature Switch UI V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply simple feature switch UI
        shell: bash
        run: |
          echo '' | base64 -d > photo-feature-switch-ui-v2.js
          python - <<'PY'
          from pathlib import Path

          path = Path("owner.html")
          s = path.read_text(encoding="utf-8")

          anchor = '<script src="./photo-owner-settings-v2.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-5-SETTINGS-POLISH-UI-20260919"></script>'
          tag = '<script src="./photo-feature-switch-ui-v2.js?v=DPRO-PHOTO-FEATURE-SWITCH-UI-V2-20261006"></script>'

          if tag not in s:
              if anchor not in s:
                  raise SystemExit("ERROR: owner settings script anchor not found")
              s = s.replace(anchor, anchor + "\n  " + tag, 1)

          path.write_text(s, encoding="utf-8")
          print("Feature Switch UI V2 installed")
          PY

      - name: Validate
        shell: bash
        run: |
          node --check photo-feature-switch-ui-v2.js
          python - <<'PY'
          from pathlib import Path

          owner = Path("owner.html").read_text(encoding="utf-8")
          ui = Path("photo-feature-switch-ui-v2.js").read_text(encoding="utf-8")

          checks = {
              "script_loaded": "photo-feature-switch-ui-v2.js?v=DPRO-PHOTO-FEATURE-SWITCH-UI-V2-20261006" in owner,
              "simple_title": 'textContent = "使う機能"' in ui,
              "followup_main": "feature-simple-main" in ui,
              "details_collapsed": "feature-simple-details" in ui,
              "optional_cards": "feature-simple-extra-grid" in ui,
              "dependency_collapsed": "feature-simple-dependency" in ui,
              "ids_preserved": all(x in ui for x in [
                  "featureCustomerFollowup","featureSubjectHistory","featureLifecycleSearch",
                  "featureBirthdaySearch","featureReturnCycleSearch","featureLineSegment",
                  "featureCsvMigration","featureLineCustomerLink"
              ]),
          }
          print(checks)
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("ERROR: validation failed: " + ", ".join(failed))
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html photo-feature-switch-ui-v2.js
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Polish DPRO Photo feature switch UI"
          git push

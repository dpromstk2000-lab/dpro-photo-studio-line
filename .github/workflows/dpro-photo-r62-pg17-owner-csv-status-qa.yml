      - name: Synthetic localhost Owner status contract preflight (NO DB writes)
        shell: bash
        env:
          R54_LOCAL_ISOLATED: 'YES'
          R60_PG17_BRIDGE: 'YES'
          R61_ISOLATED_ONLY: 'YES'
          R62_LOCAL_ONLY: 'YES'
        run: |
          set -euo pipefail
          cd /tmp/r62-disposable
          cleanup() {
            kill -INT "${GATE_PID:-}" 2>/dev/null || true
            kill "${BRIDGE_PID:-}" 2>/dev/null || true
            tail -20 /tmp/r62-local-gateway.log 2>/dev/null || true
          }
          trap cleanup EXIT
          node R62_STATUS_LOCAL_BRIDGE.cjs > /tmp/r62-local-bridge.log 2>&1 & BRIDGE_PID=$!
          node R61_GATEWAY_WORKER_PG17_FIXTURE.cjs > /tmp/r62-local-gateway.log 2>&1 & GATE_PID=$!
          for i in $(seq 1 30); do
            if curl --max-time 2 -sS http://127.0.0.1:18776/dpro-photo-product-ready-gateway/api/health >/dev/null; then break; fi
            if ! kill -0 "$GATE_PID" 2>/dev/null; then cat /tmp/r62-local-gateway.log; exit 1; fi
            sleep 1
          done
          node R62_STATUS_LOCAL_QA.cjs
          echo 'R62 local preflight 13/13 PASS, not PostgreSQL results'
      - name: R62 Owner status, dynamic Gateway Worker PG17 and staff regression
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r62-disposable
          cleanup() {
            kill -INT "${GATE_PID:-}" 2>/dev/null || true
            kill "${DB_PID:-}" 2>/dev/null || true
            echo '--- R61 isolated DB diagnostic tail ---'
            tail -35 /tmp/r61-db.log 2>/dev/null || true
            echo '--- R61 Gateway Worker diagnostic tail ---'
            tail -35 /tmp/r61-gateway.log 2>/dev/null || true
          }
          trap cleanup EXIT

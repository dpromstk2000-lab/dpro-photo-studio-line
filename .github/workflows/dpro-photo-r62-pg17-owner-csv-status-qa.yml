name: DPRO PHOTO R62 Owner CSV Status Gateway Worker PG17 QA (DISPOSABLE ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r62-disposable-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    name: R62 signed Owner status and atomic CSV in isolated PG17 (NO PRODUCTION)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r61_synthetic_qa_only
          POSTGRES_DB: photo_r56_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photo_r56_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: r61_synthetic_qa_only
      PGDATABASE: photo_r56_disposable
      R56_ISOLATED_ONLY: 'YES'
      R59_DISPOSABLE_ONLY: 'YES'
      R59_FIXTURE_ONLY: 'YES'
      R59_ENABLE_DISPOSABLE_COMMIT: 'YES'
      R60_DISPOSABLE_BRIDGE_ONLY: 'YES'
      R61_ISOLATED_ONLY: 'YES'
      R61_QA_BINDING_KEY: 'R61_GITHUB_DISPOSABLE_QA_ONLY_kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk'
      R59_STAGING_PASSPHRASE: 'R61_DISPOSABLE_ENCRYPTION_KEY_aaaaaaaaaaaaaaaaaaaaaaaaaaaa'
    steps:
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable PostgreSQL adapter
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          python - <<'CHECK'
          import psycopg
          assert psycopg.__version__ == '3.2.9'
          CHECK
      - name: Verify 17 sealed source files and syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r62-disposable

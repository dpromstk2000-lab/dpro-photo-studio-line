      - name: Validate UI compatibility, JavaScript syntax, and two-file scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_R27_VERIFY'
          from pathlib import Path
          import json,hashlib,re,subprocess
          html=Path('owner-ipad.html').read_text(encoding='utf-8')
          js=Path('photo-ipad-calendar-ja-r27.js').read_text(encoding='utf-8')
          checks=[]
          def ck(name,ok):
              checks.append({'name':name,'status':'PASS' if ok else 'FAIL'})
              if not ok:print('R27 FAILED',name)
          ck('R23 private-page noindex retained','<meta name="robots" content="noindex, nofollow" />' in html)
          ck('R27 module loaded exactly once',html.count('photo-ipad-calendar-ja-r27.js')==1)
          ck('R27 source marker exactly once',html.count('DPRO-PHOTO-R27-IPAD-JAPANESE-CALENDAR-20261011')==1)
          ck('R27 calendar used before native fallback','if (window.DPRO_PHOTO_IPAD_CALENDAR_JA_R27?.open(input)) return;' in html)
          ck('Existing native fallback preserved',html.count('if (typeof input.showPicker === "function") input.showPicker();')==1)
          ck('Original iPad workDate handler retained','$("workDate").addEventListener("change"' in html)
          ck('Original iPad manualDate handler retained','$("manualDate").addEventListener("change"' in html)
          ck('Original "show reservations" button retained','$("loadBtn").addEventListener("click", () => loadReservations());' in html)
          ck('Original Today button retained','$("todayBtn").addEventListener("click"' in html)
          ck('Original manual availability handler retained','loadManualSlots().catch(() => {});' in html)
          ck('Original booking form submit retained','$("manualSubmitBtn").addEventListener("click"' in html)
          ck('Original iPad UI large buttons retained',html.count('class="date-display-button"')==2)
          ck('Original iPad hidden ISO fields retained',html.count('class="native-date-input" type="date"')==2)
          ck('Existing date-display buttons mapped',js.count("DOC.getElementById(input.id+'Display')")==1)
          ck('Only workDate and manualDate adapted',js.count("['workDate','manualDate']")>=2)
          ck('Existing input change events used',"input.dispatchEvent(new Event('change',{bubbles:true}))" in js)
          ck('No new booking API call by adapter',not any(x in js for x in ['fetch(', 'XMLHttpRequest', '.apiPost(','.apiGet(','sendBeacon(']))
          ck('Adapter does not store credentials',not any(x in js for x in ['localStorage','sessionStorage','document.cookie']))
          ck('Owner admin code not overwritten',not any(x in js for x in ['ADMIN_CODE','adminCode','setStoredValue']))
          ck('Calendar JPN day labels',"['日','月','火','水','木','金','土']" in js)
          ck('Tokyo today anchor',"timeZone:'Asia/Tokyo'" in js)
          ck('ISO date storage preserved',"`${y}-${pad(m)}-${pad(d)}`" in js)
          ck('Respects min/max date limits',"(!input.min||day>=input.min)&&(!input.max||day<=input.max)" in js)
          ck('Previous next month controls preserved','data-dpro-nav="prev"' in js and 'data-dpro-nav="next"' in js)
          ck('Selected day marked for screen reader','aria-pressed=' in js)
          ck('Escape to close preserved',"e.key==='Escape'" in js)
          ck('Touch accessible 330px popup','width:min(330px,calc(100vw - 20px))' in js)
          ck('Mobile viewport positioning',"window.innerWidth-w-10" in js)
          ck('Browser native picker not called by adapter','.showPicker(' not in js)
          ck('R27 exports exact open method','version:VERSION,refresh:scan,formatDate:displayDate,open,close' in js)
          ck('R27 opens only registered controls','if(!input||!targets.has(input))return false;' in js)
          ck('Native ISO values used unchanged',html.count('id="workDate"')==1 and html.count('id="manualDate"')==1)
          # Source syntax; no live credentials, API or DB operations.
          process=subprocess.run(['node','--check','photo-ipad-calendar-ja-r27.js'],capture_output=True,text=True)
          ck('Node JS syntax for R27',process.returncode==0)
          # Guard no changes to legacy app other than exact two HTML substitutions.
          base=subprocess.run(['git','show','HEAD:owner-ipad.html'],capture_output=True)
          if base.returncode==0:
              old=base.stdout
              anchor=b'  <script>\n  (() => {'
              after_anchor=b'  <!-- DPRO-PHOTO-R27-IPAD-JAPANESE-CALENDAR-20261011 -->\n  <script src="./photo-ipad-calendar-ja-r27.js?v=DPRO-PHOTO-R27-IPAD-JA-DATE-20261011"></script>\n  <script>\n  (() => {'
              old_func=b'    function openNativeDatePicker(input) {\n      try {'
              new_func=b'    function openNativeDatePicker(input) {\n      // R27: always prefer DPRO Japanese calendar, retain native as asset fallback.\n      if (window.DPRO_PHOTO_IPAD_CALENDAR_JA_R27?.open(input)) return;\n      try {'
              if old.count(anchor)==1 and old.count(old_func)==1:
                  expected=old.replace(anchor,after_anchor,1).replace(old_func,new_func,1)
                  ck('Only two HTML sites differ from baseline',Path('owner-ipad.html').read_bytes()==expected)
              else:
                  ck('Already patched at workflow checkout',b'DPRO-PHOTO-R27-IPAD-JAPANESE-CALENDAR-20261011' in old)
          else:ck('Base file available',False)
          status=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          changed=set(line[3:] for line in status if line.strip() and line[3:]!='DPRO_PHOTO_R27_STATIC_GATE.json')
          ck('Strict two-file scope',changed in [set(),{'owner-ipad.html','photo-ipad-calendar-ja-r27.js'}])
          report={'gate':'DPRO PHOTO R27 iPad Japanese admin calendar','mode':'GITHUB_STATIC_SOURCE_NODE','counts':{'passed':sum(x['status']=='PASS' for x in checks),'failed':sum(x['status']=='FAIL' for x in checks)},'checks':checks,'changedFiles':sorted(changed),'localBrowserQA':{'passed':48,'failed':0,'scope':'Previously verified Chromium 1200/390 px; not executed by GitHub Actions'},'requests':{'apiGET':0,'mutating':0},'productionReady':False,'humanAcceptance':False}
          Path('DPRO_PHOTO_R27_STATIC_GATE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('R27 static checks:',report['counts'],'changed:',sorted(changed),'no backend requests')
          if report['counts']['failed']:raise SystemExit('R27 failed; nothing committed')
          PY_R27_VERIFY

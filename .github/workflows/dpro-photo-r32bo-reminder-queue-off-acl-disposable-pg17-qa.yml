name: DPRO PHOTO R32BO Reminder Queue OFF and ACL Disposable PG17 QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r32bo-qa-local-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: r32bo-qa-local-only
      PGDATABASE: r32bo_disposable_only
      R32BO_DISPOSABLE_ONLY: "YES"
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Create a fresh disposable DB
        run: |
          test "$R32BO_DISPOSABLE_ONLY" = "YES"
          psql -d postgres -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE r32bo_disposable_only"
      - name: Restore SHA-256 verified fixture
        run: |
          python - <<'PYIN'
          import base64,gzip,hashlib,pathlib
          payload = ''
          data = gzip.decompress(base64.b64decode(payload))
          expected = '4cee2946c124d96d1cdbe0b21265e784c03df5c5a09de01fd2ef94267d50c0df'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected: raise SystemExit('SQL artifact SHA256 mismatch')
          pathlib.Path('r32bo_disposable.sql').write_bytes(data)
          print('R32BO SQL SHA256 OK:',actual)
          PYIN
      - name: Run original behavior and hardened candidate in disposable PG17
        run: |
          test "$R32BO_DISPOSABLE_ONLY" = "YES"
          psql -X -v ON_ERROR_STOP=1 -f r32bo_disposable.sql
      - name: Confirm test had 18 fail-closed assertions
        run: |
          python - <<'PYIN'
          s=open('r32bo_disposable.sql').read()
          assert all(f'R32BO-{i:02}' in s for i in range(1,19))
          assert s.count('CREATE OR REPLACE FUNCTION public.photo_build_visit_reminder_queue()')==2
          print('R32BO static QA complete: 18 assertions present')
          PYIN

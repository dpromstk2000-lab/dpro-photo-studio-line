# DO NOT DEPLOY WORKER OR RUN PRODUCTION SQL.
# Isolated GitHub Actions disposable PostgreSQL service only.
name: DPRO PHOTO R32AK Calendar FK Isolated PostgreSQL QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-db-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa_disposable_20261012
          POSTGRES_DB: dpro_photo_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d dpro_photo_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build isolated input from inline SQL
        shell: bash
        run: |
          cat > /tmp/r32ak.sql <<'R32AK_DISPOSABLE_SQL'
          -- DPRO PHOTO R32AK PG17 QA: ONLY FOR EMPTY THROWAWAY GitHub Actions SERVICE DB.
          -- NEVER EXECUTE ON SHARED OR PRODUCTION DATABASE.
          \set ON_ERROR_STOP on
          CREATE TABLE photo_studios(id uuid PRIMARY KEY);
          CREATE TABLE photo_reservations(id uuid PRIMARY KEY,studio_id uuid NOT NULL REFERENCES photo_studios(id),UNIQUE(studio_id,id));
          CREATE TABLE photo_external_calendar_connections (
           id uuid NOT NULL DEFAULT gen_random_uuid(),studio_id uuid NOT NULL,
           provider text NOT NULL DEFAULT 'google_calendar',
           connection_status text NOT NULL DEFAULT 'disconnected',
           calendar_id text NULL, calendar_name text NULL, account_email text NULL,
           access_token_secret_id uuid NULL, refresh_token_secret_id uuid NULL,
           token_expires_at timestamptz NULL,sync_direction text NOT NULL DEFAULT 'dpro_to_external',
           sync_enabled boolean NOT NULL DEFAULT false,last_sync_at timestamptz NULL,
           last_error text NULL,metadata jsonb NOT NULL DEFAULT '{}'::jsonb,
           created_at timestamptz NOT NULL DEFAULT now(),updated_at timestamptz NOT NULL DEFAULT now(),
           CONSTRAINT photo_external_calendar_connections_pkey PRIMARY KEY (id),
           CONSTRAINT photo_external_calendar_connections_studio_id_provider_key UNIQUE (studio_id,provider),
           CONSTRAINT photo_external_calendar_connections_studio_id_fkey FOREIGN KEY(studio_id) REFERENCES photo_studios(id) ON DELETE CASCADE);
          CREATE INDEX photo_external_calendar_connections_studio_idx ON photo_external_calendar_connections(studio_id,provider);
          CREATE TABLE photo_calendar_event_links (
           id uuid NOT NULL DEFAULT gen_random_uuid(),studio_id uuid NOT NULL,
           reservation_id uuid NOT NULL,connection_id uuid NOT NULL,
           provider text NOT NULL DEFAULT 'google_calendar',external_calendar_id text NULL,
           external_event_id text NULL,external_etag text NULL,
           sync_status text NOT NULL DEFAULT 'pending',last_synced_at timestamptz NULL,
           last_error text NULL,metadata jsonb NOT NULL DEFAULT '{}'::jsonb,
           created_at timestamptz NOT NULL DEFAULT now(),updated_at timestamptz NOT NULL DEFAULT now(),
           CONSTRAINT photo_calendar_event_links_pkey PRIMARY KEY(id),
           CONSTRAINT photo_calendar_event_links_connection_id_reservation_id_key UNIQUE(connection_id,reservation_id),
           CONSTRAINT photo_calendar_event_links_connection_id_fkey FOREIGN KEY(connection_id) REFERENCES photo_external_calendar_connections(id) ON DELETE CASCADE,
           CONSTRAINT photo_calendar_event_links_reservation_id_fkey FOREIGN KEY(reservation_id) REFERENCES photo_reservations(id) ON DELETE CASCADE,
           CONSTRAINT photo_calendar_event_links_studio_id_fkey FOREIGN KEY(studio_id) REFERENCES photo_studios(id) ON DELETE CASCADE);
          CREATE INDEX photo_calendar_event_links_status_idx ON photo_calendar_event_links(sync_status,updated_at);
          INSERT INTO photo_studios VALUES
           ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          INSERT INTO photo_reservations (id,studio_id) VALUES
           ('11111111-1111-4111-8111-111111111111','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),
           ('22222222-2222-4222-8222-222222222222','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          INSERT INTO photo_external_calendar_connections(id,studio_id,connection_status,sync_enabled)
           VALUES ('33333333-3333-4333-8333-333333333333','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','connected',true),
                  ('44444444-4444-4444-8444-444444444444','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','connected',true);
          -- Existing FKs accept cross-studio link: link studio A/reservation A, connection B!
          INSERT INTO photo_calendar_event_links(id,studio_id,reservation_id,connection_id) VALUES
           ('55555555-5555-4555-8555-555555555555','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
           '11111111-1111-4111-8111-111111111111','33333333-3333-4333-8333-333333333333');
          DO $$ BEGIN
           IF NOT EXISTS (SELECT 1 FROM photo_calendar_event_links WHERE id='55555555-5555-4555-8555-555555555555') THEN
            RAISE EXCEPTION 'FAIL: Original FK example did not accept mixed studio'; END IF;
           RAISE NOTICE 'PASS: Original independent FKs allow cross-studio link (synthetic)';
          END $$;
          -- Review-only composite-key proposal is now tested on throwaway database.
          ALTER TABLE photo_external_calendar_connections ADD CONSTRAINT photo_external_calendar_connections_studio_id_id_uq UNIQUE(studio_id,id);
          ALTER TABLE photo_calendar_event_links ADD CONSTRAINT photo_calendar_event_links_studio_reservation_fk
           FOREIGN KEY(studio_id,reservation_id) REFERENCES photo_reservations(studio_id,id) NOT VALID;
          ALTER TABLE photo_calendar_event_links ADD CONSTRAINT photo_calendar_event_links_studio_connection_fk
           FOREIGN KEY(studio_id,connection_id) REFERENCES photo_external_calendar_connections(studio_id,id) NOT VALID;
          DO $$ BEGIN
           BEGIN
            ALTER TABLE photo_calendar_event_links VALIDATE CONSTRAINT photo_calendar_event_links_studio_connection_fk;
            RAISE EXCEPTION 'FAIL: Validation overlooked legacy cross-studio link';
           EXCEPTION WHEN foreign_key_violation THEN
            RAISE NOTICE 'PASS: Validation catches existing cross-studio link';
           END;
          END $$;
          -- Only synthetic invalid row is deleted inside disposable DB.
          DELETE FROM photo_calendar_event_links WHERE id='55555555-5555-4555-8555-555555555555';
          ALTER TABLE photo_calendar_event_links VALIDATE CONSTRAINT photo_calendar_event_links_studio_connection_fk;
          ALTER TABLE photo_calendar_event_links VALIDATE CONSTRAINT photo_calendar_event_links_studio_reservation_fk;
          INSERT INTO photo_calendar_event_links(id,studio_id,reservation_id,connection_id) VALUES
           ('66666666-6666-4666-8666-666666666666','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
           '11111111-1111-4111-8111-111111111111','44444444-4444-4444-8444-444444444444');
          DO $$ BEGIN
           IF (SELECT count(*) FROM photo_calendar_event_links WHERE id='66666666-6666-4666-8666-666666666666')<>1 THEN
             RAISE EXCEPTION 'FAIL: Correct same-studio link was rejected'; END IF;
           RAISE NOTICE 'PASS: Correct same-studio link accepted';
           BEGIN
            INSERT INTO photo_calendar_event_links(studio_id,reservation_id,connection_id) VALUES
             ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','11111111-1111-4111-8111-111111111111','33333333-3333-4333-8333-333333333333');
            RAISE EXCEPTION 'FAIL: Cross-studio reservation was accepted';
           EXCEPTION WHEN foreign_key_violation THEN RAISE NOTICE 'PASS: Composite FK blocks wrong reservation studio'; END;
           BEGIN
            INSERT INTO photo_calendar_event_links(studio_id,reservation_id,connection_id) VALUES
             ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111','33333333-3333-4333-8333-333333333333');
            RAISE EXCEPTION 'FAIL: Cross-studio connection was accepted';
           EXCEPTION WHEN foreign_key_violation THEN RAISE NOTICE 'PASS: Composite FK blocks wrong connection studio'; END;
           BEGIN
            INSERT INTO photo_external_calendar_connections(studio_id,provider) VALUES
             ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','google_calendar');
            RAISE EXCEPTION 'FAIL: Studio-provider uniqueness was not enforced';
           EXCEPTION WHEN unique_violation THEN RAISE NOTICE 'PASS: Studio-provider uniqueness enforced'; END;
          END $$;
          -- Reproduce a separate PostgreSQL event-trigger gap with isolated synthetic rows.
          CREATE TABLE qa_reservation(id int PRIMARY KEY,duration_minutes int NOT NULL,end_at timestamptz);
          CREATE TABLE qa_event_log(id serial PRIMARY KEY);
          CREATE FUNCTION qa_derive_end() RETURNS trigger LANGUAGE plpgsql AS $$
          BEGIN NEW.end_at := '2026-10-12 00:00+00'::timestamptz + make_interval(mins=>NEW.duration_minutes); RETURN NEW; END $$;
          CREATE FUNCTION qa_after_end() RETURNS trigger LANGUAGE plpgsql AS $$
          BEGIN INSERT INTO qa_event_log DEFAULT VALUES; RETURN NEW; END $$;
          CREATE TRIGGER qa_derive BEFORE INSERT OR UPDATE ON qa_reservation FOR EACH ROW EXECUTE FUNCTION qa_derive_end();
          CREATE TRIGGER qa_old_queue AFTER UPDATE OF end_at ON qa_reservation FOR EACH ROW EXECUTE FUNCTION qa_after_end();
          INSERT INTO qa_reservation(id,duration_minutes) VALUES(1,30);
          UPDATE qa_reservation SET duration_minutes=60 WHERE id=1;
          DO $$ BEGIN
           IF (SELECT count(*) FROM qa_event_log)<>0 THEN RAISE EXCEPTION 'FAIL: Column-targeted AFTER trigger unexpectedly ran'; END IF;
           IF (SELECT end_at FROM qa_reservation WHERE id=1) <> '2026-10-12 01:00+00'::timestamptz THEN RAISE EXCEPTION 'FAIL: Derived end time not updated'; END IF;
           RAISE NOTICE 'PASS: Duration-only UPDATE changed derived end_at but missed AFTER UPDATE OF end_at';
          END $$;
          DROP TRIGGER qa_old_queue ON qa_reservation;
          CREATE TRIGGER qa_new_queue AFTER UPDATE ON qa_reservation FOR EACH ROW WHEN (OLD.end_at IS DISTINCT FROM NEW.end_at) EXECUTE FUNCTION qa_after_end();
          UPDATE qa_reservation SET duration_minutes=90 WHERE id=1;
          DO $$ BEGIN
           IF (SELECT count(*) FROM qa_event_log)<>1 THEN RAISE EXCEPTION 'FAIL: Proposed broad UPDATE missed real derived time change'; END IF;
           RAISE NOTICE 'PASS: AFTER UPDATE with OLD/NEW comparison sees derived end_at change';
          END $$;
          SELECT 'R32AK DISPOSABLE PG17 CONSTRAINT+TRIGGER QA PASS (not production)' AS outcome;
          R32AK_DISPOSABLE_SQL
      - name: PostgreSQL 17 disposable-only verification
        shell: bash
        env:
          PGPASSWORD: qa_disposable_20261012
        run: psql -h 127.0.0.1 -p 5432 -U qa -d dpro_photo_qa -v ON_ERROR_STOP=1 -f /tmp/r32ak.sql

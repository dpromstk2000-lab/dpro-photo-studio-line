name: DPRO PHOTO BRUSHUP-8-4 White-label Auth Timing HOTFIX2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  whitelabel-auth-timing-hotfix2:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="badae0c27e4d6e0282c53cc5804630c4c2147cc2"
          WORKFLOW=".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-4-WHITELABEL-HOTFIX2.yml"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi

          test -f owner.html
          test -f photo-booking-presentation.js
          grep -F 'DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-UI-20260919' owner.html
          grep -F 'const VERSION = "DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-UI-20260919";' photo-booking-presentation.js
          grep -F 'load().catch(showError);' photo-booking-presentation.js

      - name: Patch auth timing
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_presentation.py
          echo '' | base64 -d > /tmp/patch_owner.py
          python -m py_compile /tmp/patch_presentation.py /tmp/patch_owner.py
          python /tmp/patch_presentation.py
          python /tmp/patch_owner.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-booking-presentation.js
          grep -F 'DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-UI-HOTFIX2-20260919' owner.html
          grep -F 'const VERSION = "DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-UI-HOTFIX2-20260919";' photo-booking-presentation.js
          grep -F 'async function loadWhenReady()' photo-booking-presentation.js
          grep -F 'dpro:photo-settings-rendered' photo-booking-presentation.js
          grep -F 'dpro-studio:admin-code-changed' photo-booking-presentation.js
          grep -F '管理画面の認証完了を待っています' photo-booking-presentation.js
          if grep -Fq 'load().catch(showError);' photo-booking-presentation.js; then
            echo "old eager load remains"
            exit 1
          fi
          git diff --check

      - name: Scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).split())
          allowed = {"owner.html", "photo-booking-presentation.js"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY

      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-4-WHITELABEL-HOTFIX2.yml"
          git diff --check

      - name: Commit HOTFIX2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-booking-presentation.js .github/workflows
          git diff --cached --check
          git commit -m "Fix PHOTO white-label owner auth timing BRUSHUP-8-4 HOTFIX2"
          git push origin HEAD:main

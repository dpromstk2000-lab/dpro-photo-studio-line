        run: |
          set -euo pipefail
          python3 - <<'PY_R37'
          import io,base64,hashlib,pathlib,zipfile
          sealed=base64.b64decode('')
          hashes={'R37_WORKER_SIGNED_ADMIN_REVIEW_ONLY_DO_NOT_DEPLOY.mjs': '51576bb2e6f5eb0370de7e1f5d6a44c996dbddc435ef0907ac9c339f91fbfa9c', 'R37_SIGNED_ADMIN_E2E_SYNTHETIC_QA.cjs': 'b7454a409d659184855959c948f1fee13746f3f4a0e123395d6db422daa6677d', 'compiled/R37_GATEWAY_SIGNED_ADMIN_REVIEW_ONLY_DO_NOT_DEPLOY.js': '236f4be53c288c9b1299facaeb276a16b58ffcdf437beabf0247641fbef8ff1e'}
          target=pathlib.Path('/tmp/r37-sealed-review-only')
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(sealed)) as archive:
            assert set(archive.namelist())==set(hashes),'EXTRA_R37_ARCHIVE_ITEM'
            for name,digest in hashes.items():
              pp=pathlib.PurePosixPath(name)
              assert not pp.is_absolute() and '..' not in pp.parts and len(pp.parts)<=2,'BAD_ARCHIVE_PATH'
              content=archive.read(name)
              assert hashlib.sha256(content).hexdigest()==digest,'SEALED_SOURCE_HASH_MISMATCH'
              output=target/name
              output.parent.mkdir(exist_ok=True,parents=True)
              output.write_bytes(content)
          print('R37: sealed sources verified; no GitHub checkout, production database or real network')
          PY_R37
          node --check /tmp/r37-sealed-review-only/R37_WORKER_SIGNED_ADMIN_REVIEW_ONLY_DO_NOT_DEPLOY.mjs
          node --check /tmp/r37-sealed-review-only/R37_SIGNED_ADMIN_E2E_SYNTHETIC_QA.cjs
          node /tmp/r37-sealed-review-only/R37_SIGNED_ADMIN_E2E_SYNTHETIC_QA.cjs
          echo 'R37_PASS: authorization uses signed gateway scopes, not demo/admin-code header'

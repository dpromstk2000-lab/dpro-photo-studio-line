name: DPRO PHOTO BRUSHUP-9-1-2 Owner Settings Staff

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  owner-settings-staff:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="21dd0c5f8d78c2e33feb0e891a2ca23e7d59f41a"
          WORKFLOW=".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-1-2-SETTINGS-STAFF.yml"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi

          test -f owner.html
          test -f config.js
          grep -F 'id="view-settings"' owner.html
          grep -F 'スタッフ・撮影スペース・プラン' owner.html
          grep -F 'photo-booking-presentation.js?v=DPRO-PHOTO-PRODUCTION-READINESS-BRUSHUP-8-5-LINE-ENTRY-20260919' owner.html
          grep -F 'CALENDAR_API_BASE_URL' config.js

      - name: Write Owner settings V2 module
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > photo-owner-settings-v2.js
          node --check photo-owner-settings-v2.js

      - name: Patch owner page
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_owner_settings_v2.py
          python -m py_compile /tmp/patch_owner_settings_v2.py
          python /tmp/patch_owner_settings_v2.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-owner-settings-v2.js
          grep -F 'photo-owner-settings-v2.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-1-2-UI-20260919' owner.html
          grep -F 'かんたん設定' photo-owner-settings-v2.js
          grep -F 'スタッフ管理' photo-owner-settings-v2.js
          grep -F '/api/admin/staff-management' photo-owner-settings-v2.js
          grep -F '/api/admin/staff-management/save' photo-owner-settings-v2.js
          grep -F '最後の予約担当スタッフ' photo-owner-settings-v2.js || true
          grep -F '予約画面・既存ホームページ連携' photo-owner-settings-v2.js
          grep -F 'CSVデータ移行' photo-owner-settings-v2.js
          grep -F 'LINE友だち・既存顧客' photo-owner-settings-v2.js
          git diff --check

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).split())
          untracked = set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"], text=True).split())
          changed |= untracked
          allowed = {"owner.html", "photo-owner-settings-v2.js"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY

          grep -F 'photo-booking-presentation.js?v=DPRO-PHOTO-PRODUCTION-READINESS-BRUSHUP-8-5-LINE-ENTRY-20260919' owner.html
          grep -F 'photo-crm-line-link.js?v=DPRO-PHOTO-CRM-BRUSHUP-7-20260918' owner.html
          grep -F 'photo-crm-import.js?v=DPRO-PHOTO-CRM-BRUSHUP-6-HOTFIX2-20260918' owner.html
          grep -F 'settingsSaveBtn' owner.html

      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-1-2-SETTINGS-STAFF.yml"
          git diff --check

      - name: Commit BRUSHUP-9-1-2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-owner-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-owner-settings-v2.js .github/workflows
          git diff --cached --check
          git commit -m "Add PHOTO Owner settings navigation and staff management BRUSHUP-9-1-2"
          git push origin HEAD:main

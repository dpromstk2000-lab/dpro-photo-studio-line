name: DPRO Photo Linkage Standard R1 FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write business calendar UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          data = base64.b64decode("").decode("utf-8")
          Path("photo-owner-business-calendar.js").write_text(data, encoding="utf-8")
          PY

      - name: Apply DPRO linkage standard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          owner = Path("owner.html")
          s = owner.read_text(encoding="utf-8")

          old = '<div class="field"><label for="settingOpenDays">何日先まで受付</label><input id="settingOpenDays" class="input" type="number" min="1" max="730" /></div>'
          new = '<div class="field"><label for="settingOpenDays">予約受付期間</label><select id="settingOpenDays" class="input"><option value="60">2か月先まで</option><option value="90">3か月先まで</option><option value="120">4か月先まで</option><option value="150">5か月先まで</option><option value="180">6か月先まで</option></select><div class="field-help">DPRO標準：2〜6か月。初期推奨は3か月、店舗運用に合わせて変更できます。</div></div>'

          if old in s:
              s = s.replace(old, new, 1)
          elif 'id="settingOpenDays"' not in s or '2か月先まで' not in s:
              raise SystemExit("ERROR: owner reservation range anchor not found")

          tag = '<script src="./photo-owner-business-calendar.js?v=DPRO-PHOTO-LINKAGE-STANDARD-R1-FIX-20261006"></script>'
          old_tag = '<script src="./photo-owner-business-calendar.js?v=DPRO-PHOTO-LINKAGE-STANDARD-R1-20261006"></script>'
          anchor = '<script src="./photo-owner-setup-checklist.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-4-SETUP-CHECKLIST-UI-20260919"></script>'

          s = s.replace(old_tag, tag)
          if tag not in s:
              if anchor not in s:
                  raise SystemExit("ERROR: owner script anchor not found")
              s = s.replace(anchor, anchor + "\n" + tag, 1)
          owner.write_text(s, encoding="utf-8")

          plan = Path("photo-owner-plan-resource.js")
          p = plan.read_text(encoding="utf-8")

          old2 = '<div class="field"><label for="prPlanOpenDays">何日先まで公開</label><input id="prPlanOpenDays" class="input" type="number" min="1" max="730" value="${Number(row?.booking_open_days ?? 180)}" /></div>'
          new2 = '<div class="field"><label for="prPlanOpenDays">予約公開期間</label><select id="prPlanOpenDays" class="input">${[60,90,120,150,180].map((v) => `<option value="${v}" ${Number(row?.booking_open_days ?? 180)===v ? "selected" : ""}>${v/30}か月先まで</option>`).join("")}</select><div class="pr-v2-help">DPRO標準：2〜6か月。店舗全体の受付期間より長い値は店舗設定側で自動制限されます。</div></div>'

          if old2 in p:
              p = p.replace(old2, new2, 1)
          elif 'id="prPlanOpenDays"' not in p or '[60,90,120,150,180]' not in p:
              raise SystemExit("ERROR: plan booking range anchor not found")
          plan.write_text(p, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          o = Path("owner.html").read_text(encoding="utf-8")
          p = Path("photo-owner-plan-resource.js").read_text(encoding="utf-8")
          j = Path("photo-owner-business-calendar.js").read_text(encoding="utf-8")

          checks = {
              "owner_2m": '<option value="60">2か月先まで</option>' in o,
              "owner_6m": '<option value="180">6か月先まで</option>' in o,
              "business_calendar_script": "photo-owner-business-calendar.js" in o,
              "plan_2to6": "[60,90,120,150,180]" in p,
              "one_year": "addDays(today(),365)" in j,
              "temporary_close": 'value="closed">臨時休業' in j,
              "special_open": 'value="special_open">特別営業' in j,
              "calendar_api": "/api/admin/calendar-overrides" in j,
          }
          print(checks)
          bad = [k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit("ERROR: validation failed " + repr(bad))
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html photo-owner-plan-resource.js photo-owner-business-calendar.js
          git commit -m "Add DPRO photo business calendar linkage standard"
          git push

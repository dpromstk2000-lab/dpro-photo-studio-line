name: DPRO Photo Feature Switch UI V2 HOTFIX1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix UI mutation loop
        shell: bash
        run: |
          echo '' | base64 -d > photo-feature-switch-ui-v2.js

          python - <<'PY'
          from pathlib import Path

          path = Path("owner.html")
          s = path.read_text(encoding="utf-8")

          old = '<script src="./photo-feature-switch-ui-v2.js?v=DPRO-PHOTO-FEATURE-SWITCH-UI-V2-20261006"></script>'
          new = '<script src="./photo-feature-switch-ui-v2.js?v=DPRO-PHOTO-FEATURE-SWITCH-UI-V2-HOTFIX1-20261006"></script>'

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("ERROR: feature switch UI script tag not found")

          path.write_text(s, encoding="utf-8")
          print("UI V2 HOTFIX1 installed")
          PY

      - name: Validate
        shell: bash
        run: |
          node --check photo-feature-switch-ui-v2.js
          python - <<'PY'
          from pathlib import Path

          owner = Path("owner.html").read_text(encoding="utf-8")
          ui = Path("photo-feature-switch-ui-v2.js").read_text(encoding="utf-8")

          checks = {
              "hotfix_script_loaded": "photo-feature-switch-ui-v2.js?v=DPRO-PHOTO-FEATURE-SWITCH-UI-V2-HOTFIX1-20261006" in owner,
              "no_mutation_observer": "new MutationObserver" not in ui,
              "guarded_title": 'title.textContent !== "使う機能"' in ui,
              "guarded_subtitle": "subtitle.textContent !== subtitleText" in ui,
              "simple_ui_preserved": "feature-simple-main" in ui and "feature-simple-details" in ui,
              "all_switch_ids_preserved": all(x in ui for x in [
                  "featureCustomerFollowup","featureSubjectHistory","featureLifecycleSearch",
                  "featureBirthdaySearch","featureReturnCycleSearch","featureLineSegment",
                  "featureCsvMigration","featureLineCustomerLink"
              ]),
          }

          print(checks)
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("ERROR: validation failed: " + ", ".join(failed))
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html photo-feature-switch-ui-v2.js
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Fix DPRO Photo feature switch UI auth loop"
          git push

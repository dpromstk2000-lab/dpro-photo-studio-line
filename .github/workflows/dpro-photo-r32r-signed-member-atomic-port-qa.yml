name: DPRO PHOTO R32R Signed Member Atomic Gateway-Port PostgreSQL 17 QA NO DEPLOY
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: dpro-photo-r32r-atomic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r32r-signed-atomic-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: photo_qa
          POSTGRES_PASSWORD: synthetic_disposable_fixture_only
          POSTGRES_DB: photo_qa
        options: >-
          --health-cmd "pg_isready -U photo_qa -d photo_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Validate member signed assertion and one-transaction request using disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true" || { echo 'GITHUB ISOLATED JOB REQUIRED'; exit 2; }
          mapfile -t ids < <(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}')
          test "${#ids[@]}" -eq 1 || { echo 'REFUSE: exactly one disposable PG17 container required'; exit 3; }

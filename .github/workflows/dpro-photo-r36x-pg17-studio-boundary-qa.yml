          rejected(lambda:call({**p,'start_at':(START+timedelta(days=3)).isoformat(),'subjects':[{'id':str(subject),'subject_name':'架空の子'}]},
            verified=uuid.uuid4(),subject_fps=['b'*64]),'unknown verified customer rejected')

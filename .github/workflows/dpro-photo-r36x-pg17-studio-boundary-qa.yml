            db.execute((root/'R36W_ATOMIC_BOOKING_REVIEW_ONLY_DO_NOT_RUN.sql').read_text())
          STUDIO=uuid.uuid4();STUDIO_OTHER=uuid.uuid4(); PLAN=uuid.uuid4();PLAN_OTHER=uuid.uuid4(); STAFF=uuid.uuid4();ROOM=uuid.uuid4()
          with connect(DSN,autocommit=True) as db:
           for studio,plan in [(STUDIO,PLAN),(STUDIO_OTHER,PLAN_OTHER)]:
            db.execute('INSERT INTO public.photo_studios(id,studio_code) VALUES(%s,%s)',(studio,'SYNTHETIC-'+str(studio)[:8]))
            db.execute('INSERT INTO public.photo_studio_settings(studio_id) VALUES(%s)',(studio,))
            db.execute('INSERT INTO public.photo_plans(id,studio_id,plan_code,plan_name,default_resource_id) VALUES(%s,%s,%s,%s,NULL)',(plan,studio,'TEST','完全架空テストプラン'))
           db.execute('INSERT INTO public.photo_staff(id,studio_id,staff_name) VALUES(%s,%s,%s)',(STAFF,STUDIO,'架空スタッフ'))
           db.execute('INSERT INTO public.photo_resources(id,studio_id,resource_name) VALUES(%s,%s,%s)',(ROOM,STUDIO,'架空撮影室'))
          nextday=datetime.now(ZoneInfo('Asia/Tokyo')).date()+timedelta(days=10)
          START=datetime.combine(nextday,time(10,0),ZoneInfo('Asia/Tokyo'))
          COUNT=0
          
          def good(ok,why):
           global COUNT
           assert ok,why
           COUNT+=1
           print(f'PASS {COUNT:03d} {why}',flush=True)
          
          def sample(**kwargs):
           b={'plan_id':str(PLAN),'start_at':START.isoformat(),'assigned_staff_id':str(STAFF),'resource_id':str(ROOM),
           'customer_name':'架空保護者','phone':'09011112222','subjects':[{'subject_name':'架空の子','subject_type':'child'}],
           'options':[{'option_code':'PHOTO','option_name':'架空写真オプション','quantity':1}],
           'intake':{'common_answers':{'synthetic':True},'plan_answers':{},'summary':'合成入力','confirmed':True}}
           b.update(kwargs);return b
          
          def synthetic_subject_fingerprints(body,studio):
           """Disposable-only HMAC; UUIDs must be serialized as text (R36V.1 CI fix).
          
           Use each booking's actual Asia/Tokyo date, rather than the global initial
           test date, so date-dependent duplicate checks remain meaningful.
           """
           local_day=datetime.fromisoformat(body['start_at']).astimezone(ZoneInfo('Asia/Tokyo')).date().isoformat()
           return [hmac.new(b'R36V DISPOSABLE ONLY',
             json.dumps([str(studio),local_day,body['phone'],s['subject_name']],ensure_ascii=False).encode(),
             hashlib.sha256).hexdigest() for s in body.get('subjects',[])]
          
          def call(body,idem=None,fp=None,subject_fps=None,studio=STUDIO,verified=None,source='line',verified_line=None):
           idem=idem or uuid.uuid4();fp=fp or hashlib.sha256(json.dumps(body,sort_keys=True).encode()).hexdigest()
           if subject_fps is None:
            subject_fps=synthetic_subject_fingerprints(body,studio)
           with connect(DSN) as db:
            v=db.execute('SELECT public.photo_booking_atomic_r36v(%s,%s,%s,%s,%s,%s,%s,%s)',
              (studio,source,Jsonb(body),idem,fp,subject_fps,verified,verified_line)).fetchone()[0]
            db.commit()
           return v
          
          def rejected(fn,description):
           try:fn()
           except Exception:
            good(True,description);return
           raise AssertionError('expected database rejection: '+description)
          
          def counts():
           with connect(DSN) as db:
            return tuple(db.execute('SELECT COUNT(*) FROM public.'+name).fetchone()[0] for name in
              ('photo_customers','photo_subjects','photo_reservations','photo_reservation_subjects','photo_reservation_options',
               'photo_intake_answers','photo_follow_tasks','photo_booking_receipts_r36v','photo_booking_subject_claims_r36v'))
          
          p=sample();k=uuid.uuid4();result=call(p,idem=k)
          assert result.get('ok'),result
          good(result['replayed'] is False,'first booking success')
          good(all(result['reservation'].get(x) for x in ('id','reservation_no','public_token')),'public booking receipt returned')
          good(counts()==(1,1,1,1,1,1,2,1,1),'all 9 related tables atomic')
          repeat=call(p,idem=k)
          good(repeat['replayed'] and repeat['reservation']['id']==result['reservation']['id'],'idempotent replay returns same reservation')
          good(counts()==(1,1,1,1,1,1,2,1,1),'replay creates no additional records')
          rejected(lambda:call({**p,'customer_name':'changed'},idem=k),'same nonce different payload denied')
          good(counts()==(1,1,1,1,1,1,2,1,1),'mismatched replay no side effects')
          rejected(lambda:call({**p,'selected_customer_id':str(uuid.uuid4())}),'public fake selected_customer_id denied')
          rejected(lambda:call({**p,'line_user_id':'ATTACKER'}),'client LINE ID denied')
          rejected(lambda:call({**p,'customer_id':str(uuid.uuid4())}),'public fake customer_id denied')
          good(counts()==(1,1,1,1,1,1,2,1,1),'spoofing attempt writes none')
          rejected(lambda:call({**p,'start_at':(START+timedelta(minutes=15)).isoformat(),
           'subjects':[{'subject_name':'別の子','subject_type':'child'}]},subject_fps=['1'*64]),'non 30-minute slot denied')
          rejected(lambda:call({**p,'subjects':[{'subject_name':'他の子','subject_type':'child'}]},subject_fps=['2'*64]),'staff or resource overlap blocked')
          rejected(lambda:call({**p,'start_at':(START+timedelta(hours=2)).isoformat()}),'same phone and subject same-day collision blocked')
          rejected(lambda:call({**p,'start_at':(START+timedelta(hours=2)).isoformat(),
           'options':[{'option_code':'DUP','option_name':'架空A'},{'option_code':'DUP','option_name':'架空B'}],
           'subjects':[{'subject_name':'別の子','subject_type':'child'}]},subject_fps=['3'*64]),'failure in child option insert rolls back entire transaction')
          good(counts()==(1,1,1,1,1,1,2,1,1),'option error left no orphan rows')
          rejected(lambda:call({**p,'start_at':(START+timedelta(hours=2)).isoformat(),
           'subjects':[{'subject_name':'別の子','subject_type':'child','id':str(uuid.uuid4())}]},subject_fps=['4'*64]),'guest cannot attach arbitrary subject id')
          rejected(lambda:call({**p,'start_at':(START+timedelta(hours=2)).isoformat(),
           'subjects':[{'subject_name':'別の子','subject_type':'child'}]},subject_fps=['ZZZ']), 'malformed fingerprint rejected')
          with connect(DSN,autocommit=True) as db:
           db.execute('UPDATE public.photo_reservations SET reservation_status=%s WHERE id=%s',('cancelled',result['reservation']['id']))
           v=db.execute('SELECT active FROM public.photo_booking_subject_claims_r36v WHERE reservation_id=%s',(result['reservation']['id'],)).fetchone()[0]
          good(v is False,'cancellation synchronously deactivates same-day subject claim')
          rebook=call({**p,'start_at':(START+timedelta(hours=2)).isoformat(),
           'subjects':[{'subject_name':'架空の子','subject_type':'child'}]})
          good(rebook['ok'],'after cancellation, different time same day allowed')
          # Verified customer source match is server proof; anonymous phone equality must not merge customers.
          guest2=call({**p,'phone':'09033334444','start_at':(START+timedelta(days=1)).isoformat()},subject_fps=['f'*64])
          good(guest2['ok'] and counts()[0]==3,'new guest booking never takes over by matching name')
          # Same verified customer can book different day, and subject ID cannot cross tenants.
          with connect(DSN) as db:
           c=db.execute('SELECT customer_id FROM public.photo_reservations WHERE id=%s',(result['reservation']['id'],)).fetchone()[0]
           subject=db.execute('SELECT subject_id FROM public.photo_reservation_subjects WHERE reservation_id=%s',(result['reservation']['id'],)).fetchone()[0]
          item={**p,'start_at':(START+timedelta(days=2)).isoformat(),'subjects':[{'id':str(subject),'subject_name':'架空の子'}]}
          verified=call(item,verified=c,subject_fps=['a'*64])

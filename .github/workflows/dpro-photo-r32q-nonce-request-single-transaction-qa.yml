name: DPRO PHOTO R32Q Unified Nonce Atomic Request PostgreSQL 17 QA NO DEPLOY
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: dpro-photo-r32q-atomic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r32q-atomic-nonce-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: photo_qa
          POSTGRES_PASSWORD: fixture_only_no_real_secrets
          POSTGRES_DB: photo_qa
        options: >-
          --health-cmd "pg_isready -U photo_qa -d photo_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: R32Q isolated PostgreSQL atomic nonce plus customer request QA
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true" || { echo 'ISOLATED GITHUB JOB REQUIRED'; exit 2; }
          mapfile -t ids < <(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}')
          if [ "${#ids[@]}" -ne 1 ]; then echo 'REFUSE: exactly one disposable PostgreSQL container required'; exit 3; fi
          export R32Q_PG_CONTAINER_ID="${ids[0]}"
          wd="$(mktemp -d)"
          trap 'rm -rf "$wd"' EXIT
          cd "$wd"
          python3 - <<'PYCODE'

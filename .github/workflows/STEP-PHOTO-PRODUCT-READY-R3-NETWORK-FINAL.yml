name: DPRO PHOTO Product Ready R3 Network Final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-PHOTO-PRODUCT-READY-R3-NETWORK-FINAL.yml'

permissions:
  contents: write

jobs:
  photo-r3-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R2 source binding
        shell: bash
        run: |
          set -euo pipefail
          test -f config.js
          test -f index.html
          test -f member.html
          test -f owner.html
          test -f staff.html
          test -f owner-ipad.html
          test -f system-check.html

          grep -F 'DPRO-PHOTO-FRONT-R2-20260824' config.js
          grep -F 'DPRO-PHOTO-ADAPTER-R2-20260824' config.js
          grep -F 'DPRO-PHOTO-DB-R2-20260824' config.js
          grep -F 'STUDIO-10-R9-WORKER-SUBJECT-DAY-DUPLICATE-GUARD-20260715' config.js
          grep -F 'https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-photo-product-ready-gateway-v3' config.js

          echo "SOURCE_VERIFY=PASS"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fresh HTTP proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/photo-r3

          GATEWAY='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-photo-product-ready-gateway-v3'
          LEGACY='https://dpro-photo-studio-line-api.dpromstk2000.workers.dev'
          APP='https://dpromstk2000-lab.github.io/dpro-photo-studio-line'
          SALES='https://dpromstk2000-lab.github.io/dpro-line-systems-site'

          http_get() {
            local url="$1"
            local out="$2"
            local code
            code="$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -sS -L -o "$out" -w '%{http_code}' "$url")"
            echo "$code"
          }

          code="$(http_get "$GATEWAY/api/health?r3=$GITHUB_RUN_ID" /tmp/photo-gateway-health.json)"
          test "$code" = "200"

          code2="$(http_get "$GATEWAY/api/product-ready/check?r3=$GITHUB_RUN_ID" /tmp/photo-product-ready.json)"
          test "$code2" = "200"

          code3="$(http_get "$LEGACY/api/health?r3=$GITHUB_RUN_ID" /tmp/photo-legacy-health.json)"
          test "$code3" = "200"

          python - <<'PY'
          import json

          gh=json.load(open('/tmp/photo-gateway-health.json',encoding='utf-8'))
          pr=json.load(open('/tmp/photo-product-ready.json',encoding='utf-8'))
          lg=json.load(open('/tmp/photo-legacy-health.json',encoding='utf-8'))

          expected_worker='STUDIO-10-R9-WORKER-SUBJECT-DAY-DUPLICATE-GUARD-20260715'

          for d,name in [(gh,'gateway health'),(pr,'product ready')]:
              assert d.get('ok') is True, (name,d)
              versions=d.get('versions') or {}
              observed=versions.get('observed') or {}
              expected=versions.get('expected') or {}
              assert versions.get('versionsAligned') is True
              assert expected.get('adapter') == 'DPRO-PHOTO-ADAPTER-R2-20260824'
              assert expected.get('database') == 'DPRO-PHOTO-DB-R2-20260824'
              assert expected.get('frontend') == 'DPRO-PHOTO-FRONT-R2-20260824'
              assert expected.get('legacy_worker') == expected_worker
              assert observed.get('adapter') == expected.get('adapter')
              assert observed.get('database') == expected.get('database')
              assert observed.get('frontend') == expected.get('frontend')
              assert observed.get('legacy_worker') == expected_worker
              assert d.get('legacyRuntime',{}).get('version') == expected_worker

          assert lg.get('ok') is True
          assert lg.get('version') == expected_worker
          print('RUNTIME_JSON=PASS')
          PY

          cp /tmp/photo-gateway-health.json product-ready-evidence/photo-r3/gateway-health.json
          cp /tmp/photo-product-ready.json product-ready-evidence/photo-r3/product-ready-check.json
          cp /tmp/photo-legacy-health.json product-ready-evidence/photo-r3/legacy-health.json

          python - <<'PY'
          import json, subprocess, time, pathlib

          urls = [
            ('index','https://dpromstk2000-lab.github.io/dpro-photo-studio-line/index.html?demo=1'),
            ('member','https://dpromstk2000-lab.github.io/dpro-photo-studio-line/member.html?demo=1'),
            ('owner','https://dpromstk2000-lab.github.io/dpro-photo-studio-line/owner.html?demo=1'),
            ('staff','https://dpromstk2000-lab.github.io/dpro-photo-studio-line/staff.html?demo=1'),
            ('owner_ipad','https://dpromstk2000-lab.github.io/dpro-photo-studio-line/owner-ipad.html?demo=1'),
            ('system_check','https://dpromstk2000-lab.github.io/dpro-photo-studio-line/system-check.html?demo=1'),
            ('product_site','https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/photo-studio.html'),
            ('official_site','https://dpro-shop.com/systems/photo-studio'),
          ]
          result=[]
          for key,url in urls:
              cp=subprocess.run(['curl','--retry','3','--retry-delay','2','--connect-timeout','15','--max-time','45','-sS','-L','-o',f'/tmp/{key}.html','-w','%{http_code}',url],capture_output=True,text=True)
              code=int(cp.stdout.strip() or 0)
              size=pathlib.Path(f'/tmp/{key}.html').stat().st_size if pathlib.Path(f'/tmp/{key}.html').exists() else 0
              result.append({'key':key,'url':url,'httpStatus':code,'bytes':size,'ok':code==200 and size>200})
          if not all(x['ok'] for x in result):
              raise SystemExit(json.dumps(result,ensure_ascii=False,indent=2))
          pathlib.Path('product-ready-evidence/photo-r3/public-http.json').write_text(
              json.dumps({'ok':True,'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'results':result},ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8'
          )
          print('PUBLIC_HTTP=PASS')
          PY

          pdf_code="$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -sS -L -o /tmp/flyer-photo.pdf -w '%{http_code}' "$SALES/flyer-photo.pdf?r3=$GITHUB_RUN_ID")"
          test "$pdf_code" = "200"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/flyer-photo.pdf')
          b=p.read_bytes()
          assert len(b)>10000, len(b)
          assert b.startswith(b'%PDF-')
          print('FLYER_PDF=PASS',len(b))
          PY

          python - <<'PY'
          import json, pathlib, time
          p=pathlib.Path('/tmp/flyer-photo.pdf')
          out={
            'ok':True,
            'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'url':'https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-photo.pdf',
            'httpStatus':200,
            'bytes':p.stat().st_size,
            'pdfHeader':p.read_bytes()[:5].decode('ascii','replace')
          }
          pathlib.Path('product-ready-evidence/photo-r3/flyer-http.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/photo-r3
          cd /tmp/photo-r3
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh public Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/photo-r3/screenshots

          cat > /tmp/photo-r3/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-photo-studio-line/';
          const cases=[
            {key:'pc1440-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'mobile390-index',file:'index.html?demo=1',width:390,height:844},
            {key:'mobile320-index',file:'index.html?demo=1',width:320,height:720},
            {key:'ipad1024-owner',file:'owner-ipad.html?demo=1',width:1024,height:768},
            {key:'member390',file:'member.html?demo=1',width:390,height:844},
            {key:'staff1024',file:'staff.html?demo=1',width:1024,height:768},
            {key:'systemcheck1440',file:'system-check.html?demo=1',width:1440,height:1000}
          ];

          const blocking=/(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;
          const technical=/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;

          const browser=await chromium.launch({headless:true});
          const results=[];
          let failed=false;

          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            const pageErrors=[], consoleErrors=[], httpErrors=[];

            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()})});

            let status=0,navigationError='';
            try{
              const resp=await page.goto(BASE+c.file+(c.file.includes('?')?'&':'?')+'r3='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              status=resp?.status()||0;
              await page.waitForTimeout(4000);
            }catch(e){navigationError=String(e)}

            const metrics=navigationError?null:await page.evaluate(()=>{
              const de=document.documentElement,b=document.body;
              return {
                innerWidth:window.innerWidth,
                documentScrollWidth:de?.scrollWidth||0,
                bodyScrollWidth:b?.scrollWidth||0,
                overflow:Math.max(de?.scrollWidth||0,b?.scrollWidth||0)>window.innerWidth+1,
                text:(b?.innerText||'').slice(0,250000)
              };
            });

            const blockingConsoleErrors=consoleErrors.filter(x=>blocking.test(x));
            const criticalResourceErrors=httpErrors.filter(x=>['document','script','stylesheet'].includes(x.resourceType));
            const technicalExposure=metrics?technical.test(metrics.text):true;

            const rec={...c,url:BASE+c.file,httpStatus:status,navigationError,
              innerWidth:metrics?.innerWidth??0,
              documentScrollWidth:metrics?.documentScrollWidth??0,
              bodyScrollWidth:metrics?.bodyScrollWidth??0,
              overflow:metrics?.overflow??true,
              pageErrors,consoleErrors,blockingConsoleErrors,httpErrors,criticalResourceErrors,technicalExposure};

            rec.ok=!navigationError&&status===200&&!rec.overflow&&pageErrors.length===0&&blockingConsoleErrors.length===0&&criticalResourceErrors.length===0&&!technicalExposure;
            if(!rec.ok)failed=true;
            results.push(rec);

            if(!navigationError){
              await page.screenshot({path:`product-ready-evidence/photo-r3/screenshots/${c.key}.png`,fullPage:true});
            }
            await ctx.close();
          }

          await browser.close();

          const summary={
            ok:!failed,
            checkedAt:new Date().toISOString(),
            sourceHead:process.env.SOURCE_HEAD||null,
            frontendVersion:'DPRO-PHOTO-FRONT-R2-20260824',
            adapterVersion:'DPRO-PHOTO-ADAPTER-R2-20260824',
            databaseVersion:'DPRO-PHOTO-DB-R2-20260824',
            legacyWorkerVersion:'STUDIO-10-R9-WORKER-SUBJECT-DAY-DUPLICATE-GUARD-20260715',
            total:results.length,
            passed:results.filter(x=>x.ok).length,
            failed:results.filter(x=>!x.ok).length,
            results
          };
          fs.writeFileSync('product-ready-evidence/photo-r3/browser-final.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify({ok:summary.ok,total:summary.total,passed:summary.passed,failed:summary.failed},null,2));
          process.exit(summary.ok?0:2);
          EOF

          set +e
          node /tmp/photo-r3/qa.mjs
          rc=$?
          set -e
          echo "QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Build network final summary
        if: always()
        shell: python
        run: |
          import json, pathlib, datetime

          root=pathlib.Path('product-ready-evidence/photo-r3')
          browser=json.loads((root/'browser-final.json').read_text()) if (root/'browser-final.json').exists() else {'ok':False}
          public=json.loads((root/'public-http.json').read_text()) if (root/'public-http.json').exists() else {'ok':False}
          flyer=json.loads((root/'flyer-http.json').read_text()) if (root/'flyer-http.json').exists() else {'ok':False}

          runtime_ok=False
          try:
              gh=json.loads((root/'gateway-health.json').read_text())
              pr=json.loads((root/'product-ready-check.json').read_text())
              lg=json.loads((root/'legacy-health.json').read_text())
              runtime_ok=gh.get('ok') is True and pr.get('ok') is True and lg.get('ok') is True
          except Exception:
              runtime_ok=False

          out={
            'ok': bool(runtime_ok and public.get('ok') and flyer.get('ok') and browser.get('ok')),
            'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'runtimeOk':runtime_ok,
            'publicHttpOk':public.get('ok') is True,
            'flyerOk':flyer.get('ok') is True,
            'browserOk':browser.get('ok') is True,
            'closesReadyItems':['READY-006','READY-007','READY-023','READY-024','READY-028'],
            'nonblockingAlsoRefreshed':['READY-032'],
            'centralFinalLockSelfConfirmed':False
          }
          (root/'network-final.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not out['ok']:
              raise SystemExit(2)

      - name: Commit final evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -d product-ready-evidence/photo-r3 ]; then
            git add product-ready-evidence/photo-r3
            if ! git diff --cached --quiet; then
              git commit -m "Publish PHOTO R3 network evidence"
            fi
            git pull --rebase
            git push
          fi

      - name: PASS cleanup
        if: env.QA_EXIT == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('product-ready-evidence/photo-r3/network-final.json'))
          assert d.get('ok') is True
          PY

          git pull --rebase
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/STEP-PHOTO-PRODUCT-READY-R3-NETWORK-FINAL.yml
          git commit -m "Complete PHOTO Product READY R3 network gate"
          git push

      - name: FAIL preserve evidence
        if: env.QA_EXIT != '0'
        shell: bash
        run: |
          echo "PHOTO R3 network/browser proof failed. Evidence was preserved."
          exit 1

name: DPRO Photo Business Calendar Demo Auth Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch demo owner session bootstrap
        shell: bash
        run: |
          python - <<'PY'
          import base64
          code = base64.b64decode("").decode("utf-8")
          exec(compile(code, "<patch>", "exec"))
          PY

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("photo-owner-business-calendar.js").read_text(encoding="utf-8")
          required = [
              "async function ensureOwnerSession()",
              "C.isDemoMode?.()",
              "C.verifyAdminCode(code)",
              "sessionToken = await ensureOwnerSession()",
              '"X-Owner-Session":sessionToken',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("ERROR: auth fix validation failed: " + repr(missing))
          if s.count("async function ensureOwnerSession()") != 1:
              raise SystemExit("ERROR: duplicate ensureOwnerSession")
          print("Validation OK")
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-owner-business-calendar.js
          git commit -m "Fix demo owner session for business calendar"
          git push

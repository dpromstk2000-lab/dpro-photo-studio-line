      - name: Dynamic Owner Gateway Worker PG17, revocation and staff regression
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r61-disposable
          cleanup() {
            kill -INT "${GATE_PID:-}" 2>/dev/null || true
            kill "${DB_PID:-}" 2>/dev/null || true
            echo '--- R61 isolated DB diagnostic tail ---'
            tail -35 /tmp/r61-db.log 2>/dev/null || true
            echo '--- R61 Gateway Worker diagnostic tail ---'
            tail -35 /tmp/r61-gateway.log 2>/dev/null || true
          }
          trap cleanup EXIT
          python -u R61_PG17_OWNER_BINDING_BRIDGE.py > /tmp/r61-db.log 2>&1 & DB_PID=$!
          for i in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:18779/r60/inspect >/dev/null; then break; fi
            if ! kill -0 "$DB_PID" 2>/dev/null; then cat /tmp/r61-db.log; exit 1; fi
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:18779/r60/inspect >/dev/null
          R54_LOCAL_ISOLATED=YES R60_PG17_BRIDGE=YES node R61_GATEWAY_WORKER_PG17_FIXTURE.cjs > /tmp/r61-gateway.log 2>&1 & GATE_PID=$!
          for i in $(seq 1 25); do
            if curl -sS --max-time 2 http://127.0.0.1:18776/dpro-photo-product-ready-gateway/api/admin/customer-detail | grep -q '.'; then break; fi
            if ! kill -0 "$GATE_PID" 2>/dev/null; then cat /tmp/r61-gateway.log; exit 1; fi
            sleep 1
          done
          node R61_REAL_OWNER_HTTP_PG17_QA.cjs
          node R58_INHERITED_STAFF_HTTP_QA.cjs
          python - <<'FINAL'
          import psycopg,os
          with psycopg.connect(host='127.0.0.1',port=5432,user=os.environ['PGUSER'],password=os.environ['PGPASSWORD'],dbname=os.environ['PGDATABASE']) as c:
              with c.cursor() as q:
                  for name,expected in [('photo_customers',2),('photo_subjects',3),('photo_import_lineage',5),('photo_import_batches',2)]:
                      q.execute('SELECT count(*) FROM public.'+name)
                      assert q.fetchone()[0]==expected,name
                  q.execute("SELECT count(*) FROM photo_r61_private.gateway_owner_sessions WHERE revoked_at IS NOT NULL")
                  assert q.fetchone()[0]==1,'Owner revocation must reach PG17'
                  q.execute('SELECT count(*) FROM photo_r61_private.gateway_owner_sessions')
                  assert q.fetchone()[0]==1,'No fixed or duplicate Owner session ID'
                  q.execute("SELECT count(*) FROM photo_r59_private.csv_previews WHERE state='imported' AND encrypted_payload IS NULL")
                  assert q.fetchone()[0]==2,'Encrypted staged payload purge'
          print('R61 DISPOSABLE PG17 dynamic verified Owner session and atomic CSV QA PASS')
          FINAL
          echo 'R61 PG17 ISOLATED QA SUCCESS. NO PRODUCTION CONNECTION.'

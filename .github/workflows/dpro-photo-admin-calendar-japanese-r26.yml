      - name: Verify JavaScript syntax and unchanged user interaction contract
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-admin-calendar-ja-r26.js
          python - <<'PY_R26_VERIFY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re,subprocess,hashlib
          owner=Path('owner.html').read_text(encoding='utf-8'); js=Path('photo-admin-calendar-ja-r26.js').read_text(encoding='utf-8')
          class HtmlParser(HTMLParser):
           def __init__(self):super().__init__();self.scripts=[];self.cur=None
           def handle_starttag(self,tag,attrs):
            if tag=='script':self.cur={'attrs':dict(attrs),'data':''}
           def handle_data(self,data):
            if self.cur is not None:self.cur['data']+=data
           def handle_endtag(self,tag):
            if tag=='script' and self.cur is not None:self.scripts.append(self.cur);self.cur=None
          p=HtmlParser();p.feed(owner)
          checks=[]
          def check(name,ok):
           checks.append({'name':name,'status':'PASS' if ok else 'FAIL'})
           checkn=checks[-1]
           if not ok: print('FAILED R26',name,flush=True)
          check('Owner HTML uses Japanese language',bool(re.search(r'<html\s+lang="ja"',owner)))
          check('R23 noindex remains',bool(re.search(r'<meta name="robots" content="noindex, nofollow"',owner)))
          check('Module included exactly once',owner.count('photo-admin-calendar-ja-r26.js?v=')==1)
          check('Prior owner business calendar remains', 'photo-owner-business-calendar.js?' in owner)
          check('Module appended after owner business calendar',owner.index('photo-owner-business-calendar.js?')<owner.index('photo-admin-calendar-ja-r26.js?'))
          for key in ['todayDate','filterDateFrom','filterDateTo','manualDate','selectionDeadline','deliveryDate']:
           check('Native ISO field retained: '+key,bool(re.search(r'<input[^>]+id="'+key+'"[^>]+type="date"',owner)))
           check('Legacy field used by owner logic: '+key,owner.count('"'+key+'"')>=2)
          for needle in [
           '2026','DPRO-PHOTO-R26-ADMIN-JA-DATE-20261011','Asia/Tokyo','日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日',
           'ISO','role','aria-label','aria-pressed','aria-expanded','prev','next','today','clear','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
           'min','max','dataset.dproDay','new Event(\'change\'','MutationObserver','is-selected','is-today','is-sun','is-sat',
           'noindex' if False else 'dpro-ja-date-trigger','focus-visible','setInterval']:
           check('Module standard marker: '+needle,needle in js)
          for forbidden in ['fetch(', 'XMLHttpRequest','apiGet(', 'apiPost(', 'localStorage.', 'sessionStorage.', 'eval(']:
           check('No network/DB/storage access: '+forbidden,forbidden not in js)
          check('Existing R21 member code not embedded in module', 'memberLoadSeq' not in js)
          check('Module size under 30 kB',len(js.encode())<30000)
          check('Owner page source under 200 kB',len(owner.encode())<200000)
          check('Owner date format stays ISO', '$("todayDate").value' in owner)
          check('Owner date fetch remains explicit on click', '$("todayLoadBtn").addEventListener("click", () => loadToday()' in owner)
          check('Manual date availability change handler remains', '$("manualDate").addEventListener("change"' in owner)
          check('No HTML scripts removed',len(p.scripts)>=12)
          check('No surprise new scripts',sum('photo-admin-calendar-ja-r26' in s['attrs'].get('src','') for s in p.scripts)==1)
          status=subprocess.run(['git','status','--porcelain'],check=True,text=True,capture_output=True).stdout.splitlines()
          changed={line[3:] for line in status if line.strip() and not line.startswith('?? DPRO_PHOTO_R26_')}
          check('Only two expected source paths changed',changed.issubset({'owner.html','photo-admin-calendar-ja-r26.js'}))
          pass_count=sum(x['status']=='PASS' for x in checks)
          failed=[x for x in checks if x['status']=='FAIL']
          report={'gate':'DPRO PHOTO R26 JAPANESE ADMIN DATE PICKER','scope':'owner management date fields; ISO and legacy handlers preserved','testMode':'GITHUB_SOURCE_STATIC_AND_NODE_SYNTAX','checks':checks,'counts':{'passed':pass_count,'failed':len(failed)},'liveApiGet':0,'mutatingRequests':0,'dataMutations':0,'sourceChangedPaths':sorted(changed),'productionReady':False,'humanAcceptance':False,'localBrowserQa':'28 PASS local Chromium in separate pre-upload check; browser not run by this workflow'}
          Path('DPRO_PHOTO_R26_STATIC_GATE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(f'R26 source gate: {pass_count} PASS, {len(failed)} FAIL; changes={sorted(changed)}; API/DB writes=0')
          if failed:raise SystemExit('R26 STOP static QA failure')
          PY_R26_VERIFY
          git diff --check

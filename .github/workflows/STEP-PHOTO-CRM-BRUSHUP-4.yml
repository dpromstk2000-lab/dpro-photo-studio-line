name: DPRO PHOTO CRM BRUSHUP-4 Follow-up Center

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photo-crm-brushup-4:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f owner.html
          test -f config.js
          grep -F 'STUDIO-11-OWNER-FINAL-INTEGRATION-20260715' owner.html
          grep -F 'DPRO-PHOTO-FRONT-R2-20260824' config.js
          grep -F 'data-view="customers"' owner.html
          grep -F 'id="view-customers"' owner.html
          grep -F 'id="view-settings"' owner.html
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Patch owner follow-up center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("owner.html")
          s = path.read_text(encoding="utf-8")
          marker = "DPRO-PHOTO-CRM-BRUSHUP-4-20260918"

          if marker in s:
              print("BRUSHUP-4 already applied; patch skipped.")
              raise SystemExit(0)

          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {n}")
              s = s.replace(old, new, 1)

          nav_anchor = '          <button class="nav-btn" data-view="customers" type="button"><span class="nav-icon">顧</span><span>顧客検索</span></button>'
          rep(
              nav_anchor,
              nav_anchor + '\n' +
              '          <button id="followupNavBtn" class="nav-btn" data-view="followup" type="button"><span class="nav-icon">育</span><span>顧客フォロー</span><span id="navFollowupBadge" class="nav-badge">-</span></button>',
              "nav"
          )

          customer_anchor = '''            <div id="customerResults" class="search-results"></div>
          </section>
        </section>

        <section id="view-post" class="view">'''

          followup_page = '''            <div id="customerResults" class="search-results"></div>
          </section>
        </section>

        <!-- DPRO-PHOTO-CRM-BRUSHUP-4-20260918 -->
        <section id="view-followup" class="view">
          <div class="page-head">
            <div><h2>顧客フォロー</h2><p>年齢・誕生日・前回撮影日から、次の撮影につながるお客様を見つけます。</p></div>
            <div class="page-actions"><button id="followupRefreshBtn" class="btn btn-secondary" type="button">最新情報へ更新</button></div>
          </div>

          <div id="followupStats" class="stats-grid"></div>

          <section class="panel">
            <div class="panel-head">
              <div><h3>ライフイベント検索</h3><p>七五三、誕生日、再来店時期などを組み合わせて検索できます。</p></div>
              <span id="followupResultCount" class="badge green">0名</span>
            </div>
            <div class="filters">
              <div class="field">
                <label for="followupTargetYear">対象年</label>
                <input id="followupTargetYear" class="input" type="number" min="1900" max="2200" />
              </div>
              <div class="field">
                <label>その年になる年齢</label>
                <div class="check-row">
                  <label><input id="followupAge3" type="checkbox" /> 3歳</label>
                  <label><input id="followupAge5" type="checkbox" /> 5歳</label>
                  <label><input id="followupAge7" type="checkbox" /> 7歳</label>
                </div>
              </div>
              <div class="field">
                <label for="followupBirthdayMonth">誕生月</label>
                <select id="followupBirthdayMonth">
                  <option value="">すべて</option>
                  <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
                  <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
                  <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
                  <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                </select>
              </div>
              <div class="field">
                <label for="followupInactiveMonths">前回撮影から</label>
                <select id="followupInactiveMonths">
                  <option value="">指定なし</option>
                  <option value="6">6か月以上</option>
                  <option value="12">1年以上</option>
                  <option value="18">1年6か月以上</option>
                  <option value="24">2年以上</option>
                  <option value="36">3年以上</option>
                </select>
              </div>
              <div class="field">
                <label for="followupLineStatus">LINE連携</label>
                <select id="followupLineStatus">
                  <option value="all">すべて</option>
                  <option value="linked">連携済み</option>
                  <option value="unlinked">未連携</option>
                </select>
              </div>
              <div class="field">
                <label for="followupQuery">名前・顧客番号・電話</label>
                <input id="followupQuery" class="input" type="search" placeholder="例：佐藤、PHOTO-DEMO-001" />
              </div>
              <button id="followupSearchBtn" class="btn btn-primary" type="button">この条件で検索</button>
            </div>
            <div class="page-actions" style="margin-top:12px;">
              <button class="btn btn-small btn-secondary" data-followup-preset="shichigosan" type="button">今年の3・5・7歳</button>
              <button class="btn btn-small btn-secondary" data-followup-preset="birthday-next" type="button">来月誕生日</button>
              <button class="btn btn-small btn-secondary" data-followup-preset="inactive-12" type="button">1年以上撮影なし</button>
              <button class="btn btn-small btn-neutral" data-followup-preset="clear" type="button">条件をクリア</button>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head"><div><h3>検索結果</h3><p>撮影対象者単位で表示します。兄弟・姉妹がいるご家庭も個別に追えます。</p></div></div>
            <div id="followupResults" class="search-results"><div class="empty">条件を指定して検索してください。</div></div>
          </section>

          <section class="panel">
            <div class="panel-head"><div><h3>LINEフォロー</h3><p>検索から配信までの誤送信防止フローは次工程で追加します。</p></div></div>
            <div class="auth-note" style="margin:0;">
              現在は検索・対象確認・撮影履歴まで利用できます。LINEセグメント配信はBRUSHUP-5で
              「対象確認 → LINE連携済み抽出 → 顧客単位の重複除去 → 文面確認 → 最終確認 → 配信ログ保存」
              を実装してから有効化します。
            </div>
          </section>
        </section>

        <section id="view-post" class="view">'''

          rep(customer_anchor, followup_page, "followup-page")

          hours_anchor = '''          <section class="panel">
            <div class="panel-head"><div><h3>営業時間</h3><p>曜日別の営業時間・最終受付を設定します。</p></div></div>'''

          feature_panel = '''          <section class="panel">
            <div class="panel-head"><div><h3>顧客フォロー機能</h3><p>写真館の運用に合わせて必要な機能だけ表示できます。</p></div></div>
            <div class="form-grid">
              <div class="field span-2">
                <label>基本機能</label>
                <div class="check-row">
                  <label><input id="featureCustomerFollowup" type="checkbox" /> 顧客フォローを使用</label>
                  <label><input id="featureSubjectHistory" type="checkbox" /> 撮影対象者ごとの履歴</label>
                  <label><input id="featureLifecycleSearch" type="checkbox" /> 年齢・ライフイベント検索</label>
                  <label><input id="featureBirthdaySearch" type="checkbox" /> 誕生日検索</label>
                  <label><input id="featureReturnCycleSearch" type="checkbox" /> 再来店時期検索</label>
                </div>
              </div>
              <div class="field span-2">
                <label>次工程で解放する機能</label>
                <div class="check-row">
                  <label><input id="featureLineSegment" type="checkbox" disabled /> LINEセグメント配信</label>
                  <label><input id="featureCsvMigration" type="checkbox" disabled /> CSVデータ移行</label>
                  <label><input id="featureLineCustomerLink" type="checkbox" disabled /> 既存顧客とLINE再紐付け</label>
                </div>
                <div class="field-help">安全実装・QAが完了するまで、この3機能はOFF固定です。</div>
              </div>
            </div>
          </section>

''' + hours_anchor

          rep(hours_anchor, feature_panel, "feature-panel")

          modal_anchor = '  <div id="loadingCover" class="loading-cover" hidden>'
          history_modal = '''  <div id="subjectHistoryModal" class="modal-backdrop" hidden>
    <section class="modal small">
      <header class="modal-head">
        <div><h3 id="subjectHistoryTitle">撮影履歴</h3><p id="subjectHistoryMeta">撮影対象者ごとの履歴です。</p></div>
        <button class="icon-btn" data-close-modal="subjectHistoryModal" type="button" aria-label="閉じる">×</button>
      </header>
      <div id="subjectHistoryBody" class="modal-body"></div>
      <footer class="modal-foot"><button class="btn btn-neutral" data-close-modal="subjectHistoryModal" type="button">閉じる</button></footer>
    </section>
  </div>

''' + modal_anchor
          rep(modal_anchor, history_modal, "history-modal")

          version_anchor = '    const VERSION = "STUDIO-11-OWNER-FINAL-INTEGRATION-20260715";'
          version_new = '''    const VERSION = "STUDIO-11-OWNER-FINAL-INTEGRATION-20260715+CRM-BRUSHUP-4-20260918";
    const CRM_VERSION = "DPRO-PHOTO-CRM-BRUSHUP-4-20260918";
    const CRM_API_BASE_URL = "https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-photo-product-ready-gateway-v4";'''
          rep(version_anchor, version_new, "version")

          rep(
              '      customerRows: [],',
              '''      customerRows: [],
      followupSummary: null,
      followupRows: [],
      selectedFollowupSubject: null,''',
              "state"
          )

          rep(
              '    function closeModal(id) { $(id).hidden = true; if (!["manualModal","reservationModal","customerModal"].some((mid) => !$(mid).hidden)) document.body.style.overflow = ""; }',
              '    function closeModal(id) { $(id).hidden = true; if (!["manualModal","reservationModal","customerModal","subjectHistoryModal"].some((mid) => !$(mid).hidden)) document.body.style.overflow = ""; }',
              "close-modal"
          )

          badge_anchor = '      $("navTaskBadge").textContent = Number(counts.open_tasks || 0) + Number(counts.reorder_open || 0);'
          rep(
              badge_anchor,
              badge_anchor + '\n      if ($("navFollowupBadge")) $("navFollowupBadge").textContent = state.followupSummary?.age_3_5_7_this_year ?? "-";',
              "nav-badge"
          )

          funcs_anchor = '    function renderPostBoard() {'
          funcs = r'''    function followupFlags() {
      return state.settings?.settings?.feature_flags || {};
    }

    function followupEnabled() {
      return followupFlags().customer_followup === true;
    }

    function crmQueryUrl(path, query = {}) {
      const url = new URL(`${CRM_API_BASE_URL}${path}`);
      Object.entries(query || {}).forEach(([key, value]) => {
        if (value === undefined || value === null || value === "") return;
        url.searchParams.set(key, String(value));
      });
      return url.toString();
    }

    async function crmAdminGet(path, query = {}) {
      const token = C.getSessionToken("owner");
      if (!token) throw new Error("管理者認証が必要です。");
      const response = await fetch(crmQueryUrl(path, query), {
        method: "GET",
        headers: { "Accept": "application/json", "X-Owner-Session": token },
        cache: "no-store",
      });
      const payload = await response.json().catch(() => null);
      if (!response.ok || payload?.ok === false) {
        throw new Error(payload?.error || payload?.message || `CRM通信に失敗しました（HTTP ${response.status}）`);
      }
      return payload;
    }

    function renderFollowupSummary() {
      const s = state.followupSummary || {};
      const stats = [
        ["撮影対象者", s.subjects_total || 0, "名", "登録中の撮影対象者", ""],
        ["今年3・5・7歳", s.age_3_5_7_this_year || 0, "名", "七五三候補", "info"],
        ["来月誕生日", s.birthday_next_month || 0, "名", "誕生日フォロー候補", "alert"],
        ["1年以上撮影なし", s.inactive_12m || 0, "名", "再来店フォロー候補", "alert"],
        ["LINE連携済み", s.line_linked || 0, "名", "将来の配信対象候補", "info"],
        ["LINE未連携", s.line_unlinked || 0, "名", "紐付け確認候補", ""],
      ];
      $("followupStats").innerHTML = stats.map(([name,value,unit,note,tone]) =>
        `<article class="stat-card ${tone}"><span>${esc(name)}</span><strong>${esc(value)}<small style="display:inline;margin-left:3px;font-size:12px;">${esc(unit)}</small></strong><small>${esc(note)}</small></article>`
      ).join("");
      updateNavBadges();
    }

    async function loadFollowupSummary() {
      if (!followupEnabled()) {
        state.followupSummary = null;
        $("followupStats").innerHTML = '<div class="empty">顧客フォロー機能は店舗設定でOFFになっています。</div>';
        return;
      }
      const result = await runBusy("顧客フォロー情報を読み込んでいます...", () =>
        crmAdminGet("/api/admin/followup/summary")
      );
      state.followupSummary = result.summary || {};
      renderFollowupSummary();
    }

    function followupAges() {
      return [3,5,7].filter((age) => $(`followupAge${age}`).checked);
    }

    async function searchFollowup() {
      if (!followupEnabled()) {
        toast("店舗設定で「顧客フォローを使用」をONにしてください。", "error");
        return;
      }
      const ages = followupAges();
      const query = {
        target_year: $("followupTargetYear").value || undefined,
        ages: ages.length ? ages.join(",") : undefined,
        birthday_month: $("followupBirthdayMonth").value || undefined,
        inactive_months: $("followupInactiveMonths").value || undefined,
        line_status: $("followupLineStatus").value || "all",
        q: $("followupQuery").value.trim() || undefined,
        limit: 300,
      };
      const result = await runBusy("顧客フォロー対象を検索しています...", () =>
        crmAdminGet("/api/admin/followup/search", query)
      );
      state.followupRows = result.rows || [];
      renderFollowupResults();
    }

    function renderFollowupResults() {
      const rows = state.followupRows || [];
      $("followupResultCount").textContent = `${rows.length}名`;
      if (!rows.length) {
        $("followupResults").innerHTML = '<div class="empty">条件に一致する撮影対象者はいません。</div>';
        return;
      }
      $("followupResults").innerHTML = rows.map((row) => {
        const age = row.turning_age === null || row.turning_age === undefined ? "年齢未登録" : `${row.turning_age}歳`;
        const birth = row.birth_date ? fmtDate(row.birth_date) : "生年月日未登録";
        const last = row.last_shoot_at ? fmtDate(row.last_shoot_at) : "撮影履歴なし";
        return `<article class="customer-row">
          <div>
            <div class="customer-name">${esc(row.subject_name)} <small style="font-size:12px;">${esc(row.relationship_to_customer || "")}</small></div>
            <div class="item-meta">ご契約者：${esc(row.customer_name)} 様｜${esc(row.customer_no || "")}</div>
            <div class="item-tags">
              ${badge(age, "green")}
              ${badge(`誕生日 ${birth}`, "gray")}
              ${badge(row.line_linked ? "LINE連携済み" : "LINE未連携", row.line_linked ? "blue" : "amber")}
            </div>
          </div>
          <div>
            <div class="field-label">撮影履歴</div>
            <div style="font-weight:850;">最終 ${esc(last)}</div>
            <div class="item-meta">${esc(row.total_shoot_count || 0)}回撮影</div>
          </div>
          <div class="page-actions">
            <button class="btn btn-small btn-secondary" data-open-customer="${esc(row.customer_id)}" type="button">顧客詳細</button>
            <button class="btn btn-small btn-neutral" data-open-subject-history="${esc(row.subject_id)}" type="button">撮影履歴</button>
          </div>
        </article>`;
      }).join("");
    }

    function setFollowupPreset(preset) {
      const now = new Date();
      const nextMonth = (now.getMonth() + 1) % 12 + 1;
      const clear = () => {
        $("followupAge3").checked = false;
        $("followupAge5").checked = false;
        $("followupAge7").checked = false;
        $("followupBirthdayMonth").value = "";
        $("followupInactiveMonths").value = "";
        $("followupLineStatus").value = "all";
        $("followupQuery").value = "";
      };
      clear();
      if (preset === "shichigosan") {
        $("followupTargetYear").value = new Date().getFullYear();
        $("followupAge3").checked = true;
        $("followupAge5").checked = true;
        $("followupAge7").checked = true;
        searchFollowup().catch(() => {});
      } else if (preset === "birthday-next") {
        $("followupBirthdayMonth").value = String(nextMonth);
        searchFollowup().catch(() => {});
      } else if (preset === "inactive-12") {
        $("followupInactiveMonths").value = "12";
        searchFollowup().catch(() => {});
      } else {
        $("followupTargetYear").value = new Date().getFullYear();
        $("followupResults").innerHTML = '<div class="empty">条件を指定して検索してください。</div>';
        $("followupResultCount").textContent = "0名";
      }
    }

    async function openSubjectHistory(subjectId) {
      const subject = (state.followupRows || []).find((row) => row.subject_id === subjectId) || {};
      const result = await runBusy("撮影履歴を読み込んでいます...", () =>
        crmAdminGet("/api/admin/subjects/history", { subject_id: subjectId })
      );
      const rows = result.rows || [];
      state.selectedFollowupSubject = subject;
      $("subjectHistoryTitle").textContent = `${subject.subject_name || "撮影対象者"}｜撮影履歴`;
      $("subjectHistoryMeta").textContent = `${subject.customer_name || ""} 様｜${rows.length}件`;
      $("subjectHistoryBody").innerHTML = rows.length ? `<div class="simple-list">${rows.map((r) =>
        `<article class="simple-item" style="padding:13px;">
          <div class="item-tags">${r.age_at_shoot === null || r.age_at_shoot === undefined ? "" : badge(`撮影時 ${r.age_at_shoot}歳`, "green")}${badge(getLabel("postStatus",r.post_status),statusTone(r.post_status))}</div>
          <p class="item-title">${esc(fmtDateTime(r.start_at))}｜${esc(r.plan_name || "撮影")}</p>
          <div class="item-meta">${esc(r.reservation_no || "")}</div>
          ${r.shooting_note ? `<p style="margin:8px 0 0;white-space:pre-wrap;">${esc(r.shooting_note)}</p>` : ""}
          ${r.favorite_shots_note ? `<p class="item-meta" style="margin-top:6px;">お気に入り：${esc(r.favorite_shots_note)}</p>` : ""}
        </article>`
      ).join("")}</div>` : '<div class="empty">この撮影対象者の完了済み撮影履歴はまだありません。</div>';
      openModal("subjectHistoryModal");
    }

''' + funcs_anchor
          rep(funcs_anchor, funcs, "crm-functions")

          render_anchor = '      $("settingPublicNotice").value = settings.public_notice || "";'
          render_new = render_anchor + r'''
      const flags = settings.feature_flags || {};
      $("featureCustomerFollowup").checked = flags.customer_followup === true;
      $("featureSubjectHistory").checked = flags.subject_history === true;
      $("featureLifecycleSearch").checked = flags.lifecycle_search === true;
      $("featureBirthdaySearch").checked = flags.birthday_search === true;
      $("featureReturnCycleSearch").checked = flags.return_cycle_search === true;
      $("featureLineSegment").checked = flags.line_segment === true;
      $("featureCsvMigration").checked = flags.csv_migration === true;
      $("featureLineCustomerLink").checked = flags.line_customer_link === true;
      $("followupNavBtn").hidden = flags.customer_followup !== true;
      if (!$("followupTargetYear").value) $("followupTargetYear").value = new Date().getFullYear();'''
          rep(render_anchor, render_new, "render-settings")

          rep(
              'public_notice: $("settingPublicNotice").value,',
              r'''public_notice: $("settingPublicNotice").value, feature_flags: { ...(state.settings?.settings?.feature_flags || {}), customer_followup: $("featureCustomerFollowup").checked, subject_history: $("featureSubjectHistory").checked, lifecycle_search: $("featureLifecycleSearch").checked, birthday_search: $("featureBirthdaySearch").checked, return_cycle_search: $("featureReturnCycleSearch").checked, line_segment: false, csv_migration: false, line_customer_link: false, crm_ui_version: CRM_VERSION },''',
              "save-feature-flags"
          )

          switch_anchor = '      if (view === "reservations" && !state.reservationRows.length) searchReservations().catch(() => {});'
          rep(
              switch_anchor,
              switch_anchor + '\n      if (view === "followup" && followupEnabled() && !state.followupSummary) loadFollowupSummary().catch(() => {});',
              "switch-view"
          )

          event_anchor = '      $("customerSearchInput").addEventListener("input", (e) => { const n = C.normalizePhone(e.target.value); $("customerNormalizedPreview").textContent = n.length >= 7 ? `正規化：${n}` : "入力すると正規化結果を表示"; });'
          rep(
              event_anchor,
              event_anchor + r'''
      $("followupSearchBtn").addEventListener("click", () => searchFollowup().catch(() => {}));
      $("followupRefreshBtn").addEventListener("click", async () => { await loadFollowupSummary(); await searchFollowup(); });''',
              "followup-events"
          )

          click_anchor = '        const cust = event.target.closest("[data-open-customer]"); if (cust) openCustomer(cust.dataset.openCustomer).catch(() => {});'
          rep(
              click_anchor,
              click_anchor + r'''
        const fp = event.target.closest("[data-followup-preset]"); if (fp) setFollowupPreset(fp.dataset.followupPreset);
        const sh = event.target.closest("[data-open-subject-history]"); if (sh) openSubjectHistory(sh.dataset.openSubjectHistory).catch(() => {});''',
              "delegated-events"
          )

          modal_array = '["manualModal","reservationModal","customerModal"]'
          if s.count(modal_array) < 2:
              raise SystemExit(f"modal arrays: expected at least 2, found {s.count(modal_array)}")
          s = s.replace(modal_array, '["manualModal","reservationModal","customerModal","subjectHistoryModal"]')

          rep(
              '      if (["dashboard","today","reservations","customers","post","tasks","settings"].includes(hash)) state.view = hash;',
              '      if (["dashboard","today","reservations","customers","followup","post","tasks","settings"].includes(hash)) state.view = hash;',
              "hash-nav"
          )

          path.write_text(s, encoding="utf-8")
          print("owner.html CRM BRUSHUP-4 patch complete.")
          PY

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-4-20260918' owner.html
          grep -F 'dpro-photo-product-ready-gateway-v4' owner.html
          grep -F 'id="view-followup"' owner.html
          grep -F 'id="featureCustomerFollowup"' owner.html
          grep -F 'data-open-subject-history' owner.html

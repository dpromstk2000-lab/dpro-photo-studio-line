name: DPRO PHOTO R59.1 PG17 Expired Preview Fixture Chronology Fix (DISPOSABLE ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r59-disposable-pg17:
    name: R59.1 draft Owner expired preview chronology and atomic import QA (NO PRODUCTION)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r59_fixture_postgres_only
          POSTGRES_DB: photo_r56_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photo_r56_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: r59_fixture_postgres_only
      PGDATABASE: photo_r56_disposable
      R56_ISOLATED_ONLY: 'YES'
      R59_DISPOSABLE_ONLY: 'YES'
      R59_FIXTURE_ONLY: 'YES'
      R59_ENABLE_DISPOSABLE_COMMIT: 'YES'
      R59_STAGING_PASSPHRASE: 'R59_SYNTHETIC_ONLY_ENCRYPTION_KEY_aaaaaaaaaaaaaaaaaaaaaaaaaa'
    steps:
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned psycopg driver before any test imports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          python - <<'PYVERIFY'
          import psycopg
          assert psycopg.__version__=='3.2.9',psycopg.__version__
          print('R59 pinned psycopg ready')
          PYVERIFY

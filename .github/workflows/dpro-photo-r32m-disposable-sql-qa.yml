name: DPRO PHOTO R32M Isolated SQL Transaction QA NO DEPLOY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r32m-offline-sqlite-transaction-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Execute disposable SQLite real-SQL transaction checks (NOT PostgreSQL)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          import base64, zlib, subprocess, pathlib, tempfile, os, sys, re, json
          B64_TEST=''
          B64_MUTATION=''
          with tempfile.TemporaryDirectory(prefix='R32M_SYNTHETIC_ONLY_') as p:
              root=pathlib.Path(p)
              (root/'R32M_ISOLATED_SQLITE_TRANSACTION_QA.py').write_bytes(zlib.decompress(base64.b64decode(B64_TEST)))
              (root/'R32M_NEGATIVE_MUTATION_QA.py').write_bytes(zlib.decompress(base64.b64decode(B64_MUTATION)))
              test=subprocess.run([sys.executable,'R32M_ISOLATED_SQLITE_TRANSACTION_QA.py'],cwd=p,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=120)
              print(test.stdout)
              if test.returncode or not re.search(r'Ran 43 tests .*?\n\nOK\b', test.stdout, flags=re.S):
                  raise SystemExit('R32M SQL TESTS FAILED; release remains HOLD')
              mut=subprocess.run([sys.executable,'R32M_NEGATIVE_MUTATION_QA.py'],cwd=p,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=120)
              print(mut.stdout)
              if mut.returncode: raise SystemExit('R32M NEGATIVE MUTATION CHECK FAILED')
              results=json.loads((root/'R32M_NEGATIVE_MUTATION_RESULTS.json').read_text())
              if results.get('total')!=6 or results.get('detected')!=6:
                  raise SystemExit('R32M NEGATIVE MUTATIONS WERE NOT ALL DETECTED')
              summary='## DPRO PHOTO R32M — Disposable SQLite Transaction QA\n\n**43 PASS / 0 FAIL** (actual SQLite SQL, synthetic test fixtures only)  \n**6 / 6 unsafe mutations detected**.  \n**RELEASE: HOLD.** SQLite cannot validate PostgreSQL row-level locks, RLS, RPC, actual Gateway authentication, production schema or live behavior.  \nNo checkout, no secrets, no remote APIs, no SQL against Supabase, no Deploy, no LINE dispatch.\n'
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(summary)
              print(summary)
          PYQA

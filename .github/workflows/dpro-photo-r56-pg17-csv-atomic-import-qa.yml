name: DPRO PHOTO R56 PG17 CSV Atomic Import Lineage QA (DISPOSABLE ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv-migration-pg17-disposable:
    name: R56 source-ID lineage / transactional CSV import (NO PRODUCTION)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photo_r56_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photo_r56_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: photo_r56_disposable
      R56_ISOLATED_ONLY: "YES"
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unseal R56 sources and verify SHA256 (no checkout, no secrets)
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          root=pathlib.Path('/tmp/dpro-photo-r56-isolated')
          root.mkdir(parents=True,exist_ok=True)
          sealed={
              'R53_CSV_IMPORT_PREFLIGHT_READ_ONLY.py': ('1b50d9ca95ae7488b790a359e2edc1de5dc9bacfd0865e099d138ef19c920599', ''),
              'R53_CSV_IMPORT_PREFLIGHT_QA.py': ('a0f097703ce4542e07fa3c2a1159773bd8fdd5c9096b2ede27e20e65316590ea', ''),
              'R53_CSV_MAPPING_TEMPLATE.json': ('22e7a7b9c6496c232f71c6d38a7fc9db7e3fc2ed8ef4e88c4a81352ae2e1743e', ''),
              'R53_SYNTHETIC_CUSTOMERS.csv': ('c3c6f835e9abaac3176348c20d3d9c701141a890ccb6dbd44e6fad8ed31b0215', ''),
              'R53_SYNTHETIC_SUBJECTS.csv': ('42d9ac3c25651da94ea8dcc5c33f23a327b37fbf6baaad4e273bea9fdd4c9e91', 'H4sIAAAAAAAC/3s2ad3TvRufrt/3YuPCFw2tni46Lxcuf7puEZDxDFXq6YReHQjnac+upx1tOs+nzH+6c8uzOR3Ppi/Veb5t1rP5LVzBugYGBoY6zhDq2ZI5z+bvfrqh6fmUFQpP105w1EnOyMxJ0TEyMDLSNzTQNzDVAYpCNBnh0uSE0GSib2Cmb2iI0GQM0WSEpmndtmfT+3UKUouK8/N0dCBcLgBNDS+r6gAAAA=='),
              'R56_DISPOSABLE_SCHEMA.sql': ('91e707c2823618e17e5e45aee0b436748eac29d59af95d9e0b52379e11ab84c1', ''),
              'R56_CSV_PG17_IMPORT_REHEARSAL.py': ('448dde12830c7a85d00746023048191e602a17ec0e48407935837e943952b86b', ''),
              'R56_LOCAL_SAFETY_QA.py': ('3da2c2098d4cde54695b0098abfe0bd9b79c8793bbc3c66295adb9f416a20d8b', ''),
              'R56_PG17_REHEARSAL_QA.py': ('1218b537367dc625be870fb850528c3c5311684900cf1cb3228eb4048df6d53c', ''),
          }
          assert len(sealed)==9
          for filename,(digest,encoded) in sealed.items():
              assert '/' not in filename and filename not in ('.','..')
              data=gzip.decompress(base64.b64decode(encoded,validate=True))
              assert hashlib.sha256(data).hexdigest()==digest,filename
              (root/filename).write_bytes(data)
              print('PASS R56 SHA256',filename)
          PY
      - name: R53/R56 source syntax, dependencies, and offline safety QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r56-isolated
          python -m py_compile *.py
          python R53_CSV_IMPORT_PREFLIGHT_QA.py
          python R56_LOCAL_SAFETY_QA.py
      - name: Install pinned PostgreSQL client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"
      - name: Load R56 schema on disposable PostgreSQL 17 only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r56-isolated
          python - <<'PY'
          import os,pathlib,psycopg
          assert os.environ['PGDATABASE']=='photo_r56_disposable'
          assert os.environ['PGHOST']=='127.0.0.1'
          sql=pathlib.Path('R56_DISPOSABLE_SCHEMA.sql').read_text()
          with psycopg.connect(host='127.0.0.1',port=5432,dbname='photo_r56_disposable',user='postgres',password='postgres',autocommit=True) as c:
              c.execute(sql)
              assert c.execute('SELECT current_database()').fetchone()[0]=='photo_r56_disposable'
          print('PASS R56 loaded disposable schema (NO production connection)')
          PY
      - name: R56 PG17 source-ID / rollback / idempotency / concurrency QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r56-isolated
          python -u R56_PG17_REHEARSAL_QA.py

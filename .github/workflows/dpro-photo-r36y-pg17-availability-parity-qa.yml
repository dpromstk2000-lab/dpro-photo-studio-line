      - name: Run inherited atomic reservation SQL on EPHEMERAL PG17 ONLY
        env:
          R36V_DISPOSABLE_PG17: "TRUE"
          PGHOST: "127.0.0.1"
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/r36y-disposable-only/R36W_PG17_DISPOSABLE_QA.py
      - name: Verify exact production-derived plan-start FUNCTION against disposable PG17
        env:
          R36V_DISPOSABLE_PG17: "TRUE"
          PGHOST: "127.0.0.1"
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/r36y-disposable-only/R36Y_PG17_REAL_PLAN_PARITY_QA.py

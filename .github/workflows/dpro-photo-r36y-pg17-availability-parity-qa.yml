name: DPRO PHOTO R36Y Disposable PG17 Booking Availability Parity QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-qa:
    name: R36Y disposable PG17 and Worker availability parity (NO production)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: R36V_ONLY_DISPOSABLE_PORT_5432
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Set up disposable PG17 test dependencies (no repository checkout)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install sealed runner dependency
        run: python3 -m pip install 'psycopg[binary]==3.2.10'

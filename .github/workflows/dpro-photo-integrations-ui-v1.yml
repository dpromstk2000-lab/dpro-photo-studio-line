name: DPRO Photo Integrations UI V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply integrations UI
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_photo_integrations_ui.py
          python /tmp/dpro_photo_integrations_ui.py

      - name: Validate
        shell: bash
        run: |
          node --check config.js
          node --check photo-feature-switch-ui-v2.js
          node --check photo-integrations-ui.js
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path("config.js").read_text(encoding="utf-8")
          owner = Path("owner.html").read_text(encoding="utf-8")
          feature = Path("photo-feature-switch-ui-v2.js").read_text(encoding="utf-8")
          ui = Path("photo-integrations-ui.js").read_text(encoding="utf-8")

          checks = {
              "integration_base": "dpro-photo-integrations-v1" in config and "INTEGRATIONS_API_BASE_URL" in config,
              "payment_switch": 'id="featureReservationOnlinePayment"' in owner,
              "google_switch": 'id="featureReservationGoogleCalendar"' in owner,
              "render_flags": '$("featureReservationOnlinePayment").checked' in owner and '$("featureReservationGoogleCalendar").checked' in owner,
              "save_flags": 'reservation_online_payment: $("featureReservationOnlinePayment").checked' in owner and 'reservation_google_calendar: $("featureReservationGoogleCalendar").checked' in owner,
              "reservation_event": "dpro:photo-reservation-opened" in owner,
              "ui_script": "photo-integrations-ui.js?v=DPRO-PHOTO-INTEGRATIONS-UI-V1-20261007" in owner,
              "feature_cards": "featureReservationOnlinePayment" in feature and "featureReservationGoogleCalendar" in feature,
              "status_api": "/api/admin/status" in ui,
              "square_oauth": "/api/admin/square/start" in ui,
              "google_oauth": "/api/admin/google/start" in ui,
              "payment_link": "/api/admin/payment-links/create" in ui,
              "calendar_sync": "/api/admin/google/sync-now" in ui,
          }
          print(checks)
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("ERROR: validation failed: " + ", ".join(failed))

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', owner, flags=re.S|re.I)
          for i, script in enumerate(scripts):
              Path(f"/tmp/owner-inline-{i}.js").write_text(script, encoding="utf-8")
          print("inline_scripts", len(scripts))
          PY

          for f in /tmp/owner-inline-*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js owner.html photo-feature-switch-ui-v2.js photo-integrations-ui.js
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Add DPRO Photo Square and Google integrations UI"
          git push

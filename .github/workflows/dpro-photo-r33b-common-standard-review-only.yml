name: DPRO PHOTO R33B Common Standard Synthetic QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore immutable embedded REVIEW_ONLY source and tests
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,base64,gzip,hashlib
          items = [
              ('R33B_PHOTO_COMMON_REVIEW_ONLY.mjs','bde740a76dc44ca9d708f22c920e3b5150b136774da26744d542285a3e0c09ef',''),
              ('R33B_PHOTO_COMMON_REVIEW_ONLY.test.mjs','8b9bf21b32a5ecfc09dfa320929063cf906d6dd3d36a799115a2d2bf6d7faf9b',''),
          ]
          for filename, expected, payload in items:
              data=gzip.decompress(base64.b64decode(payload))
              assert hashlib.sha256(data).hexdigest() == expected, "file sha256 mismatch"
              pathlib.Path(filename).write_bytes(data)
              print("R33B restored sha256 OK:",filename,len(data))
          PY
      - name: Node standalone 40 synthetic tests no external dispatch
        shell: bash
        run: |
          node --test R33B_PHOTO_COMMON_REVIEW_ONLY.test.mjs

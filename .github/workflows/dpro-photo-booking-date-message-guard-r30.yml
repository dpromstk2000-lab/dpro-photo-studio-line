      - name: Refuse unrelated source modifications
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_R30_SCOPE'
          import subprocess
          expected={'owner-ipad.html','staff.html'}
          paths={l[3:] for l in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines() if l[3:] not in ['DPRO_PHOTO_R29_STATIC_GATE.json','DPRO_PHOTO_R30_STATIC_GATE.json']}
          assert paths in (set(),expected),f'R30 FAIL unexpected changed files: {paths}'
          print('R30 changed page scope',sorted(paths),'production approval remains OFF')
          PY_R30_SCOPE
      - name: Commit validated screens only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'R30 requires main' >&2; exit 1; }
          git add -- staff.html owner-ipad.html
          if git diff --cached --quiet; then
            echo 'R30 already applied; no duplicate commit.'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'DPRO PHOTO R30 make booking notices date-aware and guard future-day copy'
            git push
          fi
      - name: Archive R30 source and R29 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_PHOTO_MESSAGE_SAFETY_R30
          path: |
            DPRO_PHOTO_R29_STATIC_GATE.json
            DPRO_PHOTO_R30_STATIC_GATE.json
          if-no-files-found: warn

name: DPRO Photo Booking Date UX Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply booking date UX polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_photo_booking_date_ux.py
          python /tmp/dpro_photo_booking_date_ux.py

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          owner = Path("owner.html").read_text(encoding="utf-8")
          checks = {
              "date_guide": 'id="manualDateGuide"' in owner,
              "date_guide_function": "function renderManualDateGuide()" in owner,
              "date_guide_initial": 'renderManualDateGuide();' in owner,
              "friendly_same_day_notice": "本日は受付対象外です。別の日を選択してください。" in owner,
              "availability_toast_suppressed": '{ suppressErrorToast: true }' in owner,
              "real_errors_still_toast": 'toast(message, "error", 5200);' in owner,
              "date_change_refresh": 'renderManualDateGuide(); loadManualSlots()' in owner,
          }
          print(checks)
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("ERROR: validation failed: " + ", ".join(failed))

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', owner, flags=re.S|re.I)
          for i, script in enumerate(scripts):
              Path(f"/tmp/owner-inline-{i}.js").write_text(script, encoding="utf-8")
          print("inline_scripts", len(scripts))
          PY

          for f in /tmp/owner-inline-*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Polish DPRO Photo booking date UX"
          git push

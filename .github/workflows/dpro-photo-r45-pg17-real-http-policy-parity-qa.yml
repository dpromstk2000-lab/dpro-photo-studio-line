              contents=z.read(n)
              assert hashlib.sha256(contents).hexdigest()==expected[n], n
              p=target/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(contents)
          print('R45.1 sealed artifacts',len(expected),'SHA256 PASS; runner tmp only')
          PY_R451_SEALED
      - name: Verify no-customer inspect regression (no database access)
        env:
          R45_DISPOSABLE_PG17: "TRUE"
          PGHOST: "127.0.0.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r45_1_pg17_disposable_only"
          python3 -m py_compile R45_PG17_LOOPBACK_ADAPTER.py R45_1_INSPECT_EMPTY_CUSTOMER_QA.py
          python3 R45_1_INSPECT_EMPTY_CUSTOMER_QA.py
      - name: Real TCP HTTP reservation policy with isolated PG17
        env:
          R45_ALLOWED_LOOPBACK: "YES"
          R45_PG17_ADAPTER: "TRUE"
          R45_DISPOSABLE_PG17: "TRUE"
          PGHOST: "127.0.0.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r45_1_pg17_disposable_only"
          node --check R45_REAL_HTTP_GATEWAY_WORKER_QA.cjs
          node --check R44_WORKER_BOOKING_REPLAY_REVIEW_ONLY_DO_NOT_DEPLOY.mjs
          python3 -u R45_PG17_LOOPBACK_ADAPTER.py > "$RUNNER_TEMP/r45_1_pg_adapter.log" 2>&1 &
          pgpid=$!
          trap 'kill "$pgpid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:18778/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pgpid" 2>/dev/null; then cat "$RUNNER_TEMP/r45_1_pg_adapter.log"; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/r45_1_pg_adapter.log"; exit 1; fi
          node R45_REAL_HTTP_GATEWAY_WORKER_QA.cjs || { cat "$RUNNER_TEMP/r45_1_pg_adapter.log"; exit 1; }
          echo 'R45.1 PG17 policy and HTTP validated (NO PROD, NO SEND)'

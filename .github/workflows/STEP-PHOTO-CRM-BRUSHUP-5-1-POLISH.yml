name: DPRO PHOTO CRM BRUSHUP-5.1 Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photo-crm-brushup-5-1-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f photo-crm-segment.js
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-5-UI-20260918' photo-crm-segment.js
          grep -F '<h3 style="margin:0;">LINEセグメント配信</h3>' photo-crm-segment.js
          grep -F '$("segmentRecentRefreshBtn")?.addEventListener("click", loadRecent);' photo-crm-segment.js

      - name: Decode polish patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo_crm_polish.py
          python -m py_compile /tmp/photo_crm_polish.py

      - name: Apply polish patch
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/photo_crm_polish.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-5-UI-POLISH1-20260918' photo-crm-segment.js
          grep -F '$("refreshAllBtn")?.addEventListener("click", refreshSegmentSoon);' photo-crm-segment.js
          grep -F '$("followupRefreshBtn")?.addEventListener("click", refreshSegmentSoon);' photo-crm-segment.js
          if grep -F '<h3 style="margin:0;">LINEセグメント配信</h3>' photo-crm-segment.js; then
            echo "Duplicate LINE segment heading still exists"
            exit 1
          fi
          node --check photo-crm-segment.js

      - name: Commit polish and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add photo-crm-segment.js
          git rm -f --ignore-unmatch .github/workflows/STEP-PHOTO-CRM-BRUSHUP-5-1-POLISH.yml
          git commit -m "Polish PHOTO CRM LINE segment UI"
          git push origin HEAD:main

      - name: Final
        shell: bash
        run: |
          echo "DPRO PHOTO CRM BRUSHUP-5.1 POLISH: PASS"

name: DPRO PHOTO R33D Keyset Tenant Safety Synthetic QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Restore SHA256-verified offline test code
        shell: bash
        run: |
          python3 - <<'PYRESTORE'
          import pathlib,base64,gzip,hashlib
          content = [
            ('R33B_PHOTO_COMMON_REVIEW_ONLY.mjs', 'bde740a76dc44ca9d708f22c920e3b5150b136774da26744d542285a3e0c09ef', ''),
            ('R33B_PHOTO_COMMON_REVIEW_ONLY.test.mjs', '8b9bf21b32a5ecfc09dfa320929063cf906d6dd3d36a799115a2d2bf6d7faf9b', ''),
            ('R33C_CUSTOMER_REGION_ADMIN_STAGING_ONLY.mjs', 'd4b03c3ab397b7f604b3df7610d4f46944feafd46a9ef5ad2ea5549b29a0252d', ''),
            ('R33C_CUSTOMER_REGION_ADMIN_STAGING_ONLY.test.mjs', '41078e73f481b3dc4805be538da36c6ad6eac897f6f3613ffa2262c18a2695bf', ''),
            ('R33C_LINE_EMAIL_PREFLIGHT_STAGING_ONLY.mjs', '7bc59faefc24f9290d32b61f6e0d6b758b8abd2dce033d3741dc6a2ccd12c00e', ''),
            ('R33C_LINE_EMAIL_PREFLIGHT_STAGING_ONLY.test.mjs', 'ed8dc223b9147450d6ded65679f38ac1cbaf8caf1b1242777091771201ebd706', ''),
            ('R33D_REGION_KEYSET_GATEWAY_STAGING_ONLY.mjs', '53b98c90339cbfd7e7f685601b32bfbd7f06e1b850491ac2e0c318855bb71d15', ''),
            ('R33D_REGION_KEYSET_GATEWAY_STAGING_ONLY.test.mjs', '6696bdbb8cef8c8fa98ef6272b7acd43a852ca8287dab5ccc290543a46ae3520', ''),
          ]
          for name,expected,payload in content:
            raw=gzip.decompress(base64.b64decode(payload))
            assert hashlib.sha256(raw).hexdigest()==expected, "SOURCE_HASH_MISMATCH:"+name
            pathlib.Path(name).write_bytes(raw)
            print("VERIFIED",name)
          PYRESTORE
      - name: Run inherited R33B and R33C and new R33D 138 offline tests
        shell: bash
        run: |
          node --test R33B_PHOTO_COMMON_REVIEW_ONLY.test.mjs R33C_CUSTOMER_REGION_ADMIN_STAGING_ONLY.test.mjs R33C_LINE_EMAIL_PREFLIGHT_STAGING_ONLY.test.mjs R33D_REGION_KEYSET_GATEWAY_STAGING_ONLY.test.mjs | tee qa.log
          grep -Eq "^# tests 138$" qa.log
          grep -Eq "^# pass 138$" qa.log
          grep -Eq "^# fail 0$" qa.log
          grep -Eq "^# skipped 0$" qa.log

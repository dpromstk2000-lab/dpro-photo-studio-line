name: DPRO PHOTO BRUSHUP-8-4 Existing Site White-label HOTFIX1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  existing-site-whitelabel-hotfix1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="e8d33e92888d2438da6dcd24d98115baf1ad52b3"
          HOTFIX=".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-4-WHITELABEL-HOTFIX1.yml"
          ORIGINAL=".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-4-WHITELABEL.yml"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$HOTFIX"
          fi

          test -f "$ORIGINAL"
          test -f index.html
          test -f owner.html
          test -f config.js
          grep -F '.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }' index.html
          grep -F '<header class="hero">' index.html
          grep -F 'function applyStudioConfig()' index.html
          grep -F 'DPRO-PHOTO-RESERVATION-START-RULES-BRUSHUP-8-3-2-UI-20260919' index.html
          grep -F 'photo-crm-line-link.js?v=DPRO-PHOTO-CRM-BRUSHUP-7-20260918' owner.html

      - name: Write booking presentation module
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > photo-booking-presentation.js
          node --check photo-booking-presentation.js

      - name: Patch public and owner pages
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_index.py
          echo '' | base64 -d > /tmp/patch_owner.py
          python -m py_compile /tmp/patch_index.py /tmp/patch_owner.py
          python /tmp/patch_index.py
          python /tmp/patch_owner.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-booking-presentation.js
          grep -F 'api/public/booking-presentation' index.html
          grep -F 'publicBrandLogo' index.html
          grep -F 'publicHomeLink' index.html
          grep -F 'DPRO-PHOTO-EXISTING-SITE-WHITELABEL-BRUSHUP-8-4-UI-20260919' index.html
          grep -F 'photo-booking-presentation.js?v=DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-UI-20260919' owner.html
          grep -F '/api/admin/booking-presentation' photo-booking-presentation.js
          grep -F '予約画面・既存ホームページ連携' photo-booking-presentation.js
          git diff --check

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {"index.html", "owner.html", "photo-booking-presentation.js"}
          tracked = set(subprocess.check_output(["git","diff","--name-only"], text=True).split())
          untracked = set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"], text=True).split())
          changed = tracked | untracked
          extra = changed - allowed
          missing = allowed - changed
          if extra or missing:
              raise SystemExit(f"scope gate failed extra={sorted(extra)} missing={sorted(missing)}")
          PY

          grep -F 'dpro-photo-product-ready-gateway-v3' config.js
          grep -F 'dpro-photo-product-ready-gateway-v8' config.js
          grep -F 'PUBLIC_AVAILABILITY: "/api/public/availability"' config.js
          grep -F 'async function ensurePlanStartRule()' index.html
          grep -F 'rawSlots.filter(slotAllowedByPlanStartRule)' index.html
          grep -F 'photo-crm-line-link.js?v=DPRO-PHOTO-CRM-BRUSHUP-7-20260918' owner.html

      - name: Self-delete failed workflows and final validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-4-WHITELABEL.yml"
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-4-WHITELABEL-HOTFIX1.yml"
          git diff --check

      - name: Commit BRUSHUP-8-4 HOTFIX1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html owner.html photo-booking-presentation.js .github/workflows
          git diff --cached --check
          git commit -m "Add PHOTO existing site white-label BRUSHUP-8-4 HOTFIX1"
          git push origin HEAD:main

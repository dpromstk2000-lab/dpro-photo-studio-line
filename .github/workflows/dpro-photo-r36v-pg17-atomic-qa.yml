            db.execute((root/'R36V_PG17_FIXTURE_DISPOSABLE_ONLY.sql').read_text())
            db.execute((root/'R36V_ATOMIC_BOOKING_REVIEW_ONLY_DO_NOT_RUN.sql').read_text())
          STUDIO=uuid.uuid4();STUDIO_OTHER=uuid.uuid4(); PLAN=uuid.uuid4();PLAN_OTHER=uuid.uuid4(); STAFF=uuid.uuid4();ROOM=uuid.uuid4()
          with connect(DSN,autocommit=True) as db:
           for studio,plan in [(STUDIO,PLAN),(STUDIO_OTHER,PLAN_OTHER)]:
            db.execute('INSERT INTO public.photo_studios(id,studio_code) VALUES(%s,%s)',(studio,'SYNTHETIC-'+str(studio)[:8]))
            db.execute('INSERT INTO public.photo_studio_settings(studio_id) VALUES(%s)',(studio,))
            db.execute('INSERT INTO public.photo_plans(id,studio_id,plan_code,plan_name,default_resource_id) VALUES(%s,%s,%s,%s,NULL)',(plan,studio,'TEST','完全架空テストプラン'))
           db.execute('INSERT INTO public.photo_staff(id,studio_id,staff_name) VALUES(%s,%s,%s)',(STAFF,STUDIO,'架空スタッフ'))
           db.execute('INSERT INTO public.photo_resources(id,studio_id,resource_name) VALUES(%s,%s,%s)',(ROOM,STUDIO,'架空撮影室'))
          nextday=datetime.now(ZoneInfo('Asia/Tokyo')).date()+timedelta(days=10)
          START=datetime.combine(nextday,time(10,0),ZoneInfo('Asia/Tokyo'))
          COUNT=0
          
          def good(ok,why):
           global COUNT
           assert ok,why
           COUNT+=1
           print(f'PASS {COUNT:03d} {why}',flush=True)
          
          def sample(**kwargs):
           b={'plan_id':str(PLAN),'start_at':START.isoformat(),'assigned_staff_id':str(STAFF),'resource_id':str(ROOM),
           'customer_name':'架空保護者','phone':'09011112222','subjects':[{'subject_name':'架空の子','subject_type':'child'}],
           'options':[{'option_code':'PHOTO','option_name':'架空写真オプション','quantity':1}],
           'intake':{'common_answers':{'synthetic':True},'plan_answers':{},'summary':'合成入力','confirmed':True}}
           b.update(kwargs);return b
          
          def synthetic_subject_fingerprints(body,studio):
           """Disposable-only HMAC; UUIDs must be serialized as text (R36V.1 CI fix).
          
           Use each booking's actual Asia/Tokyo date, rather than the global initial
           test date, so date-dependent duplicate checks remain meaningful.
           """
           local_day=datetime.fromisoformat(body['start_at']).astimezone(ZoneInfo('Asia/Tokyo')).date().isoformat()
           return [hmac.new(b'R36V DISPOSABLE ONLY',
             json.dumps([str(studio),local_day,body['phone'],s['subject_name']],ensure_ascii=False).encode(),
             hashlib.sha256).hexdigest() for s in body.get('subjects',[])]
          
          def call(body,idem=None,fp=None,subject_fps=None,studio=STUDIO,verified=None,source='line'):
           idem=idem or uuid.uuid4();fp=fp or hashlib.sha256(json.dumps(body,sort_keys=True).encode()).hexdigest()
           if subject_fps is None:

             VALUES(p_studio_id,v_reservation.id,v_subject.id,v_subject.subject_name,v_subject.subject_type,
                v_subject.relationship_to_customer,coalesce((v_subject_item->>'is_main_subject')::boolean,v_idx=1),v_idx*10);
             INSERT INTO public.photo_booking_subject_claims_r36v(studio_id,reservation_id,local_day,subject_fingerprint)
             VALUES(p_studio_id,v_reservation.id,v_date,v_fp);
           END LOOP;
          
           FOR v_opt IN SELECT value FROM jsonb_array_elements(v_opts) LOOP
             INSERT INTO public.photo_reservation_options(studio_id,reservation_id,option_code,option_name_snapshot,
                quantity,price_display,customer_note,display_order)
             VALUES(p_studio_id,v_reservation.id,left(coalesce(v_opt->>'option_code',v_opt->>'code'),100),
                left(coalesce(v_opt->>'option_name',v_opt->>'name'),200),

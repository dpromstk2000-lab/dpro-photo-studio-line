name: DPRO PHOTO CRM BRUSHUP-6.2 Settings Event Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photo-crm-brushup-6-2-settings-event-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f owner.html
          test -f photo-crm-import.js
          grep -F '$("featureCsvMigration").checked = flags.csv_migration === true;' owner.html
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-6-UI-HOTFIX1-20260918' photo-crm-import.js
          grep -F './photo-crm-import.js?v=DPRO-PHOTO-CRM-BRUSHUP-6-HOTFIX1-20260918' owner.html

      - name: Apply event-driven settings fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo_crm_b6_event_fix.py
          python -m py_compile /tmp/photo_crm_b6_event_fix.py
          python /tmp/photo_crm_b6_event_fix.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check photo-crm-import.js
          grep -F 'dpro:photo-settings-rendered' owner.html
          grep -F 'dpro:photo-settings-rendered' photo-crm-import.js
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-6-UI-HOTFIX2-20260918' photo-crm-import.js
          grep -F './photo-crm-import.js?v=DPRO-PHOTO-CRM-BRUSHUP-6-HOTFIX2-20260918' owner.html
          grep -F 'flag.disabled = false;' photo-crm-import.js

      - name: Commit fix and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-crm-import.js
          git rm -f --ignore-unmatch .github/workflows/STEP-PHOTO-CRM-BRUSHUP-6-2-SETTINGS-EVENT-FIX.yml
          git commit -m "Fix PHOTO CRM CSV settings event sync"
          git push origin HEAD:main

      - name: Final
        shell: bash
        run: |
          echo "DPRO PHOTO CRM BRUSHUP-6.2 SETTINGS EVENT FIX: PASS"

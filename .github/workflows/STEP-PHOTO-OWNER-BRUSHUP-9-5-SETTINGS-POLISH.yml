name: DPRO PHOTO BRUSHUP-9-5 Owner Settings Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  owner-settings-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="2b51680f4d7e5cd6d569c008680cc01689231ef3"
          WORKFLOW=".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-5-SETTINGS-POLISH.yml"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi

          test -f owner.html
          test -f photo-owner-settings-v2.js
          test -f photo-owner-plan-resource.js
          test -f photo-owner-setup-checklist.js

          grep -F 'DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-1-2-UI-20260919' photo-owner-settings-v2.js
          grep -F 'id="featureCsvMigration" type="checkbox" disabled' owner.html
          grep -F '次工程のためOFF固定' owner.html
          grep -F 'photo-owner-setup-checklist.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-4-SETUP-CHECKLIST-UI-20260919' owner.html

      - name: Patch Owner settings polish
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_owner_95.py
          echo '' | base64 -d > /tmp/patch_settings_95.py
          python -m py_compile /tmp/patch_owner_95.py /tmp/patch_settings_95.py
          python /tmp/patch_owner_95.py
          python /tmp/patch_settings_95.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail

          node --check photo-owner-settings-v2.js

          grep -F 'DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-5-SETTINGS-POLISH-UI-20260919' photo-owner-settings-v2.js
          grep -F 'photo-owner-settings-v2.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-5-SETTINGS-POLISH-UI-20260919' owner.html

          grep -F '<h3>顧客・CRM機能</h3>' owner.html
          grep -F 'id="featureCsvMigration" type="checkbox"' owner.html
          ! grep -F 'id="featureCsvMigration" type="checkbox" disabled' owner.html
          ! grep -F '次工程のためOFF固定' owner.html

          grep -F 'label: "予約設定", note: "日常"' photo-owner-settings-v2.js
          grep -F 'label: "スタッフ管理", note: "日常"' photo-owner-settings-v2.js
          grep -F 'label: "撮影プラン管理", note: "日常"' photo-owner-settings-v2.js
          grep -F 'label: "公開・連携設定", note: "必要時"' photo-owner-settings-v2.js
          grep -F 'label: "顧客・CRM設定", note: "必要時"' photo-owner-settings-v2.js
          grep -F 'label: "詳細設定", note: "詳細"' photo-owner-settings-v2.js
          grep -F '顧客・CRM機能' photo-owner-settings-v2.js

          grep -F 'csv_migration: $("featureCsvMigration").checked' owner.html
          grep -F 'line_customer_link: $("featureLineCustomerLink").checked' owner.html
          grep -F 'dpro:photo-settings-rendered' owner.html

          git diff --check

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).split())
          allowed={"owner.html","photo-owner-settings-v2.js"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY

          grep -F 'photo-owner-plan-resource.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-3-1-PRICE-LABEL-20260919' owner.html
          grep -F 'photo-owner-setup-checklist.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-4-SETUP-CHECKLIST-UI-20260919' owner.html
          grep -F 'photo-booking-presentation.js?v=DPRO-PHOTO-PRODUCTION-READINESS-BRUSHUP-8-5-LINE-ENTRY-20260919' owner.html
          grep -F '/api/admin/staff-management' photo-owner-settings-v2.js
          grep -F 'ownerStaffManagementPanel' photo-owner-settings-v2.js

      - name: Self-delete workflow and final validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-5-SETTINGS-POLISH.yml"
          git diff --check

      - name: Commit BRUSHUP-9-5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-owner-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-owner-settings-v2.js .github/workflows
          git diff --cached --check
          git commit -m "Polish PHOTO Owner settings BRUSHUP-9-5"
          git push origin HEAD:main

      - name: Real Gateway-Worker HTTP to disposable PG17 and staff regression
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r60-disposable
          cleanup() {
            kill -INT "${GATE_PID:-}" 2>/dev/null || true
            kill "${DB_PID:-}" 2>/dev/null || true
            echo '--- PG17 adapter diagnostic tail ---'
            tail -35 /tmp/r60-pg17-bridge.log 2>/dev/null || true
            echo '--- Gateway Worker diagnostic tail ---'
            tail -35 /tmp/r60-gateway-worker.log 2>/dev/null || true
          }
          trap cleanup EXIT
          python -u R60_PG17_OWNER_BINDING_BRIDGE.py > /tmp/r60-pg17-bridge.log 2>&1 & DB_PID=$!
          for i in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:18779/r60/inspect >/dev/null; then break; fi
            if ! kill -0 "$DB_PID" 2>/dev/null; then echo 'R60 PG17 bridge died'; cat /tmp/r60-pg17-bridge.log; exit 1; fi
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:18779/r60/inspect > /dev/null
          R54_LOCAL_ISOLATED=YES R60_PG17_BRIDGE=YES node R60_GATEWAY_WORKER_PG17_FIXTURE.cjs > /tmp/r60-gateway-worker.log 2>&1 & GATE_PID=$!
          for i in $(seq 1 25); do
            if curl -s --max-time 2 http://127.0.0.1:18776/dpro-photo-product-ready-gateway/api/admin/customer-detail | grep -q '.'; then break; fi
            if ! kill -0 "$GATE_PID" 2>/dev/null; then echo 'R60 Gateway died'; cat /tmp/r60-gateway-worker.log; exit 1; fi
            sleep 1
          done
          node R60_REAL_OWNER_HTTP_PG17_QA.cjs
          node R58_INHERITED_STAFF_HTTP_QA.cjs
          python - <<'FINAL'
          import psycopg,os
          with psycopg.connect(host='127.0.0.1',port=5432,user=os.environ['PGUSER'],password=os.environ['PGPASSWORD'],dbname=os.environ['PGDATABASE']) as c:
              with c.cursor() as q:
                  for name,expected in [('photo_customers',2),('photo_subjects',3),('photo_import_lineage',5),('photo_import_batches',2)]:
                      q.execute('SELECT count(*) FROM public.'+name)
                      assert q.fetchone()[0]==expected,name
                  q.execute("SELECT count(*) FROM photo_r59_private.csv_previews WHERE state='imported' AND encrypted_payload IS NULL")
                  assert q.fetchone()[0]==2
          print('R60 REAL disposable PostgreSQL 17 FINAL COUNTS PASS')
          FINAL
          echo 'R60.1 integrated isolated PG17 QA SUCCESS. NO PRODUCTION CONNECTION.'

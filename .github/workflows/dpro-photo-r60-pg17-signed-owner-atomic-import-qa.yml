name: DPRO PHOTO R60 PG17 Signed Owner HTTP to Atomic CSV Import (DISPOSABLE ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r60-isolated-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    name: R60 real signed Gateway Worker and disposable PG17 import (NO PRODUCTION)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r60_synthetic_qa_only
          POSTGRES_DB: photo_r56_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photo_r56_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: r60_synthetic_qa_only
      PGDATABASE: photo_r56_disposable
      R56_ISOLATED_ONLY: 'YES'
      R59_DISPOSABLE_ONLY: 'YES'
      R59_FIXTURE_ONLY: 'YES'
      R59_ENABLE_DISPOSABLE_COMMIT: 'YES'
      R60_DISPOSABLE_BRIDGE_ONLY: 'YES'
      R59_STAGING_PASSPHRASE: 'R60_SYNTHETIC_ONLY_ENCRYPTION_KEY_aaaaaaaaaaaaaaaaaaaaaaaaaa'
    steps:

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable pinned PostgreSQL client
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          python - <<'PYCHECK'
          import psycopg
          assert psycopg.__version__ == '3.2.9'
          print('R60 pinned psycopg verified')
          PYCHECK
      - name: Extract sealed synthetic sources, verify hashes, and compile

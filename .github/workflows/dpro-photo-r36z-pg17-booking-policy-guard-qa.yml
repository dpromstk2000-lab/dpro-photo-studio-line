      - name: Re-run R36W previously approved atomic PostgreSQL tests
        env:
          R36V_DISPOSABLE_PG17: "TRUE"
          PGHOST: "127.0.0.1"
        run: python3 /tmp/r36z-disposable-only/R36W_PG17_DISPOSABLE_QA.py
      - name: Re-run exact production-derived plan start PostgreSQL tests
        env:
          R36V_DISPOSABLE_PG17: "TRUE"
          PGHOST: "127.0.0.1"
        run: python3 /tmp/r36z-disposable-only/R36Y_PG17_REAL_PLAN_PARITY_QA.py
      - name: Verify R36Y availability and inherited LINE/studio boundaries
        run: |
          set -euo pipefail
          node --check /tmp/r36z-disposable-only/R36Y_WORKER_AVAILABILITY_REVIEW_ONLY_DO_NOT_DEPLOY.mjs
          node /tmp/r36z-disposable-only/R36Y_AVAILABILITY_SYNTHETIC_QA.cjs
          node /tmp/r36z-disposable-only/R36Y_INHERITED_STUDIO_BOUND_IDENTITY_QA.cjs
      - name: RED then GREEN R36Z authoritative booking policy on isolated PostgreSQL 17

name: DPRO PHOTO R36Z Disposable PG17 Booking Policy Guard QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-booking-policy-only:
    name: Ephemeral PG17 transaction and booking policy tests (NO production)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: R36V_ONLY_DISPOSABLE_PORT_5432
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Provision Python on disposable GitHub runner (no checkout, no secrets)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install sealed PostgreSQL test adapter
        run: python3 -m pip install 'psycopg[binary]==3.2.10'

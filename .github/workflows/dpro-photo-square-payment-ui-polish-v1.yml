name: DPRO Photo Square Payment UI Polish V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply payment UI polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_photo_square_ui_patch.py
          python /tmp/dpro_photo_square_ui_patch.py

      - name: Validate
        shell: bash
        run: |
          node --check photo-integrations-ui.js
          grep -q 'DPRO-PHOTO-INTEGRATIONS-UI-V1.1-PAYMENT-CANCEL-20261007' photo-integrations-ui.js
          grep -q '/api/admin/payment-links/cancel' photo-integrations-ui.js
          grep -q 'data-pi-action="payment-cancel"' photo-integrations-ui.js
          grep -q 'photo-integrations-ui.js?v=DPRO-PHOTO-INTEGRATIONS-UI-V1.1-PAYMENT-CANCEL-20261007' owner.html
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-integrations-ui.js owner.html
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Polish Square payment cancellation UI"
          git push

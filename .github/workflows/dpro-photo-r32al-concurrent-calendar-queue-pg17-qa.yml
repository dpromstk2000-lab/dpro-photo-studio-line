# Never run on production: disposable Postgres:17 in isolated GitHub Actions only. No Supabase URL or service keys.
name: DPRO PHOTO R32AL Concurrent Calendar Queue PG17 QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-queue-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa_disposable_only
          POSTGRES_DB: dpro_photo_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d dpro_photo_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Generate disposable schema and functional assertions
        shell: bash
        run: |
          cat > /tmp/qa_schema.sql <<'R32AL_SQL_SCHEMA'
          -- REVIEW ONLY. ONLY FOR EMPTY THROWAWAY GITHUB ACTIONS POSTGRES:17 SERVICE. NEVER PRODUCTION.
          \set ON_ERROR_STOP on
          CREATE TABLE qa_links (
           id uuid PRIMARY KEY,studio_id uuid NOT NULL,reservation_id uuid NOT NULL,
           sync_status text NOT NULL DEFAULT 'pending',revision integer NOT NULL DEFAULT 1,
           leased_by text NULL,lease_until timestamptz NULL,next_retry_at timestamptz NULL,
           attempts integer NOT NULL DEFAULT 0,external_event_id text NULL
          );
          CREATE INDEX qa_links_pending_idx ON qa_links(sync_status,lease_until,next_retry_at);
          CREATE TABLE qa_remote_events(id text PRIMARY KEY,studio_id uuid NOT NULL,reservation_id uuid NOT NULL);
          CREATE FUNCTION qa_claim(p_worker text,p_id uuid)
           RETURNS TABLE(id uuid,revision integer) LANGUAGE plpgsql AS $$
          BEGIN
           IF p_worker IS NULL OR btrim(p_worker)='' THEN RAISE EXCEPTION 'worker identity required'; END IF;
           RETURN QUERY
           WITH c AS (
             SELECT q.id FROM qa_links q
             WHERE q.id=p_id
               AND (q.sync_status='pending' OR (q.sync_status='failed' AND q.attempts<5 AND coalesce(q.next_retry_at,'-infinity'::timestamptz)<=clock_timestamp()))
               AND (q.lease_until IS NULL OR q.lease_until<=clock_timestamp())
             FOR UPDATE SKIP LOCKED
           )
           UPDATE qa_links q SET leased_by=p_worker,lease_until=clock_timestamp()+interval '10 minutes'
           FROM c WHERE q.id=c.id RETURNING q.id,q.revision;
          END $$;
          CREATE FUNCTION qa_ack(p_id uuid,p_worker text,p_revision integer,p_event_id text)
           RETURNS boolean LANGUAGE plpgsql AS $$
          DECLARE affected integer;
          BEGIN
           UPDATE qa_links SET sync_status='synced', leased_by=NULL,lease_until=NULL,external_event_id=p_event_id
           WHERE id=p_id AND leased_by=p_worker AND revision=p_revision AND lease_until>clock_timestamp();
           GET DIAGNOSTICS affected=ROW_COUNT;
           RETURN affected=1;
          END $$;
          CREATE FUNCTION qa_fail(p_id uuid,p_worker text,p_revision integer)
           RETURNS boolean LANGUAGE plpgsql AS $$
          DECLARE affected integer;
          BEGIN
           UPDATE qa_links SET sync_status='failed',attempts=attempts+1,
             next_retry_at=clock_timestamp()+interval '2 seconds',leased_by=NULL,lease_until=NULL
           WHERE id=p_id AND leased_by=p_worker AND revision=p_revision AND lease_until>clock_timestamp();
           GET DIAGNOSTICS affected=ROW_COUNT;
           RETURN affected=1;
          END $$;
          CREATE FUNCTION qa_safe_remote_event(p_id text,p_studio uuid,p_reservation uuid)
           RETURNS text LANGUAGE plpgsql AS $$
          DECLARE owner qa_remote_events%rowtype;
          BEGIN
           INSERT INTO qa_remote_events(id,studio_id,reservation_id)
           VALUES (p_id,p_studio,p_reservation) ON CONFLICT(id) DO NOTHING;
           SELECT * INTO owner FROM qa_remote_events WHERE id=p_id;
           IF owner.studio_id IS DISTINCT FROM p_studio OR owner.reservation_id IS DISTINCT FROM p_reservation THEN
             RAISE EXCEPTION USING ERRCODE='P0002', MESSAGE='REMOTE_OWNER_MISMATCH';
           END IF;
           RETURN p_id;
          END $$;
          INSERT INTO qa_links (id,studio_id,reservation_id) VALUES
           ('11111111-1111-4111-8111-111111111111','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','22222222-2222-4222-8222-222222222222');
          SELECT 'DISPOSABLE PG17 SCHEMA READY' as outcome;
          R32AL_SQL_SCHEMA
          cat > /tmp/qa_assert.sql <<'R32AL_SQL_ASSERT'
          -- REVIEW ONLY. RUN AFTER 2 concurrent disposable worker sessions in GitHub Actions.
          \set ON_ERROR_STOP on
          DO $$
          DECLARE n integer;claimed integer;ok boolean;event_id text;
          BEGIN
            -- workerA claimed revision1 during the prior parallel test.
            SELECT revision INTO n FROM qa_links WHERE id='11111111-1111-4111-8111-111111111111';
            IF n<>1 THEN RAISE EXCEPTION 'FAIL unexpected initial revision';END IF;
            UPDATE qa_links SET revision=revision+1,sync_status='pending' WHERE id='11111111-1111-4111-8111-111111111111';
            SELECT qa_ack('11111111-1111-4111-8111-111111111111','workerA',1,'dpro-stale') INTO ok;
            IF ok THEN RAISE EXCEPTION 'FAIL stale ACK accepted'; END IF;
            RAISE NOTICE 'PASS: stale revision ACK denied';
            -- In real system wait for lease expiry; here accelerate with synthetic clock row edit inside disposable DB.
            UPDATE qa_links SET lease_until=clock_timestamp()-interval '1 second' WHERE id='11111111-1111-4111-8111-111111111111';
            SELECT count(*) INTO claimed FROM qa_claim('workerC','11111111-1111-4111-8111-111111111111');
            IF claimed<>1 THEN RAISE EXCEPTION 'FAIL new revision not claimable'; END IF;
            SELECT qa_safe_remote_event('dpro33333333333343338333333333333333', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','22222222-2222-4222-8222-222222222222') INTO event_id;
            -- Emulate remote Google success but database ACK failure; do not ACK claim C, expire its lease.
            UPDATE qa_links SET lease_until=clock_timestamp()-interval '1 second' WHERE id='11111111-1111-4111-8111-111111111111';
            SELECT count(*) INTO claimed FROM qa_claim('workerD','11111111-1111-4111-8111-111111111111');
            IF claimed<>1 THEN RAISE EXCEPTION 'FAIL recovery claim after lost ACK'; END IF;
            SELECT qa_safe_remote_event('dpro33333333333343338333333333333333','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','22222222-2222-4222-8222-222222222222') INTO event_id;
            IF (SELECT count(*) FROM qa_remote_events)<>1 THEN RAISE EXCEPTION 'FAIL duplicate remote event'; END IF;
            RAISE NOTICE 'PASS: remote success then lost DB ACK reconciles one owned remote event';
            BEGIN
              PERFORM qa_safe_remote_event('dpro33333333333343338333333333333333', 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','22222222-2222-4222-8222-222222222222');
              RAISE EXCEPTION 'FAIL collision accepted';
            EXCEPTION WHEN SQLSTATE 'P0002' THEN
              RAISE NOTICE 'PASS: external event collision rejects foreign studio';
            END;
            SELECT qa_ack('11111111-1111-4111-8111-111111111111','workerD',2,event_id) INTO ok;
            IF NOT ok THEN RAISE EXCEPTION 'FAIL current revision ACK rejected'; END IF;
            RAISE NOTICE 'PASS: current revision ACK succeeds';
            SELECT count(*) INTO claimed FROM qa_claim('workerE','11111111-1111-4111-8111-111111111111');
            IF claimed<>0 THEN RAISE EXCEPTION 'FAIL already synced row reclaimed'; END IF;
            RAISE NOTICE 'PASS: synced row not reclaimed';
            UPDATE qa_links SET revision=revision+1,sync_status='pending' WHERE id='11111111-1111-4111-8111-111111111111';
            SELECT count(*) INTO claimed FROM qa_claim('workerF','11111111-1111-4111-8111-111111111111');
            IF claimed<>1 THEN RAISE EXCEPTION 'FAIL changed row not requeued'; END IF;
            SELECT qa_fail('11111111-1111-4111-8111-111111111111','workerF',3) INTO ok;
            IF NOT ok THEN RAISE EXCEPTION 'FAIL error could not move row to failed'; END IF;
            SELECT count(*) INTO claimed FROM qa_claim('workerG','11111111-1111-4111-8111-111111111111');
            IF claimed<>0 THEN RAISE EXCEPTION 'FAIL backoff ignored'; END IF;
            RAISE NOTICE 'PASS: failed row respects retry backoff';
            UPDATE qa_links SET next_retry_at=clock_timestamp()-interval '1 second' WHERE id='11111111-1111-4111-8111-111111111111';
            SELECT count(*) INTO claimed FROM qa_claim('workerH','11111111-1111-4111-8111-111111111111');
            IF claimed<>1 THEN RAISE EXCEPTION 'FAIL eligible failed row not reclaimed'; END IF;
            RAISE NOTICE 'PASS: failed row claimed after retry window';
          END $$;
          SELECT 'R32AL DISPOSABLE PG17 CONCURRENT QUEUE CONTRACT PASS (not production)' AS outcome;
          R32AL_SQL_ASSERT
      - name: PostgreSQL 17 disposable queue concurrency and identity QA
        shell: bash
        env:
          PGPASSWORD: qa_disposable_only
        run: |
          set -euo pipefail
          conn="-h 127.0.0.1 -p 5432 -U qa -d dpro_photo_qa -X -v ON_ERROR_STOP=1"
          psql $conn -f /tmp/qa_schema.sql
          psql $conn -At -c "BEGIN; SELECT * FROM qa_claim('workerA','11111111-1111-4111-8111-111111111111'); SELECT pg_sleep(3); COMMIT;" >/tmp/workerA.log 2>&1 &
          first=$!
          sleep 1
          psql $conn -At -c "SELECT count(*) FROM qa_claim('workerB','11111111-1111-4111-8111-111111111111');" >/tmp/workerB.log 2>&1
          wait "$first"
          cat /tmp/workerA.log
          cat /tmp/workerB.log
          grep -q '11111111-1111-4111-8111-111111111111|1' /tmp/workerA.log
          grep -q '^0$' /tmp/workerB.log
          echo 'PASS: competing worker cannot claim locked pending row (real PostgreSQL SKIP LOCKED)'
          psql $conn -f /tmp/qa_assert.sql

name: DPRO PHOTO R32BQ Trusted Guest Atomic Receipt Disposable PG17 QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-local-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: qa-local-only
      PGDATABASE: dpro_photo_r32be_disposable
      R32BE_DISPOSABLE_QA: "YES"
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Create fresh disposable database
        run: |
          psql -d postgres -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE dpro_photo_r32be_disposable"
      - name: Restore version-hashed synthetic files (no repository secrets)
        run: |
          python - <<'PYIN'
          import pathlib, hashlib, base64, gzip, os
          assert os.environ.get('PGDATABASE')=='dpro_photo_r32be_disposable'
          expected = {
            'R32BE_SCHEMA_ALIGNED_DISPOSABLE_PG17_REVIEW_ONLY.sql': ('8525d329c57a5376473fdabab524e2de4278304967666492bb41262d7c909673', ''),
            'R32BE_SCHEMA_ALIGNED_PG17_QA.py': ('bd1e62044f20a4fd4d06edf82e3ec3b4578fcfc1eaed4ac54a705239e0d2a1b9', ''),
            'R32X_VALIDATED_BOOKING_FIXTURE.json': ('1094588506463693b12797081a7505d9de7b6ee93313ad8747504cba78669d0f', ''),
            'R32BH_DISPOSABLE_ATTEMPT_PG17_QA.py': ('0e49c32efbbb7655f3cbcf64cd4700a41d0f92f996775642ff2c02d793ae0eb7', ''),
            'R32BI_DISPOSABLE_ATTEMPT_ISSUER.sql': ('95bfdb09ff7268a2a85669d6d8a845160ffc9be4f5ef89897cf0877ec1333ae5', ''),
            'R32BI_SECURITY_PG17_QA.py': ('49ce3bb45f5bd1e51920f32827e1ebf0a0162fb52c8c2dbdd8269c3b74197582', ''),
            'R32BQ_VERIFIED_GUEST_ATOMIC_RECEIPT_DISPOSABLE_PG17.sql': ('9463d33de0ffb88d7ac520412dc4b5763ff6e99d1a293fc5358379526c4810b1', ''),
            'R32BQ_VERIFIED_GUEST_ATOMIC_RECEIPT_PG17_QA.py': ('23443888d372a2a206fc1b74476a967f590a21d6b8a02a2f7aa5d016394cae85', ''),
          }
          for name, (digest, blob) in expected.items():
              data = gzip.decompress(base64.b64decode(blob))
              assert hashlib.sha256(data).hexdigest()==digest, name
              pathlib.Path(name).write_bytes(data)
              print('PASS SHA256', name)
          PYIN
          python - <<'PYSIG'
          import ast
          tree=ast.parse(open('R32BI_SECURITY_PG17_QA.py',encoding='utf-8').read())
          seen=0
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Name) and node.func.id=='book':
                  assert len(node.args)<=2, f'POS_ARG_MISMATCH at line {node.lineno}'
                  seen+=1
          assert seen>=2
          print('PASS R32BI signature regression',seen)
          PYSIG
      - name: Run R32BE baseline atomic PostgreSQL 17
        run: |
          test "$PGDATABASE" = "dpro_photo_r32be_disposable"
          test "$R32BE_DISPOSABLE_QA" = "YES"
          psql -X -v ON_ERROR_STOP=1 -f R32BE_SCHEMA_ALIGNED_DISPOSABLE_PG17_REVIEW_ONLY.sql
          python R32BE_SCHEMA_ALIGNED_PG17_QA.py
      - name: Run R32BH ticket/resource replay PostgreSQL 17
        run: |
          python R32BH_DISPOSABLE_ATTEMPT_PG17_QA.py
      - name: Run R32BI trusted attempt issuer and DB privileges
        run: |
          psql -X -v ON_ERROR_STOP=1 -f R32BI_DISPOSABLE_ATTEMPT_ISSUER.sql
          python R32BI_SECURITY_PG17_QA.py
      - name: Run R32BQ trusted guest atomic receipt PostgreSQL 17
        run: |
          test "$PGDATABASE" = "dpro_photo_r32be_disposable"
          test "$R32BE_DISPOSABLE_QA" = "YES"
          psql -X -v ON_ERROR_STOP=1 -f R32BQ_VERIFIED_GUEST_ATOMIC_RECEIPT_DISPOSABLE_PG17.sql
          python R32BQ_VERIFIED_GUEST_ATOMIC_RECEIPT_PG17_QA.py
      - name: R32BR verified phone HTTP to atomic receipt bridge (Node 22 isolated QA)
        run: |
          node --version
          python - <<'PYR32BR'
          import gzip,hashlib,base64,pathlib
          expected={
              'R32BP_HTTP_BOOKING_ROUTER_REVIEW_ONLY.mjs':('a15866f377e36d8c29a25afcf811d6938a737158816e3f59fa5fef9e99032751',''),
              'R32BR_GATEWAY_ATOMIC_BOUNDARY_REVIEW_ONLY.mjs':('2b40af555573e1618940c0a830166161cf566c80b76da06ebff5cf2a7325e89f',''),
              'R32BR_PHONE_TRUSTED_RPC_PORT_REVIEW_ONLY.mjs':('a1673073d3f04545274046a3a72cf603801cbe3463cfe22fbaaf43574ecbf08d',''),
              'R32BR_FULL_PHONE_PATH_QA.test.mjs':('51435ec2c93f8e1c812470272a571b78abb959ad72eb7a12db8278a6b3daf9a4',''),
          }
          for name,(digest,blob) in expected.items():
              content=gzip.decompress(base64.b64decode(blob))
              assert hashlib.sha256(content).hexdigest()==digest,name
              pathlib.Path(name).write_bytes(content)
              print("PASS R32BR SHA256",name)
          PYR32BR
          node --test --test-concurrency=1 R32BR_FULL_PHONE_PATH_QA.test.mjs
      - name: R32BS multi actor isolated end-to-end HTTP boundary QA
        run: |
          node --version
          python - <<'PYR32BS'
          import gzip,hashlib,base64,pathlib
          embedded={
              'R32BP_HTTP_BOOKING_ROUTER_REVIEW_ONLY.mjs':('a15866f377e36d8c29a25afcf811d6938a737158816e3f59fa5fef9e99032751',''),
              'R32BR_GATEWAY_ATOMIC_BOUNDARY_REVIEW_ONLY.mjs':('2b40af555573e1618940c0a830166161cf566c80b76da06ebff5cf2a7325e89f',''),
              'R32BS_MULTI_ACTOR_TRUSTED_RPC_PORT_REVIEW_ONLY.mjs':('9e9fdf1f3a727198171071b5d34ee6d08db41dada2e313f01d87e20e8db9dc8a',''),
              'R32BS_MULTI_ACTOR_HTTP_INTEGRATION_QA.test.mjs':('6f33ec0b81d8dfdc819daec3ebd238ab738cdcba0ca71dcfc2ba97cc1a08db00',''),
          }
          for name,(expected,blob) in embedded.items():
              b=gzip.decompress(base64.b64decode(blob))
              assert hashlib.sha256(b).hexdigest()==expected,(name,"SHA256")
              pathlib.Path(name).write_bytes(b)
              print("PASS R32BS SHA256",name)
          PYR32BS
          node --test --test-concurrency=1 R32BS_MULTI_ACTOR_HTTP_INTEGRATION_QA.test.mjs
      - name: R32BT four-actor existing-customer atomic booking on disposable PG17
        run: |
          python - <<'PYR32BT'
          import hashlib,base64,gzip,pathlib
          embedded={
              'R32BT_EXISTING_CUSTOMER_ACTOR_ATOMIC_DISPOSABLE_PG17.sql': ('3439227661dcb93893639fde350b4958b678ee43c5972976e9d98f3b6c1e48b4',''),
              'R32BT_EXISTING_CUSTOMER_ACTOR_ATOMIC_PG17_QA.py': ('1ad47367c4789b2c268506b2f6013196f077a6c5b037fe5e67ea9f5a76617316', ''),
          }
          for name,(digest,blob) in embedded.items():
              raw=gzip.decompress(base64.b64decode(blob))
              assert hashlib.sha256(raw).hexdigest()==digest,(name,'integrity')
              pathlib.Path(name).write_bytes(raw)
              print('PASS R32BT embedded',name,flush=True)
          PYR32BT
          test "$PGDATABASE" = "dpro_photo_r32be_disposable"
          test "$R32BE_DISPOSABLE_QA" = "YES"
          python - <<'PYR32BT1STATIC'
          import ast,pathlib
          source=pathlib.Path('R32BT_EXISTING_CUSTOMER_ACTOR_ATOMIC_PG17_QA.py').read_text(encoding='utf-8')
          ast.parse(source)
          sql=pathlib.Path('R32BT_EXISTING_CUSTOMER_ACTOR_ATOMIC_DISPOSABLE_PG17.sql').read_text(encoding='utf-8')
          assert "IF st.google_enabled THEN INSERT INTO qa_r32be.synthetic_google_outbox" in sql
          markers=[
              "historic_outbox=int(val(",
              "SET google_enabled=false",
              "OFF actor bookings add zero Google outbox rows",
              "OFF actor receipts never linked to Google outbox",
              "SET google_enabled=true",
              "Google ON queues exactly one matching reservation",
              "Google ON replay does not enqueue twice",
              "Google OFF again allows booking without new outbox row",
              "earlier legitimate Google ON queue entries are never deleted",
          ]
          assert all(source.count(x)>=1 for x in markers)
          assert "check('no Google outbox when studio OFF'" not in source
          print('PASS R32BT.1 explicit OFF -> ON -> OFF SQL fixture preflight',flush=True)
          PYR32BT1STATIC
          psql -X -v ON_ERROR_STOP=1 -f R32BT_EXISTING_CUSTOMER_ACTOR_ATOMIC_DISPOSABLE_PG17.sql
          python -u R32BT_EXISTING_CUSTOMER_ACTOR_ATOMIC_PG17_QA.py

      - name: Run R32BU server-verified multi-actor attestation and signed booking QA (review only)
        env:
          R32BU_REVIEW_ONLY: "YES"
        run: |
          test "$R32BE_DISPOSABLE_QA" = "YES"
          test "$R32BU_REVIEW_ONLY" = "YES"
          python3 - <<'PYR32BU'
          import base64,gzip,hashlib,pathlib
          embedded = {
            'R32BS_MULTI_ACTOR_TRUSTED_RPC_PORT_REVIEW_ONLY.mjs': ('9e9fdf1f3a727198171071b5d34ee6d08db41dada2e313f01d87e20e8db9dc8a',''),
            'R32BU_VERIFIED_SESSION_ISSUER_REVIEW_ONLY.mjs': ('dbf1f12c048a523ef28c9c8bde9e9d3d5cd7cf9993e7fbf03dba535f6361671c',''),
            'R32BU_VERIFIED_SESSION_ISSUER_QA.test.mjs': ('85a906d5fd9f8c0b39372887babb36cc2b36409b88e2cf5211a1792f1f809435',''),
            'R32BU_SIGNED_BOOKING_PORT_REVIEW_ONLY.mjs': ('4906e41fafe0aa38811bfc51d36830062627bbe5cfdf2c7757256964b7ce90b7',''),
            'R32BU_SIGNED_BOOKING_PORT_QA.test.mjs': ('d30292e32873fc0dead404431a7f38f74a0db400a44d04fccb0ae628ed77649a',''),
          }
          for name,(digest,blob) in embedded.items():
              data=gzip.decompress(base64.b64decode(blob))
              assert hashlib.sha256(data).hexdigest()==digest, (name,'SHA_MISMATCH')
              pathlib.Path(name).write_bytes(data)
              print('PASS R32BU SHA256',name,flush=True)
          PYR32BU
          node --version
          node --test --test-concurrency=1 R32BU_VERIFIED_SESSION_ISSUER_QA.test.mjs R32BU_SIGNED_BOOKING_PORT_QA.test.mjs

      - name: R32BV current photo catalog read adapter and issuer QA (review only)
        env:

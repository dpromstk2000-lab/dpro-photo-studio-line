          psql -X -v ON_ERROR_STOP=1 -f R32CB_LIVE_COLUMN_ATOMIC_STAGING_DISPOSABLE_PG17.sql
          python3 R32CB_STAGING_DISPOSABLE_PG17_QA.py
      - name: R32CC source-pinned dual Gateway HOLD cutover review (no production calls)
        run: |
          test "$PGDATABASE" = dpro_photo_r32be_disposable
          test "$R32BE_DISPOSABLE_QA" = YES
          test -z "${SUPABASE_URL:-}"

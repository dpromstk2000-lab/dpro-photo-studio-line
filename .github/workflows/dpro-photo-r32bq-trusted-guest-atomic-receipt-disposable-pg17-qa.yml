            'R32BW_REAL_SCHEMA_RECEIPT_PORT_REVIEW_ONLY.mjs':('8c3cd2cd764ab2c68562bb888ad18e2770828fe3b310626e2a43bf8fd8b84b14',''),
            'R32BW_REAL_SCHEMA_RECEIPT_PORT_QA.test.mjs':('09a7e811887fea7227286b59928a7d2c65c165c0f6d45f4f10d5b7aae614fd38',''),
            'R32BW_UI_SHAPE_FROM_DB_REVIEW_ONLY.mjs':('873d5d242715e723b9714aa40c2f30966d31b556388b327608714e36ab3ce8bc',''),
            'R32BW_UI_SHAPE_FROM_DB_QA.test.mjs':('4ad7b2b5733703dad141d9d70646d0635a57334f245fcd7e896c79b0742ba6ef',''),
          }
          for name,(digest,compressed) in embedded.items():

      - name: R32CB live-column staging atomic booking on disposable PG17
        env:
          R32CB_REVIEW_ONLY: "YES"
        run: |
          test "$PGDATABASE" = dpro_photo_r32be_disposable
          test "$R32BE_DISPOSABLE_QA" = YES
          test "$R32CB_REVIEW_ONLY" = YES
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          python3 - <<'PYR32CB'
          import base64,gzip,hashlib,pathlib
          embeds={
            'R32CB_LIVE_COLUMN_ATOMIC_STAGING_DISPOSABLE_PG17.sql':('446da115b5020f8d9f82811c8ee1756070755edbe7173375435e623d12559f79',''),
            'R32CB_STAGING_DISPOSABLE_PG17_QA.py':('566261fba05d3c7bd94528500275340518e7ae3167878dcab253020dd2dd7dea',''),

      - name: R32CA no-legacy dual Gateway cutover staging and real HTTP boundary review
        run: |
          test "$PGDATABASE" = dpro_photo_r32be_disposable
          test "$R32BE_DISPOSABLE_QA" = YES
          test -z "${SUPABASE_URL:-}"

            'R32CA_GATEWAY_TO_ATOMIC_RECEIPT_JOIN_QA.test.mjs':('7da2f0c8707ab00fb3be4dd22e0ff23512729d588a5e96ca4f05ba2bdaa0b7c9',''),
          }

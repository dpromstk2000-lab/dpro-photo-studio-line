            'R32BX_DISPOSABLE_LIVE_LIKE_PG17_QA.py':('d0b52da554def6a6a0c3078e4bf283fe30473d224872682a6fde82089de4a282',''),
          }
          for name,(sha,payload) in embedded.items():
              data=gzip.decompress(base64.b64decode(payload,validate=True))
              assert hashlib.sha256(data).hexdigest()==sha,(name,'TAMPERED')
              pathlib.Path(name).write_bytes(data)
              print('PASS R32BX embedded file',name,flush=True)
          PYR32BX
      - name: R32BX independent live-like constraints, staff, capacity, atomicity, concurrency on disposable PG17
        run: |
          test "$PGDATABASE" = dpro_photo_r32be_disposable
          test "$R32BE_DISPOSABLE_QA" = YES
          psql -X -v ON_ERROR_STOP=1 -f R32BX_DISPOSABLE_LIVE_LIKE_PG17.sql
          python -u R32BX_DISPOSABLE_LIVE_LIKE_PG17_QA.py
      - name: R32BY restore source-verified production status and tenant parity QA
        run: |
          python - <<'PYR32BY'

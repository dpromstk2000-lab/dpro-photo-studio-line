          node --test --test-concurrency=1 R32BW_REAL_SCHEMA_RECEIPT_PORT_QA.test.mjs R32BW_UI_SHAPE_FROM_DB_QA.test.mjs
      - name: R32BX restore source-verified independent synthetic PG17 capacity and trigger QA
        run: |
          python - <<'PYR32BX'
          import pathlib, base64, gzip, hashlib, os
          assert os.environ['PGDATABASE']=='dpro_photo_r32be_disposable'
          assert os.environ['R32BE_DISPOSABLE_QA']=='YES'

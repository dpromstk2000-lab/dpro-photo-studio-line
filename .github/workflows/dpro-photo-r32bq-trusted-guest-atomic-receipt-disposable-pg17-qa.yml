            'R32BV_LIVE_SCHEMA_READ_ADAPTER_QA.test.mjs':('2abf5cb3910dcafc86313173fd0ce6e02119acb3fa93a0e824898560319c4465',''),
          }
          for name,(digest,blob) in embedded.items():
              content=gzip.decompress(base64.b64decode(blob))
              assert hashlib.sha256(content).hexdigest()==digest, (name,'SHA_MISMATCH')
              pathlib.Path(name).write_bytes(content)
              print('PASS R32BV SHA256',name,flush=True)
          PYR32BV
          node --test --test-concurrency=1 R32BV_LIVE_SCHEMA_READ_ADAPTER_QA.test.mjs

      - name: R32BW production-column completion receipt and UI DTO (isolated review-only)
        env:
          R32BW_REVIEW_ONLY: "YES"
        run: |
          test "$PGDATABASE" = "dpro_photo_r32be_disposable"
          test "$R32BE_DISPOSABLE_QA" = "YES"
          test "$R32BW_REVIEW_ONLY" = "YES"
          python3 - <<'PYR32BW'
          import base64,gzip,hashlib,pathlib

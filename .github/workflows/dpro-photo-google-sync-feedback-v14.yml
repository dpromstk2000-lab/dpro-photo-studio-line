name: DPRO Photo Google Sync Feedback V1.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe sync UI feedback patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_photo_sync_feedback_v14.py
          python /tmp/dpro_photo_sync_feedback_v14.py

      - name: Validate JavaScript and source references
        shell: bash
        run: |
          node --check photo-integrations-ui.js
          grep -q 'DPRO-PHOTO-INTEGRATIONS-UI-V1.4-GOOGLE-SYNC-FEEDBACK-20261008' photo-integrations-ui.js
          grep -q 'DPRO-PHOTO-INTEGRATIONS-UI-V1.4-GOOGLE-SYNC-FEEDBACK-20261008' owner.html
          grep -q 'aria-live="polite"' photo-integrations-ui.js
          git diff --check

      - name: Commit only verified files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-integrations-ui.js owner.html
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "DPRO PHOTO Google sync visible progress and results V1.4"
          git push

name: DPRO PHOTO CRM BRUSHUP-4 FIX V1.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photo-crm-brushup-4-fix-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f owner.html
          test -f config.js
          grep -F 'STUDIO-11-OWNER-FINAL-INTEGRATION-20260715' owner.html
          grep -F 'DPRO-PHOTO-FRONT-R2-20260824' config.js
          grep -F 'data-view="customers"' owner.html
          grep -F 'id="view-post"' owner.html
          grep -F '<h3>営業時間</h3>' owner.html
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Decode patcher
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_owner.py
          python -m py_compile /tmp/patch_owner.py

      - name: Patch owner follow-up center
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/patch_owner.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-4-20260918' owner.html
          grep -F 'dpro-photo-product-ready-gateway-v4' owner.html
          grep -F 'id="view-followup"' owner.html
          grep -F 'id="featureCustomerFollowup"' owner.html
          grep -F 'data-open-subject-history' owner.html
          grep -F 'line_segment: false' owner.html
          grep -F 'csv_migration: false' owner.html
          grep -F 'line_customer_link: false' owner.html

          python - <<'PY'
          from pathlib import Path
          import re, json
          s = Path("owner.html").read_text(encoding="utf-8")
          required = [
            "followupNavBtn","navFollowupBadge","view-followup","followupStats",
            "followupSearchBtn","followupResults","featureCustomerFollowup",
            "featureSubjectHistory","featureLifecycleSearch","featureBirthdaySearch",
            "featureReturnCycleSearch","subjectHistoryModal"
          ]
          bad = {rid:s.count(f'id="{rid}"') for rid in required if s.count(f'id="{rid}"') != 1}
          if bad:
              raise SystemExit(f"ID QA failed: {bad}")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S)
          inline = [x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit("No inline JS found")
          Path("/tmp/owner-inline.js").write_text(inline[-1], encoding="utf-8")
          Path("/tmp/photo-crm-qa.json").write_text(json.dumps({
            "ok": True,
            "marker": "DPRO-PHOTO-CRM-BRUSHUP-4-20260918",
            "line_segment_locked_false": "line_segment: false" in s,
            "csv_migration_locked_false": "csv_migration: false" in s,
            "line_customer_link_locked_false": "line_customer_link: false" in s
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          node --check /tmp/owner-inline.js

      - name: Create evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/photo-crm-brushup4
          cp /tmp/photo-crm-qa.json product-ready-evidence/photo-crm-brushup4/static-qa.json
          cat > product-ready-evidence/photo-crm-brushup4/STATUS.txt <<EOF
          DPRO PHOTO CRM BRUSHUP-4 FIX V1.2
          SOURCE_HEAD=${SOURCE_HEAD}
          CRM_GATEWAY=dpro-photo-product-ready-gateway-v4
          CRM_DB=DPRO-PHOTO-CRM-BRUSHUP-2-DB-20260918
          OWNER_UI=DPRO-PHOTO-CRM-BRUSHUP-4-20260918
          LINE_SEGMENT=false
          CSV_MIGRATION=false
          LINE_CUSTOMER_LINK=false
          STATIC_QA=PASS
          EOF

      - name: Commit BRUSHUP-4 and clean workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html product-ready-evidence/photo-crm-brushup4
          git rm -f --ignore-unmatch             .github/workflows/STEP-PHOTO-CRM-BRUSHUP-4.yml             .github/workflows/STEP-PHOTO-CRM-BRUSHUP-4-FIX.yml             .github/workflows/STEP-PHOTO-CRM-BRUSHUP-4-FIX-V1.2.yml
          git commit -m "Add PHOTO CRM follow-up center BRUSHUP-4"
          git push origin HEAD:main

      - name: Final
        shell: bash
        run: |
          echo "DPRO PHOTO CRM BRUSHUP-4 FIX V1.2: PASS"

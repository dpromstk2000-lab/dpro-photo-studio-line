name: DPRO PHOTO BRUSHUP-8-3.1 Reservation Calendar Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reservation-calendar-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="f484fb4c9ba7ef13eedf6eb25a5114739db4933d"
          WORKFLOW=".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-3-1-POLISH.yml"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi
          test -f index.html
          test -f photo-booking-calendar-v2.js
          test -f photo-booking-calendar-v2.css

      - name: Patch BRUSHUP-8-3.1 polish
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python -m py_compile /tmp/patch.py
          python /tmp/patch.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-booking-calendar-v2.js
          grep -F 'DPRO-PHOTO-RESERVATION-CALENDAR-V2-BRUSHUP-8-3-1-POLISH1-20260919' index.html
          grep -F 'DPRO-PHOTO-RESERVATION-CALENDAR-V2-BRUSHUP-8-3-1-POLISH1-20260919' photo-booking-calendar-v2.js
          grep -F 'function slotEndTime(slot)' index.html
          grep -F '残り${day.available_slot_count}枠' photo-booking-calendar-v2.js
          grep -F 'DPRO PHOTO Calendar V2 BRUSHUP-8-3.1 polish' photo-booking-calendar-v2.css
          git diff --check

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {"index.html","photo-booking-calendar-v2.js","photo-booking-calendar-v2.css"}
          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).split())
          extra = changed - allowed
          missing = allowed - changed
          if extra or missing:
              raise SystemExit(f"scope gate failed extra={sorted(extra)} missing={sorted(missing)}")
          PY
          grep -F 'dpro-photo-product-ready-gateway-v3' config.js
          grep -F 'dpro-photo-product-ready-gateway-v8' config.js
          grep -F 'PUBLIC_AVAILABILITY: "/api/public/availability"' config.js

      - name: Self-delete workflow and final validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-3-1-POLISH.yml"
          git diff --check

      - name: Commit BRUSHUP-8-3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html photo-booking-calendar-v2.js photo-booking-calendar-v2.css .github/workflows
          git diff --cached --check
          git commit -m "Polish PHOTO reservation calendar BRUSHUP-8-3.1"
          git push origin HEAD:main

name: DPRO Photo Feature Switch Phase 0 FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply feature switch foundation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          owner_path = Path("owner.html")
          settings_path = Path("photo-owner-settings-v2.js")
          segment_path = Path("photo-crm-segment.js")
          feature_path = Path("photo-feature-switch-master.js")

          for p in (owner_path, settings_path, segment_path):
              if not p.exists():
                  raise SystemExit(f"ERROR: missing {p}")

          owner = owner_path.read_text(encoding="utf-8")
          settings = settings_path.read_text(encoding="utf-8")
          segment = segment_path.read_text(encoding="utf-8")

          feature_js = r'''(() => {
            "use strict";
            const VERSION = "DPRO-PHOTO-FEATURE-SWITCH-PHASE0-FIX-20261006";
            let flags = {};

            function enabled(key, fallback = false) {
              return Object.prototype.hasOwnProperty.call(flags, key)
                ? flags[key] === true
                : fallback;
            }

            function hide(node, value) {
              if (node) node.hidden = Boolean(value);
            }

            function hideField(id, value) {
              const input = document.getElementById(id);
              const field = input?.closest(".field");
              if (field) field.hidden = Boolean(value);
            }

            function ensureIntro() {
              const anchor = document.getElementById("featureCustomerFollowup");
              const panel = anchor?.closest("section.panel");
              if (!panel || document.getElementById("featureSwitchMasterIntro")) return;

              const box = document.createElement("div");
              box.id = "featureSwitchMasterIntro";
              box.className = "auth-note";
              box.style.cssText = "margin:0 0 14px;line-height:1.65;";
              box.innerHTML =
                "<strong>使う機能だけONにしてください。</strong><br>" +
                "OFFにした機能は日常画面から隠れます。保存済みデータは削除されないため、あとからONに戻せます。<br>" +
                "<small>機能はDPRO側に残したまま、店舗ごとの画面だけをシンプルにします。</small>";

              const head = panel.querySelector(".panel-head");
              if (head) head.insertAdjacentElement("afterend", box);
              else panel.prepend(box);
            }

            function apply(notify = false) {
              ensureIntro();

              const follow = enabled("customer_followup", false);
              const subjectHistory = enabled("subject_history", false);
              const lifecycle = enabled("lifecycle_search", false);
              const birthday = enabled("birthday_search", false);
              const returnCycle = enabled("return_cycle_search", false);
              const segment = enabled("line_segment", false);
              const csv = enabled("csv_migration", false);
              const lineLink = enabled("line_customer_link", false);

              hide(document.getElementById("followupNavBtn"), !follow);
              if (!follow) hide(document.getElementById("view-followup"), true);

              hideField("followupAge3", !lifecycle);
              hideField("followupBirthdayMonth", !birthday);
              hideField("followupInactiveMonths", !returnCycle);

              document.querySelectorAll("[data-open-subject-history]").forEach((el) => {
                el.hidden = !subjectHistory;
              });

              const lineMount = document.getElementById("lineSegmentMount");
              hide(lineMount?.closest("section.panel"), !segment);

              hide(document.getElementById("csvMigrationPanel"), !csv);
              hide(document.getElementById("lineCustomerLinkPanel"), !lineLink);

              const crmNav = document.querySelector('.settings-v2-nav-btn[data-settings-group="crm"]');
              if (crmNav) crmNav.hidden = !(csv || lineLink);

              document.documentElement.dataset.dproPhotoFeatureSwitch = VERSION;

              if (notify) {
                window.dispatchEvent(new CustomEvent("dpro:photo-features-applied", {
                  detail: { version: VERSION, flags: { ...flags } }
                }));
              }
            }

            window.addEventListener("dpro:photo-settings-rendered", (event) => {
              flags = { ...(event?.detail?.featureFlags || {}) };
              apply(true);
              setTimeout(() => apply(false), 0);
              setTimeout(() => apply(false), 300);
            });

            const observer = new MutationObserver(() => apply(false));

            function start() {
              if (document.body) {
                observer.observe(document.body, { childList: true, subtree: true });
              }
            }

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", start, { once: true });
            } else {
              start();
            }

            window.DPRO_PHOTO_FEATURES = Object.freeze({
              version: VERSION,
              isEnabled: enabled,
              getFlags: () => ({ ...flags }),
              apply: () => apply(true)
            });
          })();'''

          feature_path.write_text(feature_js, encoding="utf-8")

          config_tag = '<script src="./config.js?v=DPRO-TUTORIAL-PHOTO-V1.1-20260828"></script>'
          feature_tag = '<script src="./photo-feature-switch-master.js?v=DPRO-PHOTO-FEATURE-SWITCH-PHASE0-FIX-20261006"></script>'
          if feature_tag not in owner:
              if config_tag not in owner:
                  raise SystemExit("ERROR: config script anchor not found")
              owner = owner.replace(config_tag, config_tag + "\n  " + feature_tag, 1)

          if "featureFlags: { ...flags }" not in owner:
              pattern = r'window\.dispatchEvent\(new CustomEvent\("dpro:photo-settings-rendered",\s*\{\s*detail:\s*\{[^}]*\}\s*\}\)\);'
              replacement = 'window.dispatchEvent(new CustomEvent("dpro:photo-settings-rendered", { detail: { featureFlags: { ...flags }, csvMigration: flags.csv_migration === true, lineCustomerLink: flags.line_customer_link === true } }));'
              owner, count = re.subn(pattern, replacement, owner, count=1)
              if count != 1:
                  raise SystemExit("ERROR: settings rendered event regex did not match")

          owner_path.write_text(owner, encoding="utf-8")

          if 'id: "features", label: "使う機能"' not in settings:
              anchor = '{ id: "reservation", label: "予約設定", note: "日常", desc: "受付条件・予約ルール" },'
              insert = anchor + ' { id: "features", label: "使う機能", note: "かんたん", desc: "必要な機能だけON" },'
              if anchor not in settings:
                  raise SystemExit("ERROR: reservation group anchor not found")
              settings = settings.replace(anchor, insert, 1)

          settings = settings.replace(
              '{ id: "crm", label: "顧客・CRM設定", note: "必要時", desc: "フォロー・CSV・LINE" },',
              '{ id: "crm", label: "顧客・LINE詳細", note: "必要時", desc: "CSV移行・再紐付け" },',
              1
          )

          old_classify = 'if (/顧客フォロー機能|顧客・CRM機能|CSVデータ移行|LINE友だち・既存顧客/.test(h)) return "crm";'
          new_classify = 'if (/顧客・CRM機能/.test(h)) return "features"; if (/顧客フォロー機能|CSVデータ移行|LINE友だち・既存顧客/.test(h)) return "crm";'
          if old_classify in settings:
              settings = settings.replace(old_classify, new_classify, 1)
          elif 'return "features";' not in settings:
              raise SystemExit("ERROR: classify panel anchor not found")

          settings = settings.replace(
              'const VERSION = "DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-10-HOTFIX2-V21-20260922";',
              'const VERSION = "DPRO-PHOTO-FEATURE-SWITCH-PHASE0-FIX-20261006";',
              1
          )
          settings_path.write_text(settings, encoding="utf-8")

          if "function featureEnabled()" not in segment:
              anchor = 'function linePanel() { return $("lineSegmentMount"); }'
              insert = anchor + '''
              function featureEnabled() {
                const features = window.DPRO_PHOTO_FEATURES;
                if (features && typeof features.isEnabled === "function") {
                  return features.isEnabled("line_segment", false);
                }
                return $("featureLineSegment")?.checked === true;
              }'''
              if anchor not in segment:
                  raise SystemExit("ERROR: line panel anchor not found")
              segment = segment.replace(anchor, insert, 1)

          if 'async function loadRecent() { if (!featureEnabled()) return;' not in segment:
              old = 'async function loadRecent() { if (!$("segmentRecentList")) return;'
              new = 'async function loadRecent() { if (!featureEnabled()) return; if (!$("segmentRecentList")) return;'
              if old not in segment:
                  raise SystemExit("ERROR: loadRecent anchor not found")
              segment = segment.replace(old, new, 1)

          if 'async function loadCapability() { if (!featureEnabled()) return;' not in segment:
              old = 'async function loadCapability() { try {'
              new = 'async function loadCapability() { if (!featureEnabled()) return; try {'
              if old not in segment:
                  raise SystemExit("ERROR: loadCapability anchor not found")
              segment = segment.replace(old, new, 1)

          old_refresh = 'const refreshSegmentSoon = () => setTimeout(() => { loadCapability(); loadRecent(); }, 350);'
          new_refresh = 'const refreshSegmentSoon = () => setTimeout(() => { if (featureEnabled()) { loadCapability(); loadRecent(); } }, 350);'
          if old_refresh in segment:
              segment = segment.replace(old_refresh, new_refresh, 1)

          if 'window.addEventListener("dpro:photo-features-applied"' not in segment:
              old = 'loadCapability(); loadRecent(); updateCharCount();'
              new = '''if (featureEnabled()) { loadCapability(); loadRecent(); }
              window.addEventListener("dpro:photo-features-applied", (event) => {
                if (event?.detail?.flags?.line_segment === true) {
                  loadCapability();
                  loadRecent();
                }
              });
              updateCharCount();'''
              if old not in segment:
                  raise SystemExit("ERROR: segment mount tail anchor not found")
              segment = segment.replace(old, new, 1)

          segment = segment.replace(
              'const VERSION = "DPRO-PHOTO-CRM-BRUSHUP-5-UI-POLISH1-20260918";',
              'const VERSION = "DPRO-PHOTO-FEATURE-SWITCH-PHASE0-SEGMENT-FIX-20261006";',
              1
          )
          segment_path.write_text(segment, encoding="utf-8")

          print("PHASE 0 FIX source update complete")
          PY

      - name: Validate
        shell: bash
        run: |
          node --check photo-feature-switch-master.js
          node --check photo-owner-settings-v2.js
          node --check photo-crm-segment.js
          python - <<'PY'
          from pathlib import Path

          owner = Path("owner.html").read_text(encoding="utf-8")
          settings = Path("photo-owner-settings-v2.js").read_text(encoding="utf-8")
          feature = Path("photo-feature-switch-master.js").read_text(encoding="utf-8")
          segment = Path("photo-crm-segment.js").read_text(encoding="utf-8")

          checks = {
              "feature_script_loaded": "photo-feature-switch-master.js?v=DPRO-PHOTO-FEATURE-SWITCH-PHASE0-FIX-20261006" in owner,
              "full_flags_event": "featureFlags: { ...flags }" in owner,
              "simple_feature_group": 'id: "features", label: "使う機能"' in settings,
              "crm_detail_group": 'label: "顧客・LINE詳細"' in settings,
              "off_preserves_data_message": "保存済みデータは削除されない" in feature,
              "followup_visibility": 'getElementById("followupNavBtn")' in feature,
              "csv_visibility": 'getElementById("csvMigrationPanel")' in feature,
              "line_link_visibility": 'getElementById("lineCustomerLinkPanel")' in feature,
              "line_segment_api_guard": "if (!featureEnabled()) return;" in segment,
          }

          print(checks)
          failed = [k for k, v in checks.items() if not v]
          if failed:
              raise SystemExit("ERROR: validation failed: " + ", ".join(failed))
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html photo-owner-settings-v2.js photo-crm-segment.js photo-feature-switch-master.js
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Add DPRO Photo feature switch foundation"
          git push

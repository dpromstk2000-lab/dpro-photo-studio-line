      - name: Confirm only system-check was edited and no data writes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_R31_SCOPE'
          import subprocess
          from pathlib import Path
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines() if line[3:]!='DPRO_PHOTO_R31_STATIC_GATE.json'}
          assert changed in (set(),{'system-check.html'}),f'R31 refuses changes outside system-check.html: {changed}'
          doc=Path('system-check.html').read_text()
          assert 'production_approved: false' in doc
          assert 'live_write_tested: false' in doc
          print('R31 release check read-only, modified scope',sorted(changed))
          PY_R31_SCOPE
      - name: Commit confirmed front-end check only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'R31 only supports main' >&2; exit 1; }
          if git diff --quiet -- system-check.html; then
            echo 'R31 already installed; no duplicate changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add system-check.html
            git commit -m 'DPRO PHOTO R31 verify R26-R30 public source on system-check'
            git push
          fi
      - name: Archive read-only gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_PHOTO_R31_SYSTEM_CHECK_GATE
          path: DPRO_PHOTO_R31_STATIC_GATE.json
          if-no-files-found: warn

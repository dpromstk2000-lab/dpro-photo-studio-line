name: DPRO Photo Feature Switch Phase 0 FIX2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply feature switch foundation
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_phase0_fix2_patch.py
          python /tmp/dpro_phase0_fix2_patch.py

      - name: Validate
        shell: bash
        run: |
          node --check photo-feature-switch-master.js
          node --check photo-owner-settings-v2.js
          node --check photo-crm-segment.js
          python - <<'PYV'
          from pathlib import Path
          owner = Path("owner.html").read_text(encoding="utf-8")
          settings = Path("photo-owner-settings-v2.js").read_text(encoding="utf-8")
          feature = Path("photo-feature-switch-master.js").read_text(encoding="utf-8")
          segment = Path("photo-crm-segment.js").read_text(encoding="utf-8")
          checks = {
              "feature_script_loaded": "photo-feature-switch-master.js?v=DPRO-PHOTO-FEATURE-SWITCH-PHASE0-FIX2-20261006" in owner,
              "full_flags_event": "featureFlags: { ...flags }" in owner,
              "simple_feature_group": 'id: "features", label: "使う機能"' in settings,
              "crm_detail_group": 'label: "顧客・LINE詳細"' in settings,
              "off_preserves_data_message": "保存済みデータは削除されない" in feature,
              "line_segment_guard": "function featureEnabled()" in segment and "if (!featureEnabled()) return;" in segment,
              "line_segment_event": 'dpro:photo-features-applied' in segment,
          }
          print(checks)
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("ERROR: validation failed: " + ", ".join(failed))
          PYV
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html photo-owner-settings-v2.js photo-crm-segment.js photo-feature-switch-master.js
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Add DPRO Photo feature switch foundation FIX2"
          git push

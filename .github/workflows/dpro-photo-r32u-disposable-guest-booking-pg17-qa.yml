      - name: Offline static safety gate and mutation detection
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/R32U_STATIC_PREFLIGHT.py /tmp/R32U_GUEST_ATOMIC_BOOKING_DISPOSABLE_PG17.sql /tmp/R32U_DISPOSABLE_POSTGRES_INTEGRATION_QA.py
      - name: Run fresh isolated PostgreSQL 17 (no host ports or production credentials)
        shell: bash
        run: |
          set -euo pipefail
          docker run --name qa_r32u_pg --detach \
            --env POSTGRES_PASSWORD=r32u-only-disposable-test \
            --env POSTGRES_DB=postgres \
            postgres:17
          for i in $(seq 1 50); do
            if docker exec qa_r32u_pg pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec qa_r32u_pg pg_isready -U postgres -d postgres
          docker exec -i qa_r32u_pg psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < /tmp/R32U_GUEST_ATOMIC_BOOKING_DISPOSABLE_PG17.sql > /tmp/r32u-schema.log
          python3 /tmp/R32U_DISPOSABLE_POSTGRES_INTEGRATION_QA.py | tee /tmp/r32u-qa.log
          grep -E '^R32U PostgreSQL 17 isolated: [0-9]+ PASS / 0 FAIL$' /tmp/r32u-qa.log
          {
            echo '## DPRO PHOTO R32U — disposable guest reservation PostgreSQL 17 QA'
            grep -E '^R32U PostgreSQL 17 isolated: [0-9]+ PASS / 0 FAIL$' /tmp/r32u-qa.log
            echo 'Scope: temporary PG17 Docker container, synthetic studios/customers/slots ONLY.'
            echo 'No GitHub checkout, no repo writes, no Supabase queries/SQL, no Worker deployment, no LINE sends.'
            echo 'RELEASE HOLD — live schema, SMS/email proof issuer, Gateway/Worker, original booking UX, full E2E remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Discard PostgreSQL fixture container
        if: always()
        shell: bash
        run: |
          docker rm -f qa_r32u_pg 2>/dev/null || true

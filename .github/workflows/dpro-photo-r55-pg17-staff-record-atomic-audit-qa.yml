name: DPRO PHOTO R55.1 PG17 Atomic Staff Shooting Record and Audit QA (Fixture Fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r55-disposable-pg17-atomic-staff:
    name: R55.1 isolated PG17 concurrency audit and signed HTTP (NO PRODUCTION)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photo_r55_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photo_r55_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: photo_r55_disposable
      R54_LOCAL_ISOLATED: "YES"
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unpack reviewed R55 sources and verify SHA256 (no checkout, no secrets)
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,gzip,pathlib
          root=pathlib.Path("/tmp/dpro-photo-r55-disposable")
          root.mkdir(parents=True,exist_ok=True)
          sealed={
              'R55_GATEWAY_ATOMIC_STAFF_REVIEW_ONLY.js': ('66b67dda9d3796da83f6dc55eeb11b065703b9fd561b89688a588a6bff1d28ce', ''),
              'R55_WORKER_ATOMIC_STAFF_REVIEW_ONLY.mjs': ('951b6186487498fb6a16227213e70ab49f56fe384e3c3a88883fc6985148b708', ''),
              'R55_REAL_GATEWAY_WORKER_FIXTURE.cjs': ('3b13b44f2ea7cc6d672d148737ad37b9ed5df9f972a744c1cca4195fc974814f', ''),
              'R55_REAL_STAFF_HTTP_QA.cjs': ('caa027d463d85a9d0869c6a0150a2536713f60cf5fd9c75210e794786dcd0725', ''),
              'R55_DISPOSABLE_PG17_SCHEMA.sql': ('bfee79da3e8fe3b49003748eda27628473374f1ee8ca001304b524d6fdb52010', ''),
              'R55_STAFF_RECORD_ATOMIC_REVIEW_ONLY.sql': ('1996241d4215b7cb870951581c6c41f2af266f24cafc578185171a7b417f21ac', ''),
              'R55_DISPOSABLE_PG17_QA.py': ('0717d63cb4f94a27c8d9cce2b36ccd20184f39e80a873afeeb73542006c147dd', ''),
              'R54_OWNER_CRM_UI_REVIEW_ONLY.html': ('88311476379d4731af5f10cd2165131fcbe9cdc2a14e79325cf9ecc24e951c51', ''),
          }
          assert len(sealed)==8, 'R55.1 expected 8 sealed fixture/test sources'
          assert 'R54_OWNER_CRM_UI_REVIEW_ONLY.html' in sealed, 'missing owner CRM HTML fixture'
          for name,(sha,encoded) in sealed.items():
              data=gzip.decompress(base64.b64decode(encoded,validate=True))
              assert hashlib.sha256(data).hexdigest()==sha,(name,"sha mismatch")
              (root/name).write_bytes(data)
              print("PASS R55 sealed sha256",name)
          PY
      - name: Validate Node and Python source syntax
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r55-disposable
          node --check R55_GATEWAY_ATOMIC_STAFF_REVIEW_ONLY.js
          node --check R55_WORKER_ATOMIC_STAFF_REVIEW_ONLY.mjs
          node --check R55_REAL_GATEWAY_WORKER_FIXTURE.cjs
          node --check R55_REAL_STAFF_HTTP_QA.cjs
          python -m py_compile R55_DISPOSABLE_PG17_QA.py
      - name: Real signed Gateway-to-Worker localhost HTTP regression (synthetic DB)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r55-disposable
          # The R54 Owner CRM HTML is a required fixture dependency. Print the
          # server startup error if it exits before opening the localhost port.
          test -s R54_OWNER_CRM_UI_REVIEW_ONLY.html
          node R55_REAL_GATEWAY_WORKER_FIXTURE.cjs > /tmp/r55-fixture.log 2>&1 &
          PID=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo '=== R55.1 fixture startup / HTTP diagnostics ==='
              cat /tmp/r55-fixture.log || true
            fi
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 40); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'R55.1 localhost fixture process terminated before readiness'
              cat /tmp/r55-fixture.log || true
              exit 1
            fi
            if node -e "fetch('http://127.0.0.1:18776/r54-owner-ui').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo 'R55.1 localhost fixture failed readiness check'
            exit 1
          fi
          node R55_REAL_STAFF_HTTP_QA.cjs
      - name: Install fixed-version PostgreSQL 17 test client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"
      - name: Create and test disposable PG17 schema and staff RPC
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r55-disposable
          python - <<'PY'
          import pathlib, psycopg
          root=pathlib.Path(".")
          with psycopg.connect("host=127.0.0.1 port=5432 dbname=photo_r55_disposable user=postgres password=postgres",autocommit=True) as c:
              for name in ("R55_DISPOSABLE_PG17_SCHEMA.sql","R55_STAFF_RECORD_ATOMIC_REVIEW_ONLY.sql"):
                  c.execute((root/name).read_text())
                  print("PASS R55 PG17 loaded",name)
          PY
          python -u R55_DISPOSABLE_PG17_QA.py

name: DPRO PHOTO R33G Owner Followup View Bridge Offline QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-no-external-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore SHA256-verified isolated code and 268 tests
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, gzip, base64, pathlib
          entries = [
              ('R33B_PHOTO_COMMON_REVIEW_ONLY.mjs', 'bde740a76dc44ca9d708f22c920e3b5150b136774da26744d542285a3e0c09ef', ''),
              ('R33B_PHOTO_COMMON_REVIEW_ONLY.test.mjs', '8b9bf21b32a5ecfc09dfa320929063cf906d6dd3d36a799115a2d2bf6d7faf9b', ''),
              ('R33C_CUSTOMER_REGION_ADMIN_STAGING_ONLY.mjs', 'd4b03c3ab397b7f604b3df7610d4f46944feafd46a9ef5ad2ea5549b29a0252d', ''),
              ('R33C_CUSTOMER_REGION_ADMIN_STAGING_ONLY.test.mjs', '41078e73f481b3dc4805be538da36c6ad6eac897f6f3613ffa2262c18a2695bf', ''),
              ('R33C_LINE_EMAIL_PREFLIGHT_STAGING_ONLY.mjs', '7bc59faefc24f9290d32b61f6e0d6b758b8abd2dce033d3741dc6a2ccd12c00e', ''),
              ('R33C_LINE_EMAIL_PREFLIGHT_STAGING_ONLY.test.mjs', 'ed8dc223b9147450d6ded65679f38ac1cbaf8caf1b1242777091771201ebd706', ''),
              ('R33D_REGION_KEYSET_GATEWAY_STAGING_ONLY.mjs', '53b98c90339cbfd7e7f685601b32bfbd7f06e1b850491ac2e0c318855bb71d15', ''),
              ('R33D_REGION_KEYSET_GATEWAY_STAGING_ONLY.test.mjs', '6696bdbb8cef8c8fa98ef6272b7acd43a852ca8287dab5ccc290543a46ae3520', ''),
              ('R33E_GATEWAY_OWNER_ROUTE_RUNTIME.test.mjs', 'a8cebf222108f55885c9982dcfb7e25032ca74ff7d3b4f9c2765d806754d7215', ''),
              ('R33E_OWNER_GATEWAY_ENDTOEND.test.mjs', 'df97ba5e6d60f79a8b2ce52593a2ce282b79fef2bb5f61a379ca23653f2cb2a6', ''),
              ('R33E_OWNER_REGION_PREVIEW_STAGING_ONLY.js', '414b63e06d375ec9be5948b81b82f6f048f55ad223380ec998cdbe28b03b0f7d', ''),
              ('R33E_OWNER_UI_RUNTIME.test.mjs', '531e2eb1ea7c66575e82f1a217d43f2958da672410ff5029063cd3ee222b8e17', ''),
              ('R33E_V5_REGION_ROUTE_STAGING_COMPILED.js', '4e8bbe46ed1a99c0ae8bbff8fd0450aedad27921a1714e7dfa5d50cec8f6bf04', ''),
              ('R33F_HARDENED_OWNER_RUNTIME.test.mjs', 'e41e48de2f6c5c9016e205a4a2cd4d97e1519d94cd303df0b2d4aca61b33fabf', ''),
              ('R33F_OWNER_REGION_HARDENED_STAGING_ONLY.js', '791e79ec00e88671dd803044aa10055e949f2f593a53d229904ec58bb7f26de7', ''),
              ('R33F_REAL_GATEWAY_CONTRACT_E2E.test.mjs', '2e4ffe2d8beb6284c3866c1fe8399c2a1439dc63c252242edeebc19f30d8411d', ''),
              ('R33G_OWNER_REGION_VIEW_BRIDGE_STAGING_ONLY.js', 'b79709f899ad5d57115808af37cd42430dbcb633fc848feed52e3ad3676239ca', ''),
              ('R33G_OWNER_REGION_VIEW_BRIDGE.test.mjs', 'c8a91addf42dca259997c399c6f9f6d2dc083c70c09b3082b6703a9809d9335b', ''),
          ]
          for filename, sha, encoded in entries:
              assert filename and '/' not in filename and chr(92) not in filename
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == sha, filename
              pathlib.Path(filename).write_bytes(data)
          print('R33G: 18 immutable staging code/test sources verified')
          PY
      - name: Run R33B-R33G offline 268 synthetic contracts (no DB, secrets, LINE, email)
        run: node --test *.test.mjs

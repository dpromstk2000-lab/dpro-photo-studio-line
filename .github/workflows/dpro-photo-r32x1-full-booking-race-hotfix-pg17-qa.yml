      - name: Disposable PostgreSQL 17 race SQLSTATE and booking transaction QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/r32x1
          docker run --detach --rm --name qa_r32x_pg --network none \
            --env POSTGRES_PASSWORD=qa_r32x_local_only \
            --env POSTGRES_DB=dpro_photo_r32x_disposable postgres:17
          trap "docker rm -f qa_r32x_pg >/dev/null 2>&1 || true" EXIT
          READY=0
          for i in $(seq 1 80); do
            if docker exec qa_r32x_pg pg_isready -U postgres -d dpro_photo_r32x_disposable >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          cat > PG17_QA_GUARD.sql <<'R32X1_GUARD_END'
          DO $r32x_guard$ BEGIN IF current_database() <> 'dpro_photo_r32x_disposable' THEN RAISE EXCEPTION 'QA_ONLY'; END IF; END $r32x_guard$;
          R32X1_GUARD_END
          cat PG17_QA_GUARD.sql R32U_GUEST_ATOMIC_BOOKING_DISPOSABLE_PG17.sql R32X_FULL_BOOKING_ATOMIC_DISPOSABLE_PG17.sql | \
            docker exec -i qa_r32x_pg psql -X -v ON_ERROR_STOP=1 -U postgres -d dpro_photo_r32x_disposable -1 -f -
          python3 R32X1_DISPOSABLE_POSTGRES_FULL_BOOKING_QA.py | tee /tmp/r32x1/results.log
          grep -F "R32X.1 disposable full-booking integration: 62 PASS / 0 FAIL" /tmp/r32x1/results.log
          {
            echo "## DPRO PHOTO R32X.1 — disposable PostgreSQL 17 race verification"
            tail -1 /tmp/r32x1/results.log
            echo "Concurrent conflict SQLSTATE and committed row invariants examined. RELEASE HOLD."
            echo "No production SQL / no Worker Deploy / no public site writes / no LINE dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

           ok('no URL credential exposure added',()=>assert(html.includes('content="no-referrer"')));
           ok('auth context recheck remains before POST',()=>assert(submit.indexOf('if (!isOriginalContext()) return;')<submit.indexOf('const result = await C.apiPost')));
           ok('input guard prevents storage write while submitting',()=>assert(input.includes('if (!state.requestSubmitting) saveRequestDraft(')));
           ok('no deliberate backend calls added by UI lock',()=>assert(!submit.includes('fetch(')));
           ok('locks note before auth',()=>assert(submit.indexOf('els.requestNote.readOnly = true')<submit.indexOf('await refreshMemberSessionForRequest()')));
           ok('unlocks note in finally',()=>assert(submit.indexOf('els.requestNote.readOnly = false')>submit.indexOf('} finally {')));
           ok('lock select supports absent select fixture',()=>assert(submit.includes('if (els.requestTypeSelect) els.requestTypeSelect.disabled = true')));
           ok('unlock select in finally',()=>assert(submit.includes('if (els.requestTypeSelect) els.requestTypeSelect.disabled = false')));
           ok('lock submit while post pending',()=>assert(submit.includes('if (els.submitRequestButton) els.submitRequestButton.disabled = true')));
           ok('unlock submit after post completion',()=>assert(submit.includes('if (els.submitRequestButton) els.submitRequestButton.disabled = false')));
           ok('request note never erased by lock itself',()=>assert(!submit.includes('els.requestNote.value = ""')));
           ok('R6 draft not purged in lock path',()=>assert(!submit.includes('sessionStorage.clear')));
           ok('R20 close button callback stays safe',()=>assert(html.includes('"click", () => closeRequestModal()')));
           ok('all inline script syntax valid',()=>{for(const m of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g))if(m[1].trim())new vm.Script(m[1])});
           const locked=h=>{assert.equal(h.state.requestSubmitting,true);assert.equal(h.note.readOnly,true);assert.equal(h.sel.disabled,true);assert.equal(h.submitButton.disabled,true)};
           const unlocked=h=>{assert.equal(h.state.requestSubmitting,false);assert.equal(h.note.readOnly,false);assert.equal(h.sel.disabled,false);assert.equal(h.submitButton.disabled,false)};
           await aok('before submit editor is editable',async()=>{const h=fixture();assert.equal(h.note.readOnly,false);assert.equal(h.sel.disabled,false);assert.equal(h.submitButton.disabled,false)});
           await aok('form freezes before member authentication',async()=>{const h=fixture();const p=h.send();locked(h);h.auth.resolve();await Promise.resolve();h.post.resolve({message:'sent'});await p;unlocked(h)});
           await aok('draft input handler rejects synthetic input during authentication',async()=>{const h=fixture();const p=h.send();h.events.input();assert(!h.actions.includes('SAVE_DRAFT'));h.auth.resolve();await Promise.resolve();h.post.resolve({});await p});
           await aok('draft input handler accepts edits before sending',async()=>{const h=fixture();h.events.input();assert.equal(h.actions.filter(x=>x==='SAVE_DRAFT').length,1)});
           await aok('draft input handler accepts edits after completed send',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();h.post.resolve({});await p;h.events.input();assert(h.actions.includes('SAVE_DRAFT'))});
           await aok('note locked while POST in progress',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();locked(h);h.post.resolve({});await p});
           await aok('successful submit sends once',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();h.post.resolve({});await p;assert.equal(h.actions.filter(x=>x==='POST').length,1)});
           await aok('successful submit unlocks all editors',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();h.post.resolve({});await p;unlocked(h)});
           await aok('successful submit clears only original draft after response',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();assert(!h.actions.includes('CLEAR_DRAFT'));h.post.resolve({});await p;assert(h.actions.indexOf('POST')<h.actions.indexOf('CLEAR_DRAFT'))});
           await aok('successful submit preserves text until reply',async()=>{const h=fixture();const original=h.note.value;const p=h.send();locked(h);assert.equal(h.note.value,original);h.auth.resolve();await Promise.resolve();h.post.resolve({});await p});
           await aok('success triggers UI reload after confirmation',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();h.post.resolve({});await p;assert(h.actions.includes('RELOAD'))});
           await aok('auth rejection unlocks all form fields',async()=>{const h=fixture();const p=h.send();h.auth.reject(new Error('authorization failed'));await p;unlocked(h)});
           await aok('auth rejection leaves unsent draft intact',async()=>{const h=fixture();const p=h.send();h.auth.reject(new Error('expired'));await p;assert.equal(h.note.value,'保護する入力途中の文章');assert(!h.actions.includes('CLEAR_DRAFT'))});
           await aok('auth rejection must not POST',async()=>{const h=fixture();const p=h.send();h.auth.reject(new Error('expired'));await p;assert(!h.actions.includes('POST'))});
           await aok('POST rejection unlocks all form fields',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();h.post.reject(new Error('network'));await p;unlocked(h)});
           await aok('POST rejection preserves draft',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();h.post.reject(new Error('network'));await p;assert(!h.actions.includes('CLEAR_DRAFT'))});
           await aok('POST rejection keeps modal open for retry',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();h.post.reject(new Error('network'));await p;assert(!h.actions.includes('CLOSE'))});
           await aok('identity invalidation before POST results in no write',async()=>{const h=fixture();const p=h.send();h.state.memberLoadSeq++;h.auth.resolve();await p;unlocked(h);assert(!h.actions.includes('POST'))});
           await aok('identity invalidation after POST does not clear draft',async()=>{const h=fixture();const p=h.send();h.auth.resolve();await Promise.resolve();h.state.memberLoadSeq++;h.post.resolve({});await p;unlocked(h);assert(!h.actions.includes('CLEAR_DRAFT'))});
           await aok('duplicate submission prevented while waiting for auth',async()=>{const h=fixture();const a=h.send();await h.send();assert.equal(h.actions.filter(x=>x==='AUTH').length,1);h.auth.resolve();await Promise.resolve();h.post.resolve({});await a});
           await aok('wrong loaded identity never locks editor',async()=>{const h=fixture({loadedLookup:{line_user_id:'different',public_token:''}});await h.send();unlocked(h);assert(!h.actions.includes('POST'))});
           await aok('missing reservation does not lock editor',async()=>{const h=fixture({reservations:[]});await h.send();unlocked(h)});
           await aok('already submitted change not sent',async()=>{const h=fixture({modalMode:'change',reservations:[{id:'11111111-1111-4111-8111-111111111111',reservation_no:'R21-SYNTHETIC',reservation_status:'change_requested'}]});await h.send();assert(!h.actions.includes('POST'));unlocked(h)});
           await aok('reorder selection is captured before lock',async()=>{const h=fixture({modalMode:'reorder'});const p=h.send();locked(h);h.auth.resolve();await Promise.resolve();h.post.resolve({});await p;unlocked(h)});
           ok('tests use only synthetic names',()=>assert(checks.every(x=>!x.includes('FAKE_SYNTHETIC'))));
           const report={product:'DPRO PHOTO',gate:'R21 MEMBER REQUEST INFLIGHT EDITOR LOCK',mode:'OFFLINE_BROWSER_VM_SYNTHETIC',counts:{passed:checks.length,failed:0},checks,productionReady:false,liveApiGET:0,liveMutations:0};
           fs.writeFileSync('DPRO_PHOTO_PRODUCT_GATE_R21.json',JSON.stringify(report,null,2)+'\n');
           console.log('DPRO PHOTO R21 '+checks.length+' PASS 0 FAIL');
          })().catch(e=>{console.error('R21 TEST FAILED',e.stack||String(e));process.exitCode=1});
          NODE_R21
      - name: Validate R17-R21 evidence and frontend only changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY_R21_VERIFY'
          import json,subprocess
          from pathlib import Path
          wanted={'R17':41,'R18':49,'R19':55,'R20':36}
          checked=0
          for k,expected in wanted.items():
           p=Path('DPRO_PHOTO_PRODUCT_GATE_'+k+'.json')
           assert p.is_file(),f'R21 STOP missing {k} report'
           r=json.loads(p.read_text('utf8'))
           assert r['counts']['passed']==expected and r['counts']['failed']==0,f'R21 STOP {k} regression failure'
           checked+=expected
          r=json.loads(Path('DPRO_PHOTO_PRODUCT_GATE_R21.json').read_text('utf8'))
          assert r['counts']['passed'] >= 45 and r['counts']['failed']==0
          checked+=r['counts']['passed']
          changed=subprocess.run(['git','diff','--name-only'],text=True,capture_output=True,check=True).stdout.strip().splitlines()
          assert changed in [[],['member.html']],f'R21 STOP unexpected changed files {changed}'
          print(f'R21 verified {checked} PASS / 0 FAIL; changed={changed}; no real API or DB mutations')
          PY_R21_VERIFY
      - name: Commit only verified member.html change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- member.html; then echo 'R21 already applied; no commit'; exit 0; fi
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- member.html
          git commit -m 'DPRO PHOTO R21 lock member request editor during pending send'
          git push
      - name: Archive R17-R21 synthetic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_PHOTO_PRODUCT_GATE_R21
          path: |
            DPRO_PHOTO_PRODUCT_GATE_R17.json
            DPRO_PHOTO_PRODUCT_GATE_R18.json
            DPRO_PHOTO_PRODUCT_GATE_R19.json
            DPRO_PHOTO_PRODUCT_GATE_R20.json
            DPRO_PHOTO_PRODUCT_GATE_R21.json
          if-no-files-found: warn

name: DPRO PHOTO CRM BRUSHUP-7 LINE Customer Link

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photo-crm-brushup-7:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f owner.html
          test -f photo-crm-import.js
          grep -F 'id="featureLineCustomerLink"' owner.html
          grep -F 'line_customer_link: false' owner.html
          grep -F 'dpro:photo-settings-rendered' owner.html

      - name: Write LINE customer link UI
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > photo-crm-line-link.js
          node --check photo-crm-line-link.js

      - name: Patch owner
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_owner_b7.py
          python -m py_compile /tmp/patch_owner_b7.py
          python /tmp/patch_owner_b7.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check photo-crm-line-link.js
          grep -F 'photo-crm-line-link.js?v=DPRO-PHOTO-CRM-BRUSHUP-7-20260918' owner.html
          grep -F 'line_customer_link: $("featureLineCustomerLink").checked' owner.html
          grep -F 'lineCustomerLink: flags.line_customer_link === true' owner.html
          grep -F 'dpro-photo-product-ready-gateway-v7' photo-crm-line-link.js
          grep -F 'LINE表示名だけでは自動紐付けしません' photo-crm-line-link.js
          grep -F '別顧客に紐付いているLINE IDの横取りはサーバー側で拒否します' photo-crm-line-link.js

      - name: Commit BRUSHUP-7 and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-crm-line-link.js
          git rm -f --ignore-unmatch .github/workflows/STEP-PHOTO-CRM-BRUSHUP-7.yml
          git commit -m "Add PHOTO CRM LINE customer link BRUSHUP-7"
          git push origin HEAD:main

      - name: Final
        shell: bash
        run: |
          echo "DPRO PHOTO CRM BRUSHUP-7 LINE Customer Link: PASS"

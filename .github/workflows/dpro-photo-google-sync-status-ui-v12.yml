name: DPRO Photo Google Sync Status UI V1.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Google sync status UI
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_patch.py
          python /tmp/dpro_patch.py

      - name: Validate
        shell: bash
        run: |
          node --check photo-integrations-ui.js
          grep -q 'DPRO-PHOTO-INTEGRATIONS-UI-V1.2-GOOGLE-SYNC-STATUS-20261007' photo-integrations-ui.js
          grep -q '同期状況' photo-integrations-ui.js
          grep -q '同期中…' photo-integrations-ui.js
          grep -q 'DPRO-PHOTO-INTEGRATIONS-UI-V1.2-GOOGLE-SYNC-STATUS-20261007' owner.html
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-integrations-ui.js owner.html
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Polish Google Calendar sync status UI"
          git push

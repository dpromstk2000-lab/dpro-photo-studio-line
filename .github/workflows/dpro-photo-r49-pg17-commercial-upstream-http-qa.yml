name: DPRO PHOTO R49 PG17 Commercial Upstream and Real HTTP Isolation QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r45-disposable-http-policy:
    name: R49 commercial upstream plus booking PG17 (NO PRODUCTION)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: R36V_ONLY_DISPOSABLE_PORT_5432
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Python for disposable PG17-only adapter
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Node.js 22 localhost HTTP
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only client
        run: python3 -m pip install 'psycopg[binary]==3.2.10'

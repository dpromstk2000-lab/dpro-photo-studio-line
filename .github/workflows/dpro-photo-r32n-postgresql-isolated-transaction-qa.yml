name: DPRO PHOTO R32N PostgreSQL 17 Isolated Transaction QA NO DEPLOY
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: dpro-photo-r32n-disposable-postgres-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r32n-isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: photo_qa
          POSTGRES_PASSWORD: ephemeral_fixture_only
          POSTGRES_DB: photo_qa
        options: >-
          --health-cmd "pg_isready -U photo_qa -d photo_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Isolated PostgreSQL 17 validation - NO checkout, NO secrets, NO deploy
        shell: bash
        env:
          R32N_ALLOW_DISPOSABLE_PG: "YES"
        run: |
          set -euo pipefail
          # The PostgreSQL service container is created only for this single job.
          # No host port mapping and no checkout. All data is synthetic.
          test "${GITHUB_ACTIONS:-}" = "true"
          mapfile -t ids < <(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}')
          if [ "${#ids[@]}" -ne 1 ]; then
            echo 'REFUSE: expected exactly one disposable postgres:17 service container'
            exit 1
          fi
          export R32N_PG_CONTAINER_ID="${ids[0]}"
          wd="$(mktemp -d)"
          trap 'rm -rf "$wd"' EXIT

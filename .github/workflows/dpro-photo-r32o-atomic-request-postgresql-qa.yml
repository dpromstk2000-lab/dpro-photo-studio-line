name: DPRO PHOTO R32O Atomic Customer Request PostgreSQL 17 QA NO DEPLOY
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: dpro-photo-r32o-isolated-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r32o-atomic-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: photo_qa
          POSTGRES_PASSWORD: ephemeral_fixture_only
          POSTGRES_DB: photo_qa
        options: >-
          --health-cmd "pg_isready -U photo_qa -d photo_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: R32O isolated SQL + review-only Worker QA (no checkout or external APIs)
        shell: bash
        env:
          R32O_ALLOW_DISPOSABLE_PG: "YES"
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          mapfile -t ids < <(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}')
          if [ "${#ids[@]}" -ne 1 ]; then
            echo 'REFUSE: expected exactly one disposable postgres:17 service container'
            exit 1
          fi
          export R32O_PG_CONTAINER_ID="${ids[0]}"
          wd="$(mktemp -d)"
          trap 'rm -rf "$wd"' EXIT
          cd "$wd"

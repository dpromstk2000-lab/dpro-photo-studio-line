name: DPRO PHOTO CRM BRUSHUP-5 LINE Segment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photo-crm-brushup-5:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f owner.html
          test -f config.js
          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-4-20260918' owner.html
          grep -F 'id="featureLineSegment" type="checkbox" disabled' owner.html
          grep -F 'line_segment: false' owner.html
          grep -F '<h3>LINEフォロー</h3>' owner.html
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create LINE segment runtime
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > photo-crm-segment.js
          node --check photo-crm-segment.js

      - name: Patch owner
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_owner_b5.py
          python -m py_compile /tmp/patch_owner_b5.py
          python /tmp/patch_owner_b5.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check photo-crm-segment.js

          grep -F 'DPRO-PHOTO-CRM-BRUSHUP-5-20260918' owner.html
          grep -F 'id="lineSegmentMount"' owner.html
          grep -F 'photo-crm-segment.js' owner.html
          grep -F 'line_segment: $("featureLineSegment").checked' owner.html
          grep -F 'csv_migration: false' owner.html
          grep -F 'line_customer_link: false' owner.html
          ! grep -F 'id="featureLineSegment" type="checkbox" disabled' owner.html

          grep -F '/api/admin/segments/preview' photo-crm-segment.js
          grep -F '/api/admin/segments/prepare' photo-crm-segment.js
          grep -F '/api/admin/segments/send' photo-crm-segment.js
          grep -F 'demo_record_only' photo-crm-segment.js

          python - <<'PY'
          from pathlib import Path
          import re, json
          s=Path("owner.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit("No inline owner JS found")
          Path("/tmp/owner-inline.js").write_text(inline[-1],encoding="utf-8")
          qa={
            "ok": True,
            "owner_marker": "DPRO-PHOTO-CRM-BRUSHUP-5-20260918",
            "segment_runtime": "DPRO-PHOTO-CRM-BRUSHUP-5-UI-20260918",
            "gateway": "dpro-photo-product-ready-gateway-v5",
            "dedupe": "customer_id",
            "demo_external_send": False,
            "csv_migration_locked": True,
            "line_customer_link_locked": True
          }
          Path("/tmp/photo-crm-b5-qa.json").write_text(json.dumps(qa,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          node --check /tmp/owner-inline.js

      - name: Create evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/photo-crm-brushup5
          cp /tmp/photo-crm-b5-qa.json product-ready-evidence/photo-crm-brushup5/static-qa.json
          cat > product-ready-evidence/photo-crm-brushup5/STATUS.txt <<EOF
          DPRO PHOTO CRM BRUSHUP-5
          SOURCE_HEAD=${SOURCE_HEAD}
          CRM_GATEWAY=dpro-photo-product-ready-gateway-v5
          CRM_DB=DPRO-PHOTO-CRM-BRUSHUP-5-DB-20260918
          OWNER_UI=DPRO-PHOTO-CRM-BRUSHUP-5-UI-20260918
          DEDUPE=customer_id
          CAMPAIGN_EXPIRY=15m
          DEMO_EXTERNAL_SEND=false
          LINE_MULTICAST_CHUNK=500
          CSV_MIGRATION=false
          LINE_CUSTOMER_LINK=false
          STATIC_QA=PASS
          EOF

      - name: Commit BRUSHUP-5 and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-crm-segment.js product-ready-evidence/photo-crm-brushup5
          git rm -f --ignore-unmatch .github/workflows/STEP-PHOTO-CRM-BRUSHUP-5.yml
          git commit -m "Add PHOTO CRM LINE segment BRUSHUP-5"
          git push origin HEAD:main

      - name: Final
        shell: bash
        run: |
          echo "DPRO PHOTO CRM BRUSHUP-5: PASS"
          echo "Demo mode records campaigns without external LINE sending."

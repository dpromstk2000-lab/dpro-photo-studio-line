name: DPRO PHOTO BRUSHUP-9-4 Setup Checklist HOTFIX1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-checklist-hotfix1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="24efce8807f62c31bc6a9939973f92d4f26f359b"
          HOTFIX=".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-4-SETUP-CHECKLIST-HOTFIX1.yml"
          FAILED=".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-4-SETUP-CHECKLIST.yml"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$HOTFIX"
          fi

          test -f "$FAILED"
          test -f owner.html
          test -f photo-owner-settings-v2.js
          test -f photo-owner-plan-resource.js
          test ! -f photo-owner-setup-checklist.js

          grep -F 'photo-owner-plan-resource.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-3-1-PRICE-LABEL-20260919' owner.html
          grep -F 'data-settings-group="${g.id}"' photo-owner-settings-v2.js
          grep -F '撮影プラン管理' photo-owner-settings-v2.js

      - name: Write setup checklist module
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > photo-owner-setup-checklist.js
          node --check photo-owner-setup-checklist.js

      - name: Patch owner page
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_owner_setup_checklist.py
          python -m py_compile /tmp/patch_owner_setup_checklist.py
          python /tmp/patch_owner_setup_checklist.py

      - name: Static validation corrected
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-owner-setup-checklist.js

          grep -F 'photo-owner-setup-checklist.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-4-SETUP-CHECKLIST-UI-20260919' owner.html
          grep -F '/api/admin/setup-checklist' photo-owner-setup-checklist.js
          grep -F '利用開始できます' photo-owner-setup-checklist.js
          grep -F '必須設定' photo-owner-setup-checklist.js
          grep -F '任意の外部連携' photo-owner-setup-checklist.js

          # These labels come from Gateway API, so validate the IDs/routes used by the UI instead of fixed display text.
          grep -F 'existing_site' photo-owner-setup-checklist.js
          grep -F 'line_booking' photo-owner-setup-checklist.js
          grep -F '予約画面・既存ホームページ連携' photo-owner-setup-checklist.js

          grep -F '状態を再確認' photo-owner-setup-checklist.js
          grep -F 'data-settings-group="basic"' photo-owner-setup-checklist.js
          git diff --check

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).split())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).split())
          changed |= untracked
          allowed={"owner.html","photo-owner-setup-checklist.js"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY

          grep -F 'photo-owner-settings-v2.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-1-2-UI-20260919' owner.html
          grep -F 'photo-owner-plan-resource.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-3-1-PRICE-LABEL-20260919' owner.html
          grep -F 'photo-booking-presentation.js?v=DPRO-PHOTO-PRODUCTION-READINESS-BRUSHUP-8-5-LINE-ENTRY-20260919' owner.html

      - name: Self-delete workflows and final validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-4-SETUP-CHECKLIST.yml"
          rm -f ".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-4-SETUP-CHECKLIST-HOTFIX1.yml"
          git diff --check

      - name: Commit BRUSHUP-9-4 HOTFIX1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-owner-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-owner-setup-checklist.js .github/workflows
          git diff --cached --check
          git commit -m "Add PHOTO Owner setup checklist BRUSHUP-9-4 HOTFIX1"
          git push origin HEAD:main

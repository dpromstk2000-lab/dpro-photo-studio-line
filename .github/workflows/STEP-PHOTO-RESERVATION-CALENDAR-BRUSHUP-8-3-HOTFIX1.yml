name: DPRO PHOTO BRUSHUP-8-3 Reservation Calendar UI HOTFIX1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reservation-calendar-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="40b391ff67fa2fe87d6d905031b6bbf6bb5993c3"
          WORKFLOW=".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-3-HOTFIX1.yml"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi
          test -f index.html
          test -f config.js
          test -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-3.yml"
          grep -F '<section class="panel" data-step="3" aria-labelledby="step3Title">' index.html
          grep -F '<input id="reservationDate" type="date" autocomplete="off">' index.html
          grep -F 'dpro-photo-product-ready-gateway-v3' config.js
          ! grep -F 'photo-booking-calendar-v2.js' index.html
          ! grep -F 'photo-booking-calendar-v2.css' index.html
          ! grep -F 'CALENDAR_API_BASE_URL' config.js

      - name: Write Calendar V2 assets
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > photo-booking-calendar-v2.js
          echo '' | base64 -d > photo-booking-calendar-v2.css
          echo '' | base64 -d > /tmp/patch_b8_3.py

      - name: Static validation before patch
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-booking-calendar-v2.js
          python -m py_compile /tmp/patch_b8_3.py
          grep -F 'DPRO-PHOTO-RESERVATION-CALENDAR-V2-BRUSHUP-8-3-UI-20260919' photo-booking-calendar-v2.js
          grep -F '/api/public/calendar-summary' photo-booking-calendar-v2.js
          grep -F 'reservation_calendar_v2 === true' photo-booking-calendar-v2.js
          grep -F '○' photo-booking-calendar-v2.js
          grep -F '△' photo-booking-calendar-v2.js
          grep -F '×' photo-booking-calendar-v2.js
          grep -F '休' photo-booking-calendar-v2.js

      - name: Patch index and config
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/patch_b8_3.py

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const API_BASE_URL =' config.js
          grep -F 'dpro-photo-product-ready-gateway-v3' config.js
          grep -F 'const CALENDAR_API_BASE_URL =' config.js
          grep -F 'dpro-photo-product-ready-gateway-v8' config.js
          grep -F 'photo-booking-calendar-v2.css?v=DPRO-PHOTO-RESERVATION-CALENDAR-V2-BRUSHUP-8-3-UI-20260919' index.html
          grep -F 'photo-booking-calendar-v2.js?v=DPRO-PHOTO-RESERVATION-CALENDAR-V2-BRUSHUP-8-3-UI-20260919' index.html
          grep -F '<input id="reservationDate" type="date" autocomplete="off">' index.html
          grep -F 'PUBLIC_AVAILABILITY' config.js
          grep -F 'PUBLIC_RESERVATIONS' config.js
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              "index.html",
              "config.js",
              "photo-booking-calendar-v2.js",
              "photo-booking-calendar-v2.css",
          }
          tracked = set(subprocess.check_output(["git","diff","--name-only"], text=True).split())
          untracked = set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"], text=True).split())
          changed = tracked | untracked
          extra = changed - allowed
          missing = allowed - changed
          if extra or missing:
              raise SystemExit(f"scope gate failed extra={sorted(extra)} missing={sorted(missing)}")
          print("scope gate PASS", sorted(changed))
          PY

      - name: Self-delete workflow and final validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-3.yml"
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-3-HOTFIX1.yml"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          i = Path("index.html").read_text(encoding="utf-8")
          c = Path("config.js").read_text(encoding="utf-8")
          assert i.count("photo-booking-calendar-v2.js") == 1
          assert i.count("photo-booking-calendar-v2.css") == 1
          assert c.count("CALENDAR_API_BASE_URL") == 2
          assert "dpro-photo-product-ready-gateway-v3" in c
          assert "dpro-photo-product-ready-gateway-v8" in c
          assert 'id="reservationDate"' in i
          print("final content gate PASS")
          PY

      - name: Commit BRUSHUP-8-3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add PHOTO reservation calendar V2 BRUSHUP-8-3 HOTFIX1"
          git push origin main

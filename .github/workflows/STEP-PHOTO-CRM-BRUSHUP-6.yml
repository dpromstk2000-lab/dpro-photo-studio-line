name: DPRO PHOTO CRM BRUSHUP-6 CSV Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photo-crm-brushup-6:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f owner.html
          test -f photo-crm-segment.js
          grep -F 'id="featureCsvMigration"' owner.html
          grep -F 'csv_migration: false, line_customer_link: false' owner.html
          grep -F 'photo-crm-segment.js' owner.html

      - name: Write CSV migration UI
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > photo-crm-import.js
          node --check photo-crm-import.js

      - name: Patch owner
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_owner.py
          python -m py_compile /tmp/patch_owner.py
          python /tmp/patch_owner.py

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check photo-crm-import.js
          grep -F 'photo-crm-import.js?v=DPRO-PHOTO-CRM-BRUSHUP-6-20260918' owner.html
          grep -F 'csv_migration: $("featureCsvMigration").checked, line_customer_link: false' owner.html
          grep -F 'dpro-photo-product-ready-gateway-v6' photo-crm-import.js
          grep -F 'LINEユーザーIDはこのCSV移行では取り込みません' photo-crm-import.js
          grep -F '既存顧客の氏名・電話・メールはCSVで自動上書きしません' photo-crm-import.js

      - name: Commit BRUSHUP-6 and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-crm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-crm-import.js
          git rm -f --ignore-unmatch .github/workflows/STEP-PHOTO-CRM-BRUSHUP-6.yml
          git commit -m "Add PHOTO CRM CSV migration BRUSHUP-6"
          git push origin HEAD:main

      - name: Final
        shell: bash
        run: |
          echo "DPRO PHOTO CRM BRUSHUP-6 CSV Migration: PASS"

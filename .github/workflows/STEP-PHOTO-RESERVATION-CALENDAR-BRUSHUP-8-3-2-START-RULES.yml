name: DPRO PHOTO BRUSHUP-8-3.2 Plan Start Rules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reservation-start-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="e57f3bb5235de9007b624fe72a58f170eb86021b"
          WORKFLOW=".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-3-2-START-RULES.yml"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi
          test -f index.html
          test -f config.js
          grep -F 'CALENDAR_API_BASE_URL' config.js
          grep -F 'function slotEndTime(slot)' index.html
          grep -F 'DPRO-PHOTO-RESERVATION-CALENDAR-V2-BRUSHUP-8-3-1-POLISH1-20260919' index.html

      - name: Patch public booking start rules
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python -m py_compile /tmp/patch.py
          python /tmp/patch.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'async function ensurePlanStartRule()' index.html
          grep -F 'function slotAllowedByPlanStartRule(slot)' index.html
          grep -F 'rawSlots.filter(slotAllowedByPlanStartRule)' index.html
          grep -F 'DPRO-PHOTO-RESERVATION-START-RULES-BRUSHUP-8-3-2-UI-20260919' index.html
          grep -F 'dpro-photo-product-ready-gateway-v8' config.js
          grep -F 'PUBLIC_AVAILABILITY: "/api/public/availability"' config.js
          git diff --check

      - name: Scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).split())
          allowed = {"index.html"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY

      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-3-2-START-RULES.yml"
          git diff --check

      - name: Commit BRUSHUP-8-3.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows
          git diff --cached --check
          git commit -m "Add PHOTO plan start rules BRUSHUP-8-3.2"
          git push origin HEAD:main

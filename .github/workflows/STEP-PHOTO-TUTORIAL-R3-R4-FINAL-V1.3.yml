name: DPRO PHOTO Tutorial R3-R4 Final V1.3

on:
  push:
    paths:
      - '.github/workflows/STEP-PHOTO-TUTORIAL-R3-R4-FINAL-V1.3.yml'

permissions:
  contents: write

jobs:
  tutorial-r3-r4-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: R3 fixed source gate
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED='09a21a8016fc06500d7ddfb74e6303764d687d3b'
          R3_BASE='7fc99278d73f6c59344d197eb4094cf19bb6deb6'
          R3_FIXED='3335644c9158030a20dc97478e01f5ea281ef3ae'
          git fetch origin main --quiet
          git merge-base --is-ancestor "$ACCEPTED" HEAD
          git merge-base --is-ancestor "$R3_BASE" HEAD
          git merge-base --is-ancestor "$R3_FIXED" HEAD
          test -f tutorial-data.js
          test -f tutorial.css
          test -f tutorial.js
          grep -q 'DPRO-TUTORIAL-PHOTO-V1.1-R4-20260828' tutorial-data.js
          grep -q 'dpro_tutorial_photo_v1_1' tutorial-data.js
          grep -q 'DPRO TUTORIAL V1.1 LOADER' config.js
          grep -q 'pointerdown' tutorial.js
          grep -q 'ArrowDown' tutorial.js
          grep -q 'Escape' tutorial.js
          grep -Fq 'try { handle.setPointerCapture?.(e.pointerId); } catch {}' tutorial.js
          python - <<'PY2'
          from pathlib import Path
          d=Path('tutorial-data.js').read_text(encoding='utf-8')
          j=Path('tutorial.js').read_text(encoding='utf-8')
          assert d.count('step: ') == 10
          for forbidden in ['fetch(', 'apiPost(', 'adminPost(', '.submit(', 'agreementCheck.checked', '.click()']:
              assert forbidden not in j, forbidden
          assert 'localStorage' in j and 'sessionStorage' not in j
          print('STATIC_R3_FIXED=PASS')
          PY2
          unexpected="$(git diff --name-only "$R3_FIXED"..HEAD | grep -Ev '^\.github/workflows/.*\.ya?ml$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected non-workflow files changed after R3 fixed commit:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo "ENTRY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R3_BASE_COMMIT=$R3_BASE" >> "$GITHUB_ENV"
          echo "R3_FIXED_COMMIT=$R3_FIXED" >> "$GITHUB_ENV"
          echo 'R3_FIXED_SOURCE_GATE=PASS'

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/photo-tutorial-qa
          cd /tmp/photo-tutorial-qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh R3 fixed LIVE baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo-tutorial-qa/baseline.mjs
          cd /tmp/photo-tutorial-qa
          node baseline.mjs
          cat /tmp/photo-r3-resume-baseline.json

      - name: R3 LIVE QA corrected
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo-tutorial-qa/r3.mjs
          cd /tmp/photo-tutorial-qa
          node r3.mjs
          cat /tmp/photo-r3-qa.json
          echo 'R3_LIVE_QA_CORRECTED=PASS'

      - name: Implement R4 Guide Center
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dpro-tutorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          echo '' | base64 -d > /tmp/patch-r4.py
          python /tmp/patch-r4.py
          grep -q 'id="tutorialFirst10"' demo-guide.html
          grep -q 'tutorial-data.js?v=DPRO-TUTORIAL-PHOTO-V1.1-R4-20260828' demo-guide.html
          if git diff --quiet -- demo-guide.html; then
            echo 'R4 Guide Center already present; no duplicate change.'
            echo "R4_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          else
            git add demo-guide.html
            git commit -m 'Build PHOTO Tutorial R4 Guide Center'
            echo "R4_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            git push origin HEAD:main
          fi

      - name: Wait R4 Pages
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-photo-studio-line/demo-guide.html?wait=resume-v11'
          for i in $(seq 1 48); do
            if curl -fsSL --max-time 15 "$URL&n=$i" | grep -q 'tutorialFirst10'; then echo 'R4_PAGES_READY=PASS'; exit 0; fi
            sleep 5
          done
          echo 'R4 Pages sentinel timeout' >&2
          exit 1

      - name: R4 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/photo-tutorial-qa/r4.mjs
          cd /tmp/photo-tutorial-qa
          node r4.mjs
          cat /tmp/photo-r4-qa.json
          echo 'R4_LIVE_QA=PASS'

      - name: Commit R4 evidence
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name 'dpro-tutorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          mkdir -p tutorial-evidence/photo-r4
          cp /tmp/photo-r3-resume-baseline.json tutorial-evidence/photo-r4/R3_RESUME_BASELINE.json
          cp /tmp/photo-r3-qa.json tutorial-evidence/photo-r4/R3_QA.json
          cp /tmp/photo-r4-qa.json tutorial-evidence/photo-r4/R4_QA.json
          cat > tutorial-evidence/photo-r4/IMPLEMENTATION_SUMMARY.txt <<EOF2
          SYSTEM=PHOTO
          STANDARD=V1.1
          FIRST10=10_EXACT
          R3_QA=PASS
          R3_QA_FIX=QA_ARROW_RIGHT_TO_ARROW_DOWN_FOR_VIEWPORT_CLAMP
          R3_HOTFIX=SAFE_POINTER_CAPTURE
          PREVIOUS_FAILED_RUNS=33131048191,33131791905
          R4_QA=PASS
          BUSINESS_MUTATION=0
          ACCEPTED_BASE=09a21a8016fc06500d7ddfb74e6303764d687d3b
          R3_BASE_COMMIT=$R3_BASE_COMMIT
          R3_FIXED_COMMIT=$R3_FIXED_COMMIT
          R4_COMMIT=$R4_COMMIT
          ENTRY_HEAD=$ENTRY_HEAD
          CHANGED_PRODUCT_FILES=config.js,index.html,owner-ipad.html,member.html,owner.html,tutorial-data.js,tutorial.css,tutorial.js,demo-guide.html
          DB_WORKER_API_AUTH_ROLE_PERMISSION_FEATURE_FLAG_CHANGE=0
          WORKFLOW_CLEANUP=NOT_PERFORMED_GITHUB_APP_WORKFLOW_PERMISSION_LIMIT
          R5=NOT_STARTED
          R7=NOT_AUTHORIZED
          EOF2
          git add tutorial-evidence/photo-r4
          git commit -m 'Finalize PHOTO Tutorial R4 evidence'
          git push origin HEAD:main
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"

    branches: [main]
    paths:
      - '.github/workflows/dpro-photo-booking-calendar-date-navigation-r9.yml'
permissions:
  contents: write
concurrency:
  group: dpro-photo-booking-calendar-r9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  calendar-r9:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

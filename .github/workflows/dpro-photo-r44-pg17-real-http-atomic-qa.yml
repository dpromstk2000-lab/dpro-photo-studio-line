      - name: Real HTTP E2E with isolated PostgreSQL 17 (no external LINE or production)
        env:
          R44_ALLOWED_LOOPBACK: "YES"
          R44_PG17_ADAPTER: "TRUE"
          R44_DISPOSABLE_PG17: "TRUE"
          PGHOST: "127.0.0.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r44_disposable_only"
          python3 -m py_compile R44_PG17_LOOPBACK_ADAPTER.py
          node --check R44_REAL_HTTP_GATEWAY_WORKER_QA.cjs
          node --check R44_WORKER_BOOKING_REPLAY_REVIEW_ONLY_DO_NOT_DEPLOY.mjs
          python3 -u R44_PG17_LOOPBACK_ADAPTER.py > "$RUNNER_TEMP/r44_pg_adapter.log" 2>&1 &
          pgpid=$!
          trap 'kill "$pgpid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 50); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:18778/health > /dev/null; then ready=1; break; fi
            if ! kill -0 "$pgpid" 2>/dev/null; then cat "$RUNNER_TEMP/r44_pg_adapter.log"; exit 1; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/r44_pg_adapter.log"; exit 1; fi
          node R44_REAL_HTTP_GATEWAY_WORKER_QA.cjs || { cat "$RUNNER_TEMP/r44_pg_adapter.log"; exit 1; }
          echo "R44_REAL_HTTP_PG17_QA_SUCCEEDED isolated DB, no production, no LINE send"

name: DPRO PHOTO R44 Standalone Real HTTP Gateway Worker PG17 Atomic QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r44-loopback-postgres-only:
    name: Real HTTP gateway to Worker to disposable PG17 (NO PRODUCTION)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: R36V_ONLY_DISPOSABLE_PORT_5432
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Python for temporary isolated PostgreSQL adapter
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Node for real localhost TCP HTTP servers
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client into disposable runner only
        run: python3 -m pip install 'psycopg[binary]==3.2.10'
      - name: Verify SHA256 and unpack sealed review-only sources (no checkout)
        env:
          R44_PG17_ONLY: "TRUE"

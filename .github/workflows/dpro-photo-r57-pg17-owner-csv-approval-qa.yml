name: DPRO PHOTO R57.2 PG17 Owner CSV Offline Write Isolation Fix (DISPOSABLE ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv-owner-approval-pg17:
    name: R57 Owner CSV preview to isolated import (NO PRODUCTION)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photo_r56_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photo_r56_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: photo_r56_disposable
      R56_ISOLATED_ONLY: "YES"
      R57_FIXTURE_ONLY: "YES"
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unseal R57 reviewed source and verify 9 SHA256 sums (NO CHECKOUT OR SECRETS)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,hashlib,base64,gzip
          root=pathlib.Path('/tmp/dpro-photo-r57-disposable')
          root.mkdir(parents=True,exist_ok=True)
          sealed={
              'R53_CSV_IMPORT_PREFLIGHT_READ_ONLY.py': ('1b50d9ca95ae7488b790a359e2edc1de5dc9bacfd0865e099d138ef19c920599', ''),
              'R56_CSV_PG17_IMPORT_REHEARSAL.py': ('448dde12830c7a85d00746023048191e602a17ec0e48407935837e943952b86b', ''),
              'R56_DISPOSABLE_SCHEMA.sql': ('91e707c2823618e17e5e45aee0b436748eac29d59af95d9e0b52379e11ab84c1', ''),
              'R53_SYNTHETIC_CUSTOMERS.csv': ('c3c6f835e9abaac3176348c20d3d9c701141a890ccb6dbd44e6fad8ed31b0215', ''),
              'R53_SYNTHETIC_SUBJECTS.csv': ('42d9ac3c25651da94ea8dcc5c33f23a327b37fbf6baaad4e273bea9fdd4c9e91', 'H4sIAAAAAAAC/3s2ad3TvRufrt/3YuPCFw2tni46Lxcuf7puEZDxDFXq6YReHQjnac+upx1tOs+nzH+6c8uzOR3Ppi/Veb5t1rP5LVzBugYGBoY6zhDq2ZI5z+bvfrqh6fmUFQpP105w1EnOyMxJ0TEyMDLSNzTQNzDVAYpCNBnh0uSE0GSib2Cmb2iI0GQM0WSEpmndtmfT+3UKUouK8/N0dCBcLgBNDS+r6gAAAA=='),
              'R53_CSV_MAPPING_TEMPLATE.json': ('22e7a7b9c6496c232f71c6d38a7fc9db7e3fc2ed8ef4e88c4a81352ae2e1743e', ''),
              'R57_IMPORT_APPROVAL_GATE.py': ('8d54ef4ab64439207e13261a4a78fc871324c385ca6b404f3d3c0d1282fd6ef2', ''),
              'R57_APPROVAL_GATE_OFFLINE_QA.py': ('4fe82aa905e5da363ff02ba60ff01eaac19d8fb4b3f1f7bbef05e524220fb86a', ''),
              'R57_PG17_APPROVAL_QA.py': ('fa71b83cdac44e07e4413ba9a32671824127c990b065ded0b1ad347c33c69028', ''),
          }
          assert len(sealed)==9
          for name,(sha,blob) in sealed.items():
              assert "/" not in name and ".." not in name
              data=gzip.decompress(base64.b64decode(blob,validate=True))
              assert hashlib.sha256(data).hexdigest()==sha,name
              (root/name).write_bytes(data)
              print("PASS SHA256",name)
          PY
      - name: Install pinned psycopg for disposable PostgreSQL 17
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"
      - name: Verify pinned PostgreSQL client before any R57 imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYVALIDATE'
          import psycopg
          assert psycopg.__version__ == '3.2.9', psycopg.__version__
          print('PASS R57.1 psycopg dependency ready before offline QA')
          PYVALIDATE
      - name: R57 owner preview and approval offline QA (NO DB writes)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r57-disposable
          python -m py_compile *.py
          python -u R57_APPROVAL_GATE_OFFLINE_QA.py
      - name: Create R56-compatible schema and run R57 preview-approved PG17 migration
        env:
          R57_ENABLE_DISPOSABLE_COMMIT: "YES"
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dpro-photo-r57-disposable
          python - <<'PY'
          import pathlib,psycopg,os
          assert os.environ["PGHOST"]=="127.0.0.1" and os.environ["PGDATABASE"]=="photo_r56_disposable"
          sql=pathlib.Path("R56_DISPOSABLE_SCHEMA.sql").read_text()
          with psycopg.connect(host=os.environ['PGHOST'],port=5432,dbname=os.environ['PGDATABASE'],user='postgres',password='postgres',autocommit=True) as c:
              c.execute(sql)
          PY
          python -u R57_PG17_APPROVAL_QA.py

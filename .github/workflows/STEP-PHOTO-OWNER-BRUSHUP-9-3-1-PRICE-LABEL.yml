name: DPRO PHOTO BRUSHUP-9-3.1 Price Label

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  price-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="d4c5b5687bdc74f3c3d1d324e1103984c6b56d9a"
          WORKFLOW=".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-3-1-PRICE-LABEL.yml"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi

          grep -F 'DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-3-UI-20260919' photo-owner-plan-resource.js
          grep -F 'photo-owner-plan-resource.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-3-UI-20260919' owner.html
          grep -F 'toLocaleString("ja-JP")}円〜' photo-owner-plan-resource.js

      - name: Patch price label presentation
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_price_label.py
          echo '' | base64 -d > /tmp/patch_owner_cache.py
          python -m py_compile /tmp/patch_price_label.py /tmp/patch_owner_cache.py
          python /tmp/patch_price_label.py
          python /tmp/patch_owner_cache.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-owner-plan-resource.js
          grep -F 'DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-3-1-PRICE-LABEL-20260919' photo-owner-plan-resource.js
          grep -F 'row.price_label ||' photo-owner-plan-resource.js
          grep -F 'photo-owner-plan-resource.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-3-1-PRICE-LABEL-20260919' owner.html
          git diff --check

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).split())
          allowed={"owner.html","photo-owner-plan-resource.js"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY
          grep -F '/api/admin/plan-resource-management' photo-owner-plan-resource.js
          grep -F '指定開始時刻' photo-owner-plan-resource.js
          grep -F 'photo-owner-settings-v2.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-1-2-UI-20260919' owner.html

      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-3-1-PRICE-LABEL.yml"
          git diff --check

      - name: Commit BRUSHUP-9-3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-owner-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-owner-plan-resource.js .github/workflows
          git diff --cached --check
          git commit -m "Use PHOTO plan price labels in Owner UI"
          git push origin HEAD:main

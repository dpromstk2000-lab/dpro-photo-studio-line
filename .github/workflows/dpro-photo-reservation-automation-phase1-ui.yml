name: DPRO Photo Reservation Automation Phase 1 UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Phase 1 UI
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_photo_phase1_ui.py
          python /tmp/dpro_photo_phase1_ui.py

      - name: Validate
        shell: bash
        run: |
          node --check photo-reservation-automation-ui.js
          node --check photo-owner-settings-v2.js
          node --check photo-feature-switch-ui-v2.js
          python - <<'PY'
          from pathlib import Path

          config = Path("config.js").read_text(encoding="utf-8")
          owner = Path("owner.html").read_text(encoding="utf-8")
          settings = Path("photo-owner-settings-v2.js").read_text(encoding="utf-8")
          feature = Path("photo-feature-switch-ui-v2.js").read_text(encoding="utf-8")
          auto = Path("photo-reservation-automation-ui.js").read_text(encoding="utf-8")

          checks = {
              "v9_frontend": "dpro-photo-product-ready-gateway-v9" in config,
              "auto_reminder_switch": 'id="featureReservationAutoReminder"' in owner,
              "waitlist_switch": 'id="featureReservationWaitlist"' in owner,
              "render_flags": '$("featureReservationAutoReminder").checked' in owner and '$("featureReservationWaitlist").checked' in owner,
              "save_flags": 'reservation_auto_reminder: $("featureReservationAutoReminder").checked' in owner and 'reservation_waitlist: $("featureReservationWaitlist").checked' in owner,
              "automation_script": "photo-reservation-automation-ui.js?v=DPRO-PHOTO-RESERVATION-AUTOMATION-UI-PHASE1-20261006" in owner,
              "automation_nav": 'id: "automation", label: "予約自動化"' in settings,
              "feature_cards": "featureReservationAutoReminder" in feature and "featureReservationWaitlist" in feature,
              "ui_api": "/api/admin/reservation-automation" in auto,
              "ui_waitlist": "/api/admin/waitlist/status" in auto,
              "ui_process": "/api/admin/reservation-automation/process-now" in auto,
          }
          print(checks)
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit("ERROR: validation failed: " + ", ".join(failed))
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js owner.html photo-owner-settings-v2.js photo-feature-switch-ui-v2.js photo-reservation-automation-ui.js
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Add DPRO Photo reservation automation Phase 1 UI"
          git push

name: DPRO PHOTO R32W Full Booking Shape Copy-Only QA NO DEPLOY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r32w-full-booking-staging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact public repo without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R32W synthetic full booking and actual index copy-only patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dpro_photo_r32w
          cat > /tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_REVIEW_ONLY.mjs.b64 <<'R32W_R32W_FULL_BOOKING_GATEWAY_REVIEW_ONLY_mjs'
          
          R32W_R32W_FULL_BOOKING_GATEWAY_REVIEW_ONLY_mjs
          base64 -d /tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_REVIEW_ONLY.mjs.b64 > /tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_REVIEW_ONLY.mjs
          printf '%s  %s\n' 'a8079efee617df2f4ea8656e272fce94c533b9bf8875d8bc7f8a2887677d0c2a' '/tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_REVIEW_ONLY.mjs' | sha256sum -c -
          cat > /tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_TEST.mjs.b64 <<'R32W_R32W_FULL_BOOKING_GATEWAY_TEST_mjs'
          
          R32W_R32W_FULL_BOOKING_GATEWAY_TEST_mjs
          base64 -d /tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_TEST.mjs.b64 > /tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_TEST.mjs
          printf '%s  %s\n' '74799a70b278017e1274d62578883c2aefec9a5153c591123e75448f15d51a6c' '/tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_TEST.mjs' | sha256sum -c -
          cat > /tmp/dpro_photo_r32w/R32W_PATCH_PUBLIC_BOOKING_COPY_ONLY.py.b64 <<'R32W_R32W_PATCH_PUBLIC_BOOKING_COPY_ONLY_py'
          
          R32W_R32W_PATCH_PUBLIC_BOOKING_COPY_ONLY_py
          base64 -d /tmp/dpro_photo_r32w/R32W_PATCH_PUBLIC_BOOKING_COPY_ONLY.py.b64 > /tmp/dpro_photo_r32w/R32W_PATCH_PUBLIC_BOOKING_COPY_ONLY.py
          printf '%s  %s\n' '4d9e9d30efe35f35e5d91a0e4f956b4294ccbceb5a52939248e6853de45f398e' '/tmp/dpro_photo_r32w/R32W_PATCH_PUBLIC_BOOKING_COPY_ONLY.py' | sha256sum -c -
          cat > /tmp/dpro_photo_r32w/R32W_PATCH_FIXTURE_TEST.py.b64 <<'R32W_R32W_PATCH_FIXTURE_TEST_py'
          
          R32W_R32W_PATCH_FIXTURE_TEST_py
          base64 -d /tmp/dpro_photo_r32w/R32W_PATCH_FIXTURE_TEST.py.b64 > /tmp/dpro_photo_r32w/R32W_PATCH_FIXTURE_TEST.py
          printf '%s  %s\n' '42b9053dbd9f8410cd1d9d4fc8c7d996f4959bb026dcd092c11a55e68cd340e4' '/tmp/dpro_photo_r32w/R32W_PATCH_FIXTURE_TEST.py' | sha256sum -c -
          echo '==== R32W real frontend SHA gate ===='
          test "$(git hash-object index.html)" = "135e879b5501d551302066326f4aca5f3dba9999"
          test "$(git hash-object config.js)" = "884ec27be768101a41447e87b76785852c4c4b12"
          echo 'PASS actual index.html and config.js unchanged'
          echo '==== R32W full booking payload behavior QA ===='
          node --test /tmp/dpro_photo_r32w/R32W_FULL_BOOKING_GATEWAY_TEST.mjs | tee /tmp/dpro_photo_r32w/node.log
          grep -q '# pass 46' /tmp/dpro_photo_r32w/node.log
          grep -q '# fail 0' /tmp/dpro_photo_r32w/node.log
          echo '==== R32W patch fixture QA ===='
          python /tmp/dpro_photo_r32w/R32W_PATCH_FIXTURE_TEST.py | tee /tmp/dpro_photo_r32w/patch.log
          grep -q 'R32W PATCH FIXTURE: 14 PASS / 0 FAIL' /tmp/dpro_photo_r32w/patch.log
          echo '==== R32W actual frontend COPY ONLY ===='
          python /tmp/dpro_photo_r32w/R32W_PATCH_PUBLIC_BOOKING_COPY_ONLY.py index.html /tmp/dpro_photo_r32w/index.copy-only.html
          python - <<'PYQA'
          from pathlib import Path
          import re,subprocess
          p=Path('/tmp/dpro_photo_r32w/index.copy-only.html');t=p.read_text(encoding='utf8')
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',t,flags=re.I)
          checked=0
          for i,(attrs,code) in enumerate(scripts):
            if 'src=' in attrs.lower() or 'application/ld+json' in attrs.lower():continue
            if not code.strip():continue
            c=Path(f'/tmp/dpro_photo_r32w/inline-{i}.js');c.write_text(code,encoding='utf8')
            subprocess.run(['node','--check',str(c)],check=True);checked+=1
          assert checked>0, 'no inline scripts checked'
          assert t.count('async function r32wGetBookingKey(')==1
          assert 'request_key: r32wIdempotency' in t
          assert 'sessionStorage.removeItem("dpro_photo_booking_idempotency_r32w_v1")' in t
          print(f'PASS copy-only actual index inline scripts: {checked}')
          PYQA
          test "$(git hash-object index.html)" = "135e879b5501d551302066326f4aca5f3dba9999"
          test -z "$(git status --porcelain)"
          echo 'PASS repository unchanged / no Commit / no Deploy / no SQL / no LINE / no network APIs'
          {
            echo '## DPRO PHOTO R32W — full booking shape / copy-only staging QA'
            echo '- 46/46 isolated adapter behavior checks PASS'
            echo '- 14/14 patch fixture checks PASS'
            echo '- Real GitHub index.html source SHA verified; patch applied only to /tmp; all inline scripts parsed'
            echo '- The new adapter preserves the original public booking fields, but its issuer/placement/DB interfaces are MOCKS.'
            echo '- RELEASE HOLD: no real issuer, no real-schema RPC, no actual Gateway/Worker E2E; do not deploy.'
            echo '- No checkout writes, no live SQL, no LINE send, no Worker deploy.'
          } >> "$GITHUB_STEP_SUMMARY"

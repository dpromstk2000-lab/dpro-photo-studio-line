name: DPRO PHOTO BRUSHUP-8-5 Production Readiness

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="8e17d76ac85e57319ec58277721e596e8833e9c0"
          WORKFLOW=".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-5-PRODUCTION-READINESS.yml"
          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi

          test -f index.html
          test -f owner.html
          test -f photo-booking-presentation.js
          test -f config.js

          grep -F 'publicHomeLink' index.html
          grep -F 'bookingChannelLine' photo-booking-presentation.js
          grep -F 'DPRO-PHOTO-BOOKING-PRESENTATION-BRUSHUP-8-4-1-SAVE-FEEDBACK-20260919' owner.html
          grep -F 'dpro-photo-product-ready-gateway-v8' config.js

      - name: Patch LINE booking entry
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_index.py
          echo '' | base64 -d > /tmp/patch_presentation.py
          echo '' | base64 -d > /tmp/patch_owner.py

          python -m py_compile /tmp/patch_index.py /tmp/patch_presentation.py /tmp/patch_owner.py
          python /tmp/patch_index.py
          python /tmp/patch_presentation.py
          python /tmp/patch_owner.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-booking-presentation.js

          grep -F 'publicLineBookingLink' index.html
          grep -F 'LINEから予約</a>' index.html
          grep -F 'presentation.line_booking_url' index.html
          grep -F 'DPRO-PHOTO-PRODUCTION-READINESS-BRUSHUP-8-5-LINE-ENTRY-20260919' index.html

          grep -F 'bookingLineBookingUrl' photo-booking-presentation.js
          grep -F 'line_booking_url: lineBookingUrl || null' photo-booking-presentation.js
          grep -F 'LINEから予約をONにする場合は、LINE予約URLを入力してください。' photo-booking-presentation.js
          grep -F 'DPRO-PHOTO-PRODUCTION-READINESS-BRUSHUP-8-5-LINE-ENTRY-20260919' owner.html

          git diff --check

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git","diff","--name-only"], text=True).split())
          allowed = {"index.html", "owner.html", "photo-booking-presentation.js"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY

          grep -F 'dpro-photo-product-ready-gateway-v3' config.js
          grep -F 'dpro-photo-product-ready-gateway-v8' config.js
          grep -F 'PUBLIC_AVAILABILITY: "/api/public/availability"' config.js

          grep -F 'async function ensurePlanStartRule()' index.html
          grep -F 'rawSlots.filter(slotAllowedByPlanStartRule)' index.html
          grep -F 'function setSaveButton(state = "idle")' photo-booking-presentation.js
          grep -F 'dpro:photo-settings-rendered' photo-booking-presentation.js

      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-RESERVATION-CALENDAR-BRUSHUP-8-5-PRODUCTION-READINESS.yml"
          git diff --check

      - name: Commit BRUSHUP-8-5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html owner.html photo-booking-presentation.js .github/workflows
          git diff --cached --check
          git commit -m "Harden PHOTO production readiness BRUSHUP-8-5"
          git push origin HEAD:main

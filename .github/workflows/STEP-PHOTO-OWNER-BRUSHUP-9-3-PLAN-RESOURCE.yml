name: DPRO PHOTO BRUSHUP-9-3 Plan Resource Management

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan-resource-management:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Source and drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="731e5484d7231823c1dbe8b0988c83515e3ac6f7"
          WORKFLOW=".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-3-PLAN-RESOURCE.yml"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            PARENT_SHA="$(git rev-parse HEAD^)"
            test "$PARENT_SHA" = "$BASE_SHA"
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            test "$CHANGED" = "$WORKFLOW"
          fi

          test -f owner.html
          test -f photo-owner-settings-v2.js
          grep -F 'DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-1-2-UI-20260919' owner.html
          grep -F '撮影プラン管理' photo-owner-settings-v2.js

      - name: Write plan resource module
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > photo-owner-plan-resource.js
          node --check photo-owner-plan-resource.js

      - name: Patch owner page
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_owner_plan_resource.py
          python -m py_compile /tmp/patch_owner_plan_resource.py
          python /tmp/patch_owner_plan_resource.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check photo-owner-plan-resource.js
          grep -F 'photo-owner-plan-resource.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-3-UI-20260919' owner.html
          grep -F '/api/admin/plan-resource-management' photo-owner-plan-resource.js
          grep -F '/api/admin/plan-resource-management/plan/save' photo-owner-plan-resource.js
          grep -F '/api/admin/plan-resource-management/resource/save' photo-owner-plan-resource.js
          grep -F '指定開始時刻' photo-owner-plan-resource.js
          grep -F '＋ プランを追加' photo-owner-plan-resource.js
          grep -F '＋ 撮影スペースを追加' photo-owner-plan-resource.js
          grep -F '公開中プランで使用中の場合は安全のため停止できません。' photo-owner-plan-resource.js
          git diff --check

      - name: Regression and scope gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).split())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).split())
          changed |= untracked
          allowed={"owner.html","photo-owner-plan-resource.js"}
          if changed != allowed:
              raise SystemExit(f"scope gate failed changed={sorted(changed)}")
          PY

          grep -F 'photo-owner-settings-v2.js?v=DPRO-PHOTO-OWNER-OPERATIONS-BRUSHUP-9-1-2-UI-20260919' owner.html
          grep -F 'photo-booking-presentation.js?v=DPRO-PHOTO-PRODUCTION-READINESS-BRUSHUP-8-5-LINE-ENTRY-20260919' owner.html
          grep -F 'photo-crm-line-link.js?v=DPRO-PHOTO-CRM-BRUSHUP-7-20260918' owner.html

      - name: Self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ".github/workflows/STEP-PHOTO-OWNER-BRUSHUP-9-3-PLAN-RESOURCE.yml"
          git diff --check

      - name: Commit BRUSHUP-9-3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-photo-owner-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html photo-owner-plan-resource.js .github/workflows
          git diff --cached --check
          git commit -m "Add PHOTO plan and resource management BRUSHUP-9-3"
          git push origin HEAD:main

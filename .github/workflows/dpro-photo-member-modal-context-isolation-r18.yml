           ok('no real tokens in test report names',()=>assert(passed.every(v=>!v.includes('token-a')&&!v.includes('line-a'))));
           const report={product:'DPRO PHOTO',gate:'R18 MEMBER REQUEST MODAL CONTEXT ISOLATION',mode:'OFFLINE_BROWSER_VM_SYNTHETIC',counts:{passed:passed.length,failed:0},checks:passed,productionReady:false,realApiRequests:0,reservationMutations:0,customerMutations:0};
           fs.writeFileSync('DPRO_PHOTO_PRODUCT_GATE_R18.json',JSON.stringify(report,null,2)+'\n');console.log(`DPRO PHOTO R18 ${passed.length} PASS 0 FAIL`);
          })().catch(e=>{console.error('R18 REGRESSION FAILURE:',String(e?.stack||e));process.exitCode=1;});
          NODE_R18_TEST
          node __r18_regression.js
          cat > __r17_regression.js <<'NODE_R17_REGRESSION'
          'use strict';
          const fs=require('fs'),assert=require('node:assert/strict'),vm=require('vm');
          const html=fs.readFileSync('member.html','utf8');
          const checks=[];
          const ok=(name,fn)=>{fn();checks.push(name)};
          const aok=async(name,fn)=>{await fn();checks.push(name)};
          function deferred(){let resolve,reject;const promise=new Promise((res,rej)=>{resolve=res;reject=rej});return {promise,resolve,reject,settled:false}}
          const marker='DPRO-PHOTO-R17-MEMBER-REFRESH-TRUTHFUL-STATUS-20261010';
          const loadBegin=html.indexOf('      async function loadMember(options = {}) {');
          const loadEnd=html.indexOf('      /* DPRO-PHOTO-MEMBER-DEMO-SESSION-REFRESH',loadBegin);
          const refreshBegin=html.indexOf('        // '+marker);
          const refreshEnd=html.indexOf("        $$('.tab').forEach",refreshBegin);
          assert(loadBegin>0&&loadEnd>loadBegin&&refreshBegin>0&&refreshEnd>refreshBegin,'R17 unexpected source boundaries');
          const loadCode=html.slice(loadBegin,loadEnd),refreshCode=html.slice(refreshBegin,refreshEnd);
          function harness(kind='line',id='demo_photo_line_001'){
           const state={lookup:kind==='line'?{line_user_id:id,public_token:''}:{line_user_id:'',public_token:id},customer:null,profile:null,reservations:[],selectedReservationId:'',memberLoadSeq:0,loadedLookup:null,refreshFeedbackSeq:0,requestSubmitting:false};
           const calls=[],effects=[],timers=[],handlers={};
           const refreshButton={textContent:'更新',disabled:false,addEventListener(_evt,fn){handlers.refresh=fn}};
           const els={memberArea:{hidden:true},refreshButton};
           const location={href:'https://dpromstk2000-lab.github.io/dpro-photo-studio-line/member.html?demo=1&section=reservations'};
           const context={state,els,location,URL,
            C:{ENDPOINTS:{MEMBER_RESERVATIONS:'/api/member/reservations',MEMBER_PROFILE:'/api/member/profile'},apiGet(path,query){let d=deferred();calls.push({path,query,d});return d.promise}},
            setLoading(b){effects.push(b?'loading-on':'loading-off')},setAccessMode(x){effects.push('access-'+x)},persistLookup(){effects.push('persist')},renderAll(){effects.push('render')},setSection(){effects.push('section')},scrubMemberQueryFromAddressBar(){effects.push('scrub')},showToast(t){effects.push('toast')},errorMessage:e=>e?.message||'unknown',setTimeout(fn){timers.push(fn)},console};
           vm.createContext(context);vm.runInContext(loadCode+'\nglobalThis.loadMemberTest=loadMember;',context);vm.runInContext(refreshCode,context);
           function pending(which=id){return calls.filter(x=>Object.values(x.query).includes(which)&&!x.d.settled)}
           function finish(which,label){let arr=pending(which);assert.equal(arr.length,kind==='token'||String(which).startsWith('token')?1:2,'expected pending API requests');for(let x of arr){x.d.settled=true;x.d.resolve(x.path.includes('/profile')?{customer:{customer_name:'profile-'+label}}:{customer:{customer_name:label},reservations:[{id:'reservation-'+label,reservation_no:label}]})}}
